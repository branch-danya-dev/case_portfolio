title: Роль и процесс
page: role/sa-vs-ba
items:
  - id: role-sa-vs-ba
    level: junior
    question: Чем системный аналитик отличается от бизнес-аналитика?
    tags: [роль]
    answer: |
      Разница — в предмете и уровне детализации.

      | | Бизнес-аналитик | Системный аналитик |
      |---|---|---|
      | Предмет | Как работает **бизнес**: процессы, цели, проблемы | Что делает **система** и как она обменивается данными |
      | Главный вопрос | Что и зачем нужно бизнесу? | Как это реализовать в системе, чтобы разработка поняла однозначно? |
      | Типовые артефакты | AS-IS, TO-BE, gap-анализ, БТ | Use cases, ФТ, НФТ, модель данных, статусы, интеграции, API, маппинг |
      | Собеседники | Заказчик, пользователи, руководители | Разработка, архитектор, QA, владельцы смежных систем |

      Граница размыта: в банках «СА» часто делает и бизнес-анализ, на малом проекте это один человек.
      Хороший ответ на собеседовании — привести пример, где проходила граница на вашем проекте.

  - id: role-sa-responsibilities
    level: junior
    question: За что отвечает системный аналитик на проекте?
    tags: [роль]
    answer: |
      За то, **чтобы разработка и тестирование однозначно понимали, что строить**, и чтобы это совпадало с потребностью бизнеса:

      - выявляет и уточняет требования, переводит БТ в ФТ и НФТ;
      - проектирует поведение системы: use cases, статусные модели, бизнес-правила;
      - проектирует данные и интеграции: модель данных, контракты API, маппинг, сценарии ошибок;
      - ведёт трассировку и анализ влияния изменений;
      - сопровождает разработку и тестирование: отвечает на вопросы, разбирает спорные дефекты («баг или неверное требование»), участвует в приёмке.

      Чего СА обычно **не** делает сам: не утверждает бизнес-требования (заказчик), не выбирает технологии (архитектор), не пишет тест-кейсы (QA, но СА проверяет полноту).

  - id: role-po-vs-sa
    level: middle
    question: Чем роль системного аналитика отличается от Product Owner?
    tags: [роль, scrum]
    answer: |
      **Product Owner** отвечает за **ценность** продукта: владеет бэклогом, решает, что делать и в каком порядке, принимает результат спринта.

      **Системный аналитик** отвечает за **качество и полноту требований**: детализирует истории, пишет критерии приёмки, проектирует данные и интеграции.

      Коротко: PO решает **что и когда**, СА помогает описать **что именно и как это должно работать**. Конфликт возникает, когда СА начинает приоритизировать за PO или PO — проектировать интеграции.

  - id: role-lifecycle
    level: junior
    question: Назовите этапы проекта и чем занят аналитик на каждом.
    tags: [жизненный цикл]
    answer: |
      | Этап | Что делает СА |
      |---|---|
      | Инициация | Помогает уточнить скоуп, называет интеграционные риски, рисует черновой контекст |
      | Обследование | Интервью, выгрузки и статистика из систем (часто вместе с БА) |
      | Бизнес-анализ | Проверяет реализуемость TO-BE |
      | Системный анализ | **Основная работа:** use cases, ФТ, НФТ, ролевая модель, бэклог |
      | Проектирование | Данные, статусы, интеграции, контракты, маппинг — вместе с архитектором |
      | Разработка | Отвечает на вопросы, уточняет требования, ревьюит контракты |
      | Тестирование | Разбирает спорные дефекты, проверяет полноту тестов по трассировке |
      | Внедрение | Миграция и сверка данных, инструкции |
      | Эксплуатация | Разбор инцидентов, требования на развитие |

      В Agile этапы 2–7 повторяются в каждом инкременте, но инициация и «скелет» архитектуры делаются в начале.

  - id: role-raci-letters
    level: junior
    question: Что означают буквы в RACI и какое главное правило матрицы?
    tags: [raci]
    answer: |
      - **R — Responsible:** делает работу. Может быть несколько.
      - **A — Accountable:** отвечает за результат и утверждает. **Ровно один на строку.**
      - **C — Consulted:** консультирует до или во время работы (двусторонняя связь).
      - **I — Informed:** получает информацию о результате (односторонняя связь).

      Главное правило: в каждой строке ровно одна A и хотя бы одна R. A и R могут совпадать (R/A), если человек и делает, и утверждает.

  - id: role-raci-mistakes
    level: middle
    question: Какие ошибки делают в RACI-матрицах?
    tags: [raci]
    answer: |
      - Несколько A в строке — непонятно, кто принимает решение; споры и задержки.
      - Нет A — никто не отвечает за результат.
      - Нет R — работу никто не делает.
      - Слишком много C — каждое согласование превращается в долгий цикл.
      - Все стоят в I «на всякий случай» — люди перестают читать рассылки.
      - Строки слишком крупные («Проект») — матрица ничего не проясняет.
      - Забыты стейкхолдеры с правом вето: ИБ, аудит, владельцы смежных систем.

  - id: role-artifacts-stage
    level: middle
    question: Какие артефакты появляются на каком этапе проекта?
    tags: [артефакты]
    answer: |
      От «зачем» к «как»:

      1. **Инициация:** устав, реестр стейкхолдеров, черновой контекст.
      2. **Обследование и бизнес-анализ:** AS-IS, TO-BE, gap-анализ, БТ, глоссарий.
      3. **Системный анализ:** use cases, ФТ, НФТ, ролевая модель или другие справочные данные, бэклог, трассировка.
      4. **Проектирование:** C4, модель данных, статусные модели, ADR, карта интеграций, sequence, маппинг, контракты API.
      5. **Тестирование и внедрение:** ПМИ, тест-кейсы, стратегия миграции, план внедрения.

      Важно не перечислить, а объяснить логику: **требования идут вниз** (цель → БТ → ФТ → контракт → тест), **вопросы и противоречия — вверх**.

  - id: role-small-project
    level: middle
    question: Проект маленький, сроки сжатые. Какие артефакты вы оставите обязательно?
    tags: [артефакты]
    answer: |
      Минимальный набор, без которого проект почти гарантированно пойдёт не туда:

      1. Цель с метрикой и границы «входит / не входит» — одна страница.
      2. TO-BE, если меняется работа людей.
      3. Требования: ФТ или истории с точными критериями приёмки.
      4. Модель данных — хотя бы концептуальная.
      5. Контекст, интеграции и контракты — если есть внешние системы.
      6. Статусная модель для каждого объекта со статусами.
      7. Приёмочные сценарии.

      От чего можно отказаться: отдельной матрицы трассировки (связи задач в Jira), C4 уровня 2 (если одно приложение и одна БД), полных спецификаций use case (оставить для сложных сценариев).

  - id: role-not-decide-alone
    level: middle
    question: Какие решения аналитик не должен принимать сам? Приведите примеры.
    tags: [роль, стейкхолдеры]
    answer: |
      | Ситуация | К кому идти |
      |---|---|
      | Требования двух стейкхолдеров противоречат друг другу | Владелец БТ (заказчик), при необходимости — спонсор |
      | Выбор между техническими вариантами | Архитектор, оформить ADR |
      | Требование ИБ ухудшает удобство | ИБ + заказчик |
      | Смежная команда не успевает | РП — это риск |
      | «Добавим ещё одну систему, это мелочь» | РП, запрос на изменение |

      Аналитик **готовит** решение: варианты, плюсы и минусы, последствия. Но **принимает** его тот, кто за это отвечает (A в RACI).

  - id: role-babok
    level: senior
    question: Что такое BABOK и какие в нём области знаний?
    tags: [стандарты]
    answer: |
      BABOK Guide (A Guide to the Business Analysis Body of Knowledge) — свод знаний по бизнес-анализу от IIBA. Актуальная версия — 3.

      Шесть областей знаний:
      1. Планирование и мониторинг бизнес-анализа.
      2. Выявление и сотрудничество (elicitation and collaboration).
      3. Управление жизненным циклом требований.
      4. Анализ стратегии.
      5. Анализ требований и определение дизайна.
      6. Оценка решения.

      На собеседовании важнее не перечислить области, а показать, что вы понимаете: выявление, анализ, управление требованиями и оценка результата — это разные виды работы, и каждая нужна.

  - id: role-dor-dod
    level: junior
    question: Что такое DoR и DoD и при чём тут аналитик?
    tags: [scrum, процесс]
    answer: |
      - **DoR (Definition of Ready)** — критерии готовности задачи **к взятию в работу**: есть описание, критерии приёмки, макеты, понятны зависимости, оценка.
      - **DoD (Definition of Done)** — критерии готовности задачи **к закрытию**: код написан и проверен, тесты пройдены, документация обновлена.

      Аналитик в первую очередь отвечает за то, чтобы задачи проходили DoR: без этого команда берёт в спринт сырые истории и тратит время на выяснения.

  - id: role-defect-or-requirement
    level: middle
    question: Тестировщик завёл дефект, разработчик говорит «так и было в требованиях». Ваши действия?
    tags: [тестирование, процесс]
    answer: |
      1. Найти требование и критерий приёмки, на которые ссылаются обе стороны.
      2. Если требование однозначное и реализация ему не соответствует — это дефект кода.
      3. Если требование неоднозначно или не покрывает случай — это **дефект требования**: признать, уточнить у владельца (заказчика), обновить требование и критерии приёмки, по трассировке проверить, что ещё затронуто.
      4. Оформить решение письменно и сообщить всем (QA, разработка, PO).

      Главное — не искать виноватого, а быстро устранить неоднозначность и сделать так, чтобы она не повторилась (например, добавить пример или Gherkin-сценарий).

  - id: role-change-lifecycle
    level: middle
    question: Опишите путь одной доработки существующей системы — от запроса до продуктива.
    tags: [доработка]
    answer: |
      Потребность → уточнение задачи (проблема, а не решение) → анализ существующей реализации → **анализ влияния** → варианты решения → требования → изменения модели, API, БД, процессов → согласование → декомпозиция на задачи → разработка → тестирование и регресс → релиз → smoke-проверка → проверка на продуктиве → обновление документации.

      Аналитик ведёт доработку от начала до конца: на входе — понять задачу и что она затронет, в середине — отвечать на вопросы команды и разбирать спорные дефекты, в конце — убедиться, что в продуктиве работает как задумано, и обновить источник истины.

  - id: role-prod-verification
    level: middle
    question: Чем smoke-проверка после релиза отличается от проверки на продуктиве (production verification)?
    tags: [доработка, тестирование]
    answer: |
      - **Smoke** — сразу после выкатки: работают ли ключевые функции вообще (система поднялась, основные сценарии проходят). Делает обычно команда или эксплуатация по короткому чек-листу.
      - **Проверка на продуктиве** — подтверждение, что **доработка решает задачу** на реальных данных: новая функция используется, метрики в норме, нет всплеска ошибок и обращений, смежные системы получают то, что ожидают. Может длиться дни.

      Аналитик заранее формулирует, что и как проверить на продуктиве: какие запросы, метрики, логи, у кого спросить.
