title: Данные
page: data/models-er
items:
  - id: data-model-levels
    level: junior
    question: Какие бывают уровни модели данных?
    tags: [модели]
    answer: |
      - **Концептуальная** — основные сущности и связи бизнеса, без атрибутов. Делает БА / СА, обсуждают с бизнесом.
      - **Логическая** — сущности, атрибуты, ключи, связи и кардинальности, без привязки к СУБД. Основная зона СА.
      - **Физическая** — таблицы, типы конкретной СУБД, индексы, партиционирование, ограничения. Делают разработка и DBA.

      В кейсе IDM-JOINER СА делает логическую модель, физическую — команда IdM.

  - id: data-cardinality
    level: junior
    question: Какие бывают связи между сущностями и как они реализуются в таблицах?
    tags: [er]
    answer: |
      - **Один к одному (1:1)** — внешний ключ с ограничением уникальности или общая таблица.
      - **Один ко многим (1:N)** — внешний ключ в таблице со стороны «многие». Пример: `employment.identity_id` → `identity`.
      - **Многие ко многим (M:N)** — связующая таблица с двумя внешними ключами. Пример: `role_entitlement` между ролями и полномочиями.

      Кроме «один / много» важна обязательность: «ноль или много» и «один или много» — разные правила.

  - id: data-keys
    level: junior
    question: Чем первичный ключ отличается от уникального? Что такое суррогатный и натуральный ключ?
    tags: [ключи]
    answer: |
      - **Первичный ключ (PK)** — однозначно идентифицирует строку, не NULL, один на таблицу. На него ссылаются внешние ключи.
      - **Уникальный ключ (UK)** — ещё одна уникальная комбинация столбцов (бизнес-ключ); их может быть несколько.
      - **Суррогатный ключ** — техническое значение без бизнес-смысла (uuid, последовательность). Не меняется.
      - **Натуральный ключ** — значение из предметной области (табельный номер, ИНН, `personId` из HRMS). Может измениться или прийти с ошибкой.

      Практика: суррогатный PK + уникальный натуральный ключ. В кейсе: `identity_id` (uuid, PK) и `person_id` (из HRMS, UK).

  - id: data-normal-forms
    level: middle
    question: Объясните 1НФ, 2НФ и 3НФ на примере.
    tags: [нормализация]
    answer: |
      - **1НФ:** значения атомарны, нет повторяющихся групп и списков в одном поле. Плохо: `entitlements = "VPN, ABS-OPER"`.
      - **2НФ:** 1НФ + каждый неключевой атрибут зависит от **всего** составного ключа. Плохо: в `role_entitlement (role_id, entitlement_id)` хранить `role_name` — он зависит только от `role_id`.
      - **3НФ:** 2НФ + нет транзитивных зависимостей: неключевые атрибуты не зависят друг от друга. Плохо: в `employment` хранить `org_unit_timezone` — он зависит от `org_unit_code`, а не от трудоустройства.

      Коротко: «ключ, весь ключ и ничего, кроме ключа».

  - id: data-denormalization
    level: middle
    question: Когда допустима денормализация?
    tags: [нормализация]
    answer: |
      Когда это **осознанный компромисс** ради чтения: отчёты и аналитика (витрины, хранилища данных), кэширование тяжёлых вычислений, история (снимок значения на момент события — например, ФИО в журнале аудита).

      Цена — дублирование: нужно решить, как поддерживать копии в согласованном состоянии, и что делать при расхождении. В операционных (OLTP) системах по умолчанию — нормализованная модель.

  - id: data-join-types
    level: junior
    question: Какие бывают JOIN и чем они отличаются?
    tags: [sql]
    answer: |
      - **INNER JOIN** — только строки, у которых есть пара в обеих таблицах.
      - **LEFT JOIN** — все строки левой таблицы; если пары нет — NULL в столбцах правой.
      - **RIGHT JOIN** — наоборот (обычно переписывают как LEFT, поменяв таблицы местами).
      - **FULL JOIN** — все строки обеих таблиц.
      - **CROSS JOIN** — все сочетания (декартово произведение).
      - **Self-join** — таблица с самой собой (сотрудник и руководитель).

      Типичная задача аналитика — «найти записи без пары»: LEFT JOIN + `WHERE правая.id IS NULL`.

  - id: data-left-join-where
    level: middle
    question: Почему LEFT JOIN с условием на правую таблицу в WHERE превращается в INNER JOIN?
    tags: [sql]
    answer: |
      Для строк без пары столбцы правой таблицы равны NULL. Условие вида `WHERE a.system_code = 'AD'` для NULL даёт не TRUE, и эти строки отфильтровываются — то есть именно те строки, ради которых брали LEFT JOIN.

      Правильно — условие на правую таблицу переносить в `ON`:

      ```sql
      LEFT JOIN account a ON a.identity_id = i.identity_id AND a.system_code = 'AD'
      WHERE a.account_id IS NULL
      ```

  - id: data-where-having
    level: junior
    question: Чем WHERE отличается от HAVING?
    tags: [sql]
    answer: |
      - **WHERE** фильтрует строки **до** группировки; агрегаты в нём использовать нельзя.
      - **HAVING** фильтрует **группы после** GROUP BY; в нём используют агрегаты: `HAVING COUNT(*) > 1`.

      Логический порядок выполнения: FROM / JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.

  - id: data-count
    level: junior
    question: Чем COUNT(*) отличается от COUNT(столбец) и COUNT(DISTINCT столбец)?
    tags: [sql]
    answer: |
      - `COUNT(*)` — число строк.
      - `COUNT(col)` — число строк, где `col` **не NULL**.
      - `COUNT(DISTINCT col)` — число различных не-NULL значений.

      Пример: в таблице 8 идентичностей, отчество заполнено у 6 — `COUNT(*) = 8`, `COUNT(middle_name) = 6`.

  - id: data-null
    level: middle
    question: Какие ловушки связаны с NULL в SQL?
    tags: [sql]
    answer: |
      - `col = NULL` никогда не истинно — нужно `IS NULL` / `IS NOT NULL`.
      - Любое сравнение с NULL даёт «неизвестно», и строка не проходит фильтр.
      - `NOT IN (подзапрос)`, если в подзапросе есть NULL, возвращает **пустой результат**. Безопаснее `NOT EXISTS`.
      - Агрегаты (`SUM`, `AVG`, `COUNT(col)`) пропускают NULL; `COUNT(*)` — нет.
      - В LEFT JOIN условие на правую таблицу в WHERE отбрасывает строки без пары.

      `COALESCE(col, значение)` подставляет значение вместо NULL.

  - id: data-subquery-exists
    level: middle
    question: Чем подзапрос с IN отличается от EXISTS? Что такое коррелированный подзапрос?
    tags: [sql]
    answer: |
      - **IN** сравнивает значение со списком, который вернул подзапрос.
      - **EXISTS** проверяет, вернёт ли подзапрос хотя бы одну строку; обычно подзапрос **коррелированный** — ссылается на строку внешнего запроса и выполняется (логически) для каждой строки.

      `NOT EXISTS` надёжнее `NOT IN`: не ломается на NULL. Современные оптимизаторы часто выполняют IN и EXISTS одинаково.

  - id: data-window
    level: middle
    question: Что такое оконные функции и чем они отличаются от GROUP BY?
    tags: [sql]
    answer: |
      Оконная функция считает значение по «окну» связанных строк, **не схлопывая** строки, как GROUP BY.

      ```sql
      ROW_NUMBER() OVER (PARTITION BY identity_id ORDER BY hire_date DESC)
      ```

      - `PARTITION BY` — на какие группы делить;
      - `ORDER BY` — порядок внутри группы;
      - функции: `ROW_NUMBER`, `RANK`, `DENSE_RANK`, `LAG`, `LEAD`, агрегаты `SUM / COUNT / AVG OVER (...)`.

      Типичные задачи: последняя запись по каждому объекту, нумерация, сравнение с предыдущей строкой, доля в группе.

  - id: data-acid
    level: junior
    question: Что такое ACID?
    tags: [транзакции]
    answer: |
      Свойства транзакции:
      - **Atomicity (атомарность):** выполняется всё или ничего.
      - **Consistency (согласованность):** транзакция переводит БД из одного корректного состояния в другое (ограничения не нарушены).
      - **Isolation (изоляция):** параллельные транзакции не мешают друг другу (в пределах уровня изоляции).
      - **Durability (долговечность):** зафиксированное не теряется при сбое.

      Пример: создание заявки и её позиций — одна транзакция: не должно остаться заявки без позиций.

  - id: data-isolation
    level: middle
    question: Какие бывают уровни изоляции транзакций и какие аномалии они допускают?
    tags: [транзакции]
    answer: |
      | Уровень | Грязное чтение | Неповторяемое чтение | Фантомы |
      |---|---|---|---|
      | Read Uncommitted | возможно | возможно | возможно |
      | Read Committed | нет | возможно | возможно |
      | Repeatable Read | нет | нет | возможно |
      | Serializable | нет | нет | нет |

      Это определения стандарта SQL; конкретные СУБД реализуют уровни по-своему (например, в PostgreSQL Read Uncommitted ведёт себя как Read Committed, а Repeatable Read не допускает фантомов). Чем строже уровень — тем меньше аномалий и больше блокировок / конфликтов.

  - id: data-distributed-tx
    level: senior
    question: Как обеспечить согласованность, если операция затрагивает несколько систем?
    tags: [транзакции, интеграции]
    answer: |
      Распределённая транзакция (двухфазная фиксация, 2PC) возможна, но редко применяется в интеграциях: она требует поддержки всеми участниками и блокирует ресурсы.

      На практике используют:
      - **идемпотентные операции и повторы** — как создание пользователя АБС с `Idempotency-Key`;
      - **сагу** — последовательность локальных транзакций с компенсирующими действиями при ошибке (в кейсе — отмена приёма удаляет созданные учётные записи);
      - **outbox** — запись события в той же локальной транзакции, что и изменение данных, с последующей отправкой;
      - **сверку** — регулярное сравнение данных систем и исправление расхождений (UC-10).

  - id: data-index
    level: junior
    question: Что такое индекс и почему нельзя создать индексы на все столбцы?
    tags: [индексы]
    answer: |
      Индекс — отдельная структура (чаще всего B-дерево), позволяющая находить строки по значению столбца без полного просмотра таблицы. Ускоряет поиск, соединения, сортировку.

      Цена индекса: место на диске и **замедление записи** — при каждом INSERT / UPDATE / DELETE индексы обновляются. Поэтому индексируют столбцы, по которым часто ищут и соединяют, с хорошей избирательностью.

      Для аналитика важно: указать в требованиях частые сценарии поиска и объёмы — это вход для решения DBA об индексах.

  - id: data-composite-index
    level: middle
    question: Важен ли порядок столбцов в составном индексе?
    tags: [индексы]
    answer: |
      Да. Индекс по `(identity_id, system_code)` помогает запросам по `identity_id` и по `identity_id + system_code`, но обычно не помогает запросу только по `system_code` — как телефонный справочник, отсортированный по фамилии, не помогает искать по имени.

      Первым ставят столбец, по которому ищут чаще всего и который сужает выборку.

  - id: data-reference
    level: middle
    question: Что такое НСИ и почему справочники — частая причина проблем в интеграциях?
    tags: [нси]
    answer: |
      **НСИ** (нормативно-справочная информация) — справочники и классификаторы, которыми пользуются многие системы: подразделения, должности, валюты, коды продуктов.

      Проблемы в интеграциях:
      - в системах **разные коды** одного объекта (код подразделения HRMS ≠ код филиала АБС);
      - справочники **расходятся во времени** — новое значение появилось в одной системе раньше;
      - **нет владельца** — неизвестно, кто прав при расхождении.

      Решения: определить мастер-систему и владельца, таблицы соответствия кодов, версионирование, правило на отсутствующее значение. В кейсе: `org_unit.abs_branch_code`, владелец справочника — команда IdM, отсутствие значения — бизнес-ошибка и задача в ServiceDesk.

  - id: data-mdm
    level: senior
    question: Что такое MDM и «золотая запись»?
    tags: [нси]
    answer: |
      **MDM** (Master Data Management) — управление основными данными (клиенты, контрагенты, продукты, сотрудники) так, чтобы во всех системах была одна согласованная версия.

      **Золотая запись** (golden record) — эталонная запись об объекте, собранная из нескольких источников по правилам приоритета и качества.

      Аналитику важно определить: кто мастер-система для каждого атрибута, как разрешаются конфликты, как изменения распространяются в потребителей. В кейсе мастер-система для сотрудников — HRMS, IdM хранит производную идентичность.
