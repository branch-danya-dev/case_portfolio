title: BPMN 2.0
page: processes/bpmn
items:
  - id: bpmn-what-for
    level: junior
    frequent: true
    question: Что такое BPMN и зачем аналитику эта нотация?
    tags: [основы]
    answer: |
      BPMN (Business Process Model and Notation) — стандарт OMG для моделирования бизнес-процессов. Он описывает,
      **кто** что делает, **в каком порядке**, где **развилки**, **ожидания** и **передачи работы** между участниками.

      Аналитику BPMN нужна, чтобы:
      - зафиксировать AS-IS и увидеть потери (очереди, возвраты, ручной труд);
      - согласовать с бизнесом TO-BE на одном понятном языке;
      - найти точки автоматизации: каждая сервисная задача TO-BE — кандидат в ФТ, каждый поток сообщений — интеграция.

      Важная оговорка: BPMN показывает работу участников, а не формат данных и не порядок вызовов API.
      Для этого есть sequence-диаграммы и контракты.

  - id: bpmn-xor-or-and
    level: junior
    question: Чем отличаются шлюзы XOR, OR и AND?
    tags: [шлюзы]
    answer: |
      | Шлюз | На ветвлении | На слиянии |
      |---|---|---|
      | **XOR** (исключающий, ромб с ×) | Выбирается **ровно одна** ветка, чьё условие истинно | Пропускает каждый пришедший токен, не ждёт |
      | **OR** (включающий, ромб с ○) | **Одна или несколько** веток, чьи условия истинны | Ждёт все ветки, которые **были активированы** |
      | **AND** (параллельный, ромб с +) | **Все** ветки сразу, без условий | Ждёт **все** входящие ветки |

      Пример из кейса: «Есть SoD-конфликт?» в TO-BE — XOR. Согласование полномочия одновременно с владельцем и ИБ — AND.

  - id: bpmn-pool-lane
    level: junior
    question: Пул и дорожка — в чём разница?
    tags: [пулы]
    answer: |
      **Пул** (pool) — участник взаимодействия (participant): отдельная организация, отдельная система или внешний контрагент.
      У каждого пула свой процесс и своя «зона управления».

      **Дорожка** (lane) — разбиение **внутри** пула: роль, отдел или система, которые работают в рамках одного процесса.

      Практическое следствие: между пулами работа передаётся только **сообщениями** (поток сообщений),
      внутри пула между дорожками — **потоком операций**.

      В кейсе IDM-JOINER IdM — дорожка в общем пуле, это упрощение ради читаемости.
      Строже было бы вынести HRMS и IdM в отдельные пулы и связать их потоком сообщений.

  - id: bpmn-sequence-vs-message-flow
    level: junior
    question: Чем поток операций отличается от потока сообщений?
    tags: [потоки]
    answer: |
      - **Поток операций** (sequence flow) — сплошная стрелка с закрашенным наконечником. Задаёт порядок шагов
        **внутри одного пула**, по нему «бежит» токен.
      - **Поток сообщений** (message flow) — пунктир с кружком в начале и пустым наконечником. Показывает обмен
        **между разными пулами**: письмо, вызов API, событие в шине.

      Поток операций не может пересекать границу пула, поток сообщений не может соединять элементы одного пула.
      Нарушение этого правила — одна из самых частых ошибок на собеседовательных задачах.

  - id: bpmn-token
    level: middle
    question: Что такое токен и как он помогает читать схему?
    tags: [семантика]
    answer: |
      Токен — воображаемая метка, которая движется по потокам операций и показывает, какой шаг сейчас выполняется.
      Стартовое событие создаёт токен, конечное — поглощает.

      - AND-ветвление размножает токен по всем веткам, AND-слияние ждёт токены со **всех** входов.
      - XOR-ветвление отправляет токен в одну ветку.
      - Если две параллельные ветки сходятся прямо в задачу (без AND-слияния), задача выполнится **дважды** —
        по одному разу на каждый токен.

      Мысленный «прогон токена» — лучший способ проверить схему перед показом.

  - id: bpmn-event-types
    level: middle
    question: Какие бывают события по положению в процессе и как их отличить визуально?
    tags: [события]
    answer: |
      - **Стартовое** — тонкий одинарный круг. Запускает процесс.
      - **Промежуточное** — двойной круг. Происходит по ходу: ожидание таймера, приход сообщения, отправка сигнала.
        Ловящее (catching) рисуется с пустым маркером, бросающее (throwing) — с закрашенным.
      - **Граничное** (boundary) — промежуточное событие на границе задачи: таймаут, ошибка, сообщение во время выполнения.
        Сплошная обводка — прерывающее, пунктирная — непрерывающее.
      - **Конечное** — жирный одинарный круг. Результат процесса или ветки.

      Маркер внутри круга задаёт триггер: часы (таймер), конверт (сообщение), молния (ошибка) и т. д.
      В TO-BE кейса промежуточный таймер «День выхода, 07:00» задерживает активацию учётных записей.

  - id: bpmn-boundary-interrupting
    level: middle
    question: Чем прерывающее граничное событие отличается от непрерывающего? Приведите пример.
    tags: [события]
    answer: |
      - **Прерывающее** (сплошная двойная обводка): при наступлении события задача **прекращается**,
        токен уходит по исходящему потоку события. Пример: таймер «3 дня» на задаче «Согласовать заявку» —
        заявка отзывается и уходит на эскалацию.
      - **Непрерывающее** (пунктирная обводка): задача **продолжается**, а параллельно запускается ещё одна ветка.
        Пример: через 1 день без решения отправить согласующему напоминание, но ждать решения дальше.

      Граничное событие ошибки бывает только прерывающим.

  - id: bpmn-task-types
    level: junior
    question: Какие типы задач есть в BPMN и когда какой ставить?
    tags: [задачи]
    answer: |
      | Тип | Маркер | Когда |
      |---|---|---|
      | Пользовательская (user) | человек | Человек работает **в системе** (форма, портал) |
      | Сервисная (service) | шестерёнка | Система делает сама: вызов сервиса, расчёт |
      | Ручная (manual) | рука | Человек работает **без системы**: позвонить, передать бумагу |
      | Отправка / получение (send / receive) | конверт | Отправить или дождаться сообщения |
      | Скриптовая (script) | свиток | Скрипт выполняет движок процессов |
      | Бизнес-правило (business rule) | таблица | Вызов таблицы решений (DMN) |

      В кейсе AS-IS почти все шаги администраторов — ручные задачи, в TO-BE — сервисные задачи IdM.
      Это наглядно показывает эффект автоматизации.

  - id: bpmn-subprocess
    level: middle
    question: Зачем нужны подпроцессы и чем подпроцесс отличается от вызываемой активности (call activity)?
    tags: [задачи, детализация]
    answer: |
      **Подпроцесс** группирует шаги, чтобы схема оставалась обозримой: в свёрнутом виде это задача со знаком «+».
      Его содержимое принадлежит родительскому процессу и больше нигде не используется.

      **Вызываемая активность** (call activity, жирная рамка) вызывает **отдельный, переиспользуемый** процесс —
      например, «Согласовать заявку», который запускается из нескольких процессов.

      Правило большого пальца: больше 20–25 задач на схеме — выносите части в подпроцессы.

  - id: bpmn-implicit-merge
    level: middle
    question: Можно ли завести две входящие стрелки в задачу без шлюза?
    tags: [шлюзы, ошибки]
    answer: |
      Технически можно, это неявное слияние (uncontrolled merge): задача запускается **на каждый** пришедший токен.

      - После XOR-ветвления это безопасно — активна только одна ветка. Так сделано в TO-BE кейса: в задачу T7
        приходят и ветка «Нет» шлюза «Есть SoD-конфликт?», и выход из T6.
      - После AND-ветвления это ошибка: задача выполнится дважды.

      Хороший стиль — явный XOR-шлюз слияния. Схему легче читать, и ни у кого не возникает вопросов.

  - id: bpmn-event-based-gateway
    level: senior
    question: Когда нужен шлюз по событию (event-based gateway)? Пример.
    tags: [шлюзы, события]
    answer: |
      Когда дальнейший путь определяет **не данные, а то, какое событие наступит первым**.
      После шлюза стоят ловящие промежуточные события или задачи получения.

      Пример: после отправки заявки на согласование ждём либо сообщение «Решение получено», либо таймер «3 рабочих дня».
      Что наступит первым, туда и пойдёт процесс, остальные ожидания отменяются.

      XOR здесь не подходит: XOR решает по данным **в момент прохождения** шлюза, а не ждёт.

  - id: bpmn-as-is-pitfalls
    level: middle
    question: Какие типичные ошибки вы видите в BPMN-схемах коллег?
    tags: [ошибки]
    answer: |
      - Задача без глагола («Заявка» вместо «Создать заявку»).
      - Шлюз без вопроса или ветки без условий.
      - Поток операций между пулами вместо потока сообщений.
      - Параллельные ветки слились без AND — шаг выполняется дважды.
      - Нет конечного события или неясно, чем кончается процесс.
      - Слишком мелко: шаг = клик мышью. Шаг — это единица работы одного исполнителя.
      - AS-IS и TO-BE на одной схеме.
      - AS-IS нарисован по регламенту, а не по реальности.

  - id: bpmn-vs-activity-sequence
    level: middle
    question: Когда выбрать BPMN, а когда UML Activity или Sequence?
    tags: [выбор диаграммы]
    answer: |
      - **BPMN** — бизнес-процесс с участниками и передачей работы между ними. Аудитория — бизнес и аналитики.
      - **Activity** — алгоритм внутри одной системы, например генерация логина (FR-06 кейса).
      - **Sequence** — какие сообщения участники передают друг другу и в каком порядке, включая ответы и ошибки.
        Это основной инструмент проектирования интеграций.

      На практике одна и та же история часто показана на нескольких уровнях: BPMN TO-BE → sequence для каждой интеграции.

  - id: bpmn-executable
    level: senior
    question: Чем описательная BPMN-схема отличается от исполняемой?
    tags: [исполнение]
    answer: |
      **Описательная** (descriptive) схема нужна людям: в ней важны читаемость, имена и смысл.

      **Исполняемая** запускается движком процессов (Camunda, Flowable и т. п.). Для этого нужны:
      - технические атрибуты: условия на потоках, реализации сервисных задач, формы, переменные, таймеры в формате ISO 8601;
      - строгая корректность: не может быть неявных допущений, «висящих» веток и неоднозначных шлюзов.

      Стандарт определяет классы соответствия для моделирования процессов: Descriptive, Analytic и Common Executable.
      Аналитик чаще всего работает на уровне описательной или аналитической модели, а исполняемую доводит разработка.

  - id: bpmn-atm
    level: middle
    question: Опишите в BPMN снятие наличных в банкомате.
    tags: [BPMN, практика]
    answer: |
      Сначала договориться о границах: от вставки карты до выдачи денег, участники — **клиент**, **банкомат**, **процессинг банка**.

      Каркас схемы:
      - **Пулы:** «Клиент» (свёрнутый или с задачами), «Банкомат», «Процессинг». Между пулами — только потоки сообщений.
      - **Банкомат:** старт «Карта вставлена» → «Запросить PIN» → «Принять сумму» → отправка запроса авторизации в процессинг → **шлюз по событию**: «Авторизация одобрена», «Отказ», таймер «Нет ответа 30 с».
      - **Одобрено:** «Выдать карту» → «Выдать наличные» → граничное событие на задаче «Деньги не забраны» (таймер) → «Забрать купюры обратно», отправить сторнирование.
      - **Отказ или тайм-аут:** «Показать сообщение» → «Вернуть карту» → конец.
      - **Процессинг:** проверить PIN, лимит, остаток (XOR-шлюз) → ответ.
      - **Ошибки:** неверный PIN три раза — карта задерживается; нет купюр нужного номинала — предложить другую сумму.

      Что проверяет интервьюер: границы и участники, сообщения между пулами вместо потоков операций, явные исключения (тайм-аут, отказ, невзятые деньги), осмысленные имена: задачи — глаголом, события — состоянием. Лучше сначала проговорить успешный путь, затем добавить исключения.
