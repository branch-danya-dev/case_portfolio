title: Разбор кейса IDM-JOINER
page: interview/tasks/case-review
items:
  - id: case-why-kafka
    level: middle
    question: Почему HRMS передаёт события через Kafka, а не вызывает API IdM?
    tags: [кейс, интеграции, adr]
    answer: |
      Решение ADR-001. Сравнивали три варианта:

      - **REST-вызов IdM из HRMS** — HRMS пришлось бы обрабатывать недоступность IdM и повторять вызовы, а у команды HRMS не более двух спринтов;
      - **опрос HRMS по расписанию** — задержка, нагрузка на HRMS, сложно выделить изменения;
      - **события в Kafka** — слабая связность, гарантия доставки, события могут читать другие системы.

      Выбрали Kafka и добавили ежедневную сверку полным срезом (FR-05) как страховку. Цена решения — идемпотентность по `eventId` (FR-03), DLQ (FR-02) и контракт AsyncAPI.

  - id: case-why-3-days
    level: middle
    question: Почему учётные записи создаются за 3 рабочих дня до выхода, а не в день выхода?
    tags: [кейс, требования, adr]
    answer: |
      ADR-002: доступы должны быть готовы к 09:00 первого дня (BR-04), а АБС и СЭД могут обрабатывать запрос часами или требуют ручного шага. Трёх рабочих дней хватает, чтобы закрыть ручную задачу СЭД и разобрать сбои (BRL-01).

      Чтобы не нарушить требование ИБ «учётные записи не активны до первого рабочего дня» (SEC-03), записи создаются **заблокированными** и активируются в 07:00 по часовому поясу подразделения (FR-08). Следствие — статус CREATED_DISABLED и обязанность удалять учётные записи при отмене приёма (FR-18).

  - id: case-abs
    level: middle
    question: Как интегрировались с АБС, у которой нет API администрирования пользователей?
    tags: [кейс, интеграции, adr]
    answer: |
      ADR-003. Прямая запись в таблицы АБС запрещена политикой ИБ, эмуляция действий администратора через интерфейс (RPA) хрупкая. Выбрали **REST-адаптер** над внутренними административными функциями АБС: его разрабатывает команда АБС, контракт OpenAPI описывает аналитик проекта.

      Риск — дополнительная команда в критическом пути. Плюс — адаптер переиспользуется в следующих волнах и другими системами. Ошибки адаптера обрабатываются политикой повторов FR-16: технические — 3 попытки, бизнес-ошибки — сразу задача в ServiceDesk.

  - id: case-duplicates
    level: middle
    question: Что будет, если одно и то же событие придёт дважды?
    tags: [кейс, надёжность]
    answer: |
      Kafka гарантирует доставку не менее одного раза (NFR-05), поэтому дубли нормальны. IdM хранит обработанные `eventId` и при повторе ничего не делает, только подтверждает событие (FR-03, сценарий US-01).

      На стороне целевых систем повтор после тайм-аута не создаёт дублей, потому что каждая операция провижининга передаёт ключ идемпотентности (`provisioningTaskId`) — это проверяет шаг 7 теста TC-12.

  - id: case-hardest
    level: middle
    question: Что было самым сложным в проекте?
    tags: [кейс, поведенческий]
    answer: |
      Хороший ответ — конкретная проблема, ваши действия и результат (STAR). Варианты на материале кейса:

      - **Поздние приказы HR** (риск R-01): если приказ вносится позже чем за 2 дня, цель G-01 недостижима при любой автоматизации. Решение не техническое: регламент для HR, отчёт о «поздних» приказах, KPI.
      - **Ролевая модель** (R-02): владельцы ресурсов не успевали согласовать роли. Начали с 10 массовых должностей (около 75 % приёмов), для остальных — базовая роль и уведомление руководителю (FR-11).
      - **АБС без API** — дополнительная команда в критическом пути (ADR-003).

  - id: case-scope
    level: middle
    question: Почему в проект не вошли перевод и увольнение сотрудников?
    tags: [кейс, скоуп]
    answer: |
      Волна 1 ограничена процессом Joiner, чтобы получить результат в срок. Перевод (Mover) и увольнение (Leaver) — волна 2. Риск R-04 — права при переводах продолжат накапливаться — **явно принят CISO**. Новые целевые системы тоже вне волны 1: изменения скоупа — только через запрос на изменение (R-03).

      Показательный момент: отмена приёма уже после активации — это фактически увольнение, поэтому такое событие IdM отклоняет и создаёт инцидент (FR-18).

  - id: case-metrics
    level: junior
    question: Как вы поймёте, что проект успешен?
    tags: [кейс, цели]
    answer: |
      По метрикам устава:

      - **G-01:** доля новых сотрудников с готовыми доступами к 09:00 первого дня — с ~5 % до ≥ 95 %;
      - **G-02:** трудозатраты администраторов — с ~180 до ≤ 54 ч/мес (−70 %);
      - **G-03:** доля прав новых сотрудников с основанием в журнале аудита — 100 %.

      Критерий пилота — ≥ 95 % пилотных сотрудников с доступами к 09:00 первого дня и отсутствие инцидентов ИБ. Цели превращены в НФТ и критерии приёмки.

  - id: case-migration
    level: senior
    question: Зачем миграция данных, если автоматизируются только новые сотрудники?
    tags: [кейс, внедрение]
    answer: |
      Без текущих данных IdM не проверит уникальность логинов, не распознает повторный приём и не найдёт руководителя. Загружают идентичности и трудоустройства из HRMS (по `personId`), учётные записи AD (по `employeeID`), пользователей АБС, зарезервированные логины и справочники.

      Побочный эффект — найдутся «сироты»: учётные записи без сотрудника в HRMS. Это быстрый результат для ИБ ещё до запуска автоматизации и хороший аргумент для заказчика.

  - id: case-rollback
    level: senior
    question: Как запускали и что делать, если автоматизация сломается?
    tags: [кейс, внедрение]
    answer: |
      Пилот — ДИТ и офис «Екатеринбург-Центр», остальные подразделения работают по старому процессу. Автоматизация включается **флагом на уровне подразделения**: события по невключённым подразделениям сохраняются, но провижининг не выполняется.

      Откат — выключить флаг: руководители снова создают заявки в ServiceDesk по старому регламенту, уже созданные учётные записи остаются и сверяются вручную.

  - id: case-sod
    level: middle
    question: Как в проекте обеспечили разделение полномочий (SoD)?
    tags: [кейс, безопасность]
    answer: |
      IdM проверяет SoD-правила перед выдачей полномочий; конфликтующее полномочие не выдаётся до решения ИБ (FR-12). Пример конфликта — совмещение ввода и подтверждения операций (US-05). Заявки на критичные полномочия и SoD-конфликты маршрутизируются через владельца ресурса и ИБ (FR-14). Проверка — тест TC-11.
