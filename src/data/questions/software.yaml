title: Каталог ПО
page: software
items:
  - id: sw-stack
    level: junior
    question: Какими инструментами вы пользуетесь в работе?
    tags: [инструменты]
    answer: |
      Отвечайте по задачам, а не списком программ:

      - **Задачи и требования** — Jira (эпики, истории, связи, JQL-фильтры), Confluence (ФТ, интеграции, глоссарий).
      - **Моделирование** — Camunda Modeler для BPMN, PlantUML или Mermaid для sequence и state, draw.io для схем «на обсуждение».
      - **API** — Swagger Editor для контрактов, Postman или curl, чтобы самому вызвать метод и разобрать дефект.
      - **Данные** — DBeaver: изучить схему, проверить данные после теста.
      - **Брокеры** — Kafka UI: найти событие, проверить DLQ.

      Хороший ответ добавляет пример: «нашёл в DLQ событие без поля — дефект был у отправителя, а не у нас».

  - id: sw-jira-confluence
    level: junior
    question: Как разделить требования между Jira и Confluence?
    tags: [инструменты, документация]
    answer: |
      - **Confluence** — долгоживущее описание системы: ФТ, НФТ, интеграции, модели, глоссарий. Живёт, пока живёт система.
      - **Jira** — единицы работы: эпики, истории, задачи, дефекты. Закрываются и уходят в архив.
      - Связь: в истории — ссылка на раздел ФТ и критерии приёмки; на странице требований — список связанных задач (макрос Jira).

      Ошибка — держать требования только в описаниях задач: после закрытия задач актуального описания системы не остаётся.

  - id: sw-api-check
    level: junior
    question: Как вы проверяете API без фронтенда?
    tags: [инструменты, api]
    answer: |
      - Беру контракт (OpenAPI) — Swagger UI или импорт в Postman / Bruno.
      - Отправляю запросы: успешный сценарий, ошибки валидации, отсутствие прав, несуществующий ресурс.
      - Сверяю **код ответа, заголовки и тело** с контрактом, а не только «200 пришёл».
      - Для внешних систем на стенде — заглушка (WireMock, Prism), чтобы воспроизвести 5xx и тайм-ауты.
      - Пример запроса для дефекта прикладываю в формате curl — его может выполнить любой.

  - id: sw-kafka-check
    level: middle
    question: Событие «не дошло» до системы. Как будете разбираться?
    tags: [инструменты, брокеры]
    answer: |
      1. Найти событие в топике (Kafka UI, AKHQ, kcat) по ключу или идентификатору события — отправлено ли оно вообще.
      2. Сверить формат со схемой из контракта AsyncAPI.
      3. Проверить **DLQ** — потребитель мог отклонить событие как некорректное.
      4. Посмотреть **отставание (lag)** группы потребителей — может быть, сообщение ещё не прочитано.
      5. Логи потребителя по идентификатору события.

      В кейсе: топик `hr.employee.events.v1`, некорректные события — в `hr.employee.events.v1.dlq`, дубли отсекаются по `eventId`.

  - id: sw-diagram-tools
    level: middle
    question: Чем рисовать диаграммы — draw.io или «диаграммы как код»?
    tags: [инструменты, моделирование]
    answer: |
      - **draw.io** — свободная раскладка, быстро, понятно бизнесу; минус — правки «разъезжаются», diff не виден.
      - **PlantUML / Mermaid** — текст в Git: ревью, история, единый стиль; хорошо для sequence, state, use case, ER. Mermaid отображается прямо в GitLab и GitHub.
      - **BPMN** — только инструмент, сохраняющий стандартный .bpmn (Camunda Modeler, bpmn.io).
      - **Репозиторий моделей** (Enterprise Architect, Archi) — когда один элемент используется во многих диаграммах и нужна трассировка.

      Правило: всегда хранить исходник, а не только картинку.

  - id: sw-db-explore
    level: middle
    question: Как изучить базу данных незнакомой системы?
    tags: [инструменты, данные]
    answer: |
      - Получить доступ **только на чтение** к тестовой или обезличенной копии.
      - Подключиться универсальным клиентом (DBeaver), построить ER-диаграмму по схеме.
      - Найти ключевые таблицы по названиям и внешним ключам, посмотреть справочники и статусные поля.
      - Сопоставить данные с интерфейсом: выполнить действие в системе и найти, какие строки изменились.
      - Записать найденное в модель данных и глоссарий.

  - id: sw-security
    level: middle
    question: Какие ограничения ИБ бывают на инструменты аналитика в банке?
    tags: [инструменты, безопасность]
    answer: |
      - Запрет облачных сервисов для рабочих данных: онлайн-форматтеры JSON, онлайн-редакторы диаграмм, облачные коллекции API.
      - Только одобренное ПО из каталога компании, установка через заявку.
      - Доступ к БД — только на чтение и к тестовым или обезличенным данным.
      - Секреты (токены, пароли) не хранятся в коллекциях и документах.

      Поэтому полезно знать локальные аналоги: Bruno вместо облачного Postman, jq вместо онлайн-форматтера, десктопный draw.io.
