title: Каталог ПО
page: software
items:
  - id: sw-stack
    level: junior
    question: Какими инструментами вы пользуетесь в работе?
    tags: [инструменты]
    answer: |
      Отвечайте по задачам, а не списком программ:

      - **Задачи и требования** — Jira (эпики, истории, связи, JQL-фильтры), Confluence (ФТ, интеграции, глоссарий).
      - **Моделирование** — Camunda Modeler для BPMN, PlantUML или Mermaid для sequence и state, draw.io для схем «на обсуждение».
      - **API** — Swagger Editor для контрактов, Postman или curl, чтобы самому вызвать метод и разобрать дефект.
      - **Данные** — DBeaver: изучить схему, проверить данные после теста.
      - **Брокеры** — Kafka UI: найти событие, проверить DLQ.

      Хороший ответ добавляет пример: «нашёл в DLQ событие без поля — дефект был у отправителя, а не у нас».

  - id: sw-jira-confluence
    level: junior
    question: Как разделить требования между Jira и Confluence?
    tags: [инструменты, документация]
    answer: |
      - **Confluence** — долгоживущее описание системы: ФТ, НФТ, интеграции, модели, глоссарий. Живёт, пока живёт система.
      - **Jira** — единицы работы: эпики, истории, задачи, дефекты. Закрываются и уходят в архив.
      - Связь: в истории — ссылка на раздел ФТ и критерии приёмки; на странице требований — список связанных задач (макрос Jira).

      Ошибка — держать требования только в описаниях задач: после закрытия задач актуального описания системы не остаётся.

  - id: sw-api-check
    level: junior
    question: Как вы проверяете API без фронтенда?
    tags: [инструменты, api]
    answer: |
      - Беру контракт (OpenAPI) — Swagger UI или импорт в Postman / Bruno.
      - Отправляю запросы: успешный сценарий, ошибки валидации, отсутствие прав, несуществующий ресурс.
      - Сверяю **код ответа, заголовки и тело** с контрактом, а не только «200 пришёл».
      - Для внешних систем на стенде — заглушка (WireMock, Prism), чтобы воспроизвести 5xx и тайм-ауты.
      - Пример запроса для дефекта прикладываю в формате curl — его может выполнить любой.

  - id: sw-kafka-check
    level: middle
    question: Событие «не дошло» до системы. Как будете разбираться?
    tags: [инструменты, брокеры]
    answer: |
      1. Найти событие в топике (Kafka UI, AKHQ, kcat) по ключу или идентификатору события — отправлено ли оно вообще.
      2. Сверить формат со схемой из контракта AsyncAPI.
      3. Проверить **DLQ** — потребитель мог отклонить событие как некорректное.
      4. Посмотреть **отставание (lag)** группы потребителей — может быть, сообщение ещё не прочитано.
      5. Логи потребителя по идентификатору события.

      В кейсе: топик `hr.employee.events.v1`, некорректные события — в `hr.employee.events.v1.dlq`, дубли отсекаются по `eventId`.

  - id: sw-diagram-tools
    level: middle
    question: Чем рисовать диаграммы — draw.io или «диаграммы как код»?
    tags: [инструменты, моделирование]
    answer: |
      - **draw.io** — свободная раскладка, быстро, понятно бизнесу; минус — правки «разъезжаются», diff не виден.
      - **PlantUML / Mermaid** — текст в Git: ревью, история, единый стиль; хорошо для sequence, state, use case, ER. Mermaid отображается прямо в GitLab и GitHub.
      - **BPMN** — только инструмент, сохраняющий стандартный .bpmn (Camunda Modeler, bpmn.io).
      - **Репозиторий моделей** (Enterprise Architect, Archi) — когда один элемент используется во многих диаграммах и нужна трассировка.

      Правило: всегда хранить исходник, а не только картинку.

  - id: sw-db-explore
    level: middle
    question: Как изучить базу данных незнакомой системы?
    tags: [инструменты, данные]
    answer: |
      - Получить доступ **только на чтение** к тестовой или обезличенной копии.
      - Подключиться универсальным клиентом (DBeaver), построить ER-диаграмму по схеме.
      - Найти ключевые таблицы по названиям и внешним ключам, посмотреть справочники и статусные поля.
      - Сопоставить данные с интерфейсом: выполнить действие в системе и найти, какие строки изменились.
      - Записать найденное в модель данных и глоссарий.

  - id: sw-security
    level: middle
    question: Какие ограничения ИБ бывают на инструменты аналитика в банке?
    tags: [инструменты, безопасность]
    answer: |
      - Запрет облачных сервисов для рабочих данных: онлайн-форматтеры JSON, онлайн-редакторы диаграмм, облачные коллекции API.
      - Только одобренное ПО из каталога компании, установка через заявку.
      - Доступ к БД — только на чтение и к тестовым или обезличенным данным.
      - Секреты (токены, пароли) не хранятся в коллекциях и документах.

      Поэтому полезно знать локальные аналоги: Bruno вместо облачного Postman, jq вместо онлайн-форматтера, десктопный draw.io.

  - id: soft-stack-must
    level: junior
    question: Какие технологии и инструменты системный аналитик должен знать обязательно, на любом уровне?
    tags: [стек, инструменты]
    answer: |
      Минимум, без которого нельзя проверить ни требование, ни интеграцию:
      - **SQL и клиент БД** — SELECT, JOIN, GROUP BY, найти данные для разбора;
      - **HTTP и REST** — методы, коды, заголовки; отправить запрос в Postman или curl;
      - **OpenAPI** — читать контракт: обязательные поля, ошибки, схемы;
      - **JSON, XML, JSON Schema**;
      - **Jira и Confluence** — задачи, связи, страницы требований;
      - **нотации BPMN и UML** и инструмент диаграмм (draw.io, PlantUML, Mermaid);
      - **понятия брокеров** — событие, топик, очередь, DLQ;
      - **поиск по логам** по `traceId`;
      - **Git на уровне чтения** — файл, история, комментарий в merge request;
      - **DevTools браузера**.

      Остальное (Docker, Kubernetes, CI/CD, Grafana, Keycloak) нужно понимать на уровне «что делает и как влияет на требования», а глубина растёт с уровнем.

  - id: soft-stack-levels
    level: middle
    question: Чем знание технологий у junior-, middle- и senior-аналитика отличается на примере Kafka?
    tags: [стек, брокеры]
    answer: |
      Уровни отличаются не списком технологий, а глубиной:
      - **Junior** знает понятия — топик, партиция, событие, группа потребителей — и может найти сообщение в UI по подсказке.
      - **Middle** описывает в требованиях гарантии доставки и обработку дублей (идемпотентность по идентификатору события), порядок, DLQ и схему события; сам находит событие при разборе дефекта.
      - **Senior** выбирает, нужен ли брокер и какой, проектирует событийную модель и правила версионирования схем для нескольких команд, обсуждает компромиссы с архитектором.

      Хороший ответ на собеседовании — через задачу: «описал обработку повторной доставки кадровых событий и проверил её в Kafka UI».

  - id: soft-ci-cd
    level: middle
    question: Что аналитику нужно знать о CI/CD?
    tags: [стек, релиз]
    answer: |
      Настраивать конвейеры аналитик не должен. Нужно понимать:
      - **как изменение попадает на среду**: сборка → тесты → выкладка на TEST, затем UAT, PREPROD, PROD — и где сейчас какая версия;
      - **что одна сборка проходит все среды**, а различаются только конфигурация и секреты, — поэтому значения по средам — это параметры в требованиях;
      - **какие проверки могут остановить изменение** и что их можно добавить для своих артефактов: линтер OpenAPI, проверку ссылок документации, контрактные тесты;
      - **когда изменение реально будет у пользователей** — это не момент слияния кода, а выкладка и включение флага.

  - id: soft-git-mr
    level: junior
    question: Зачем аналитику Git и merge request?
    tags: [стек, документация]
    answer: |
      - **Контракты и документация живут рядом с кодом** (docs-as-code): OpenAPI, AsyncAPI, PlantUML, Markdown. Изменение контракта — это коммит и merge request.
      - **Ревью**: аналитик проверяет, что изменение контракта соответствует требованию, и оставляет комментарии; разработчики ревьюят его изменения.
      - **История**: кто, когда и зачем изменил поле в контракте — ответ на вопрос «почему так» в спорах о дефектах.
      - **Минимум навыков**: найти файл, посмотреть историю и разницу версий, оставить комментарий, создать ветку и merge request со своим изменением.

  - id: soft-logs-trace
    level: middle
    question: Пользователь жалуется, что операция не прошла. Как найти, что произошло, по логам?
    tags: [стек, эксплуатация]
    answer: |
      1. Получить **идентификатор операции**: `traceId` из ответа или из интерфейса, либо бизнес-идентификатор (номер заявки) и время.
      2. В системе логов (Kibana, OpenSearch Dashboards, Loki) найти **все записи по этому идентификатору** во всех сервисах, отсортировать по времени.
      3. Пройти путь: какие сервисы операция прошла, где появилась ошибка или задержка, что ответила смежная система (код, тело ошибки).
      4. Если есть распределённая трассировка (Jaeger), посмотреть трассу: видно, какой участок упал или занял время.
      5. Сравнить с ожидаемым поведением по требованиям и контракту.

      Если найти операцию по логам нельзя — это само по себе требование к наблюдаемости: сквозной `traceId` и бизнес-идентификаторы в логах.

  - id: soft-grafana-release
    level: middle
    question: Что посмотреть на дашборде после релиза, чтобы понять, что всё в порядке?
    tags: [стек, релиз, эксплуатация]
    answer: |
      Сравнить показатели **до и после выкладки**:
      - **ошибки**: доля 4xx и 5xx по методам, ошибки интеграций;
      - **задержки**: время ответа, особенно высокие процентили;
      - **очереди**: отставание потребителей, DLQ, задачи в повторах;
      - **ресурсы**: перезапуски экземпляров;
      - **бизнес-метрики**, ради которых делался релиз: например, доля заявок, обработанных автоматически.

      Smoke-проверка отвечает «живо ли», дашборд — «стало ли лучше и ничего ли не сломалось». Если нужных метрик нет, это требование к следующему релизу.
