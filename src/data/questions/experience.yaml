title: Опыт и поведенческие вопросы
page: interview
items:
  - id: exp-last-project
    level: junior
    frequent: true
    question: Расскажите о вашем последнем проекте.
    tags: [опыт]
    answer: |
      Интервьюер проверяет, понимаете ли вы проект целиком и свою роль в нём. Удобная структура на 2–3 минуты:
      1. **Контекст:** какая организация, какая система, зачем проект, масштаб (пользователи, интеграции, команда).
      2. **Ваша роль:** за что отвечали лично, с кем работали.
      3. **Что сделали:** 2–3 конкретных результата с артефактами — требования, интеграции, модель данных, процессы.
      4. **Сложность и решение:** одна история, где пришлось разбираться (конфликт требований, сбой интеграции).
      5. **Результат:** измеримый, если есть.

      Ошибки: пересказывать функции продукта вместо своей работы, говорить «мы» без «я», уходить в подробности на 10 минут.

      Если опыта мало, можно рассказать об учебном проекте, например о кейсе IDM-JOINER, но **честно назвать его учебным**. Сильная сторона такого рассказа — сквозная нить от цели G-01 до теста TC-12 и разбора инцидента INC-01.

  - id: exp-previous-job
    level: junior
    frequent: true
    question: Чем вы занимались на предыдущем месте работы?
    tags: [опыт]
    answer: |
      Интервьюеру нужно понять, совпадает ли ваш опыт с их задачами. Расскажите:
      - **процесс:** откуда приходили задачи, кто ставил, как проходили рефайнмент, разработка, тестирование, выкладка;
      - **типичную задачу от начала до конца:** уточнение, анализ текущей системы, спецификация, согласование, сопровождение разработки и тестирования;
      - **артефакты:** что писали (ФТ, контракты, sequence, ER, BPMN) и в каких инструментах;
      - **доли работы:** сколько интеграций, сколько интерфейсов, сколько общения с бизнесом.

      Хороший приём — заранее прочитать вакансию и сделать акцент на пересечениях: «у вас много интеграций — я как раз 70% времени занимался интеграциями с АБС».

  - id: exp-databases
    level: junior
    frequent: true
    question: С какими базами данных вы работали и что именно делали?
    tags: [опыт, БД]
    answer: |
      Самый частый вопрос в подборках. Здесь важно не перечисление названий, а **уровень работы**:
      - **СУБД:** PostgreSQL, Oracle, MS SQL и т. д. — и тип: реляционная, документная, Redis для кэша;
      - **что делали:** читали данные для анализа и разбора дефектов (SELECT с JOIN, группировками, оконными функциями), проектировали таблицы и связи, писали маппинг, проверяли миграции, готовили тестовые данные;
      - **пример задачи:** «нашёл расхождение между системами запросом с LEFT JOIN и проверкой на NULL»;
      - **доступ:** на продуктиве — только чтение, это нормально.

      Будьте готовы, что после ответа попросят написать запрос. Потренироваться можно в SQL-тренажёре сайта на учебной БД кейса.

  - id: exp-difficulties
    level: middle
    question: С какими трудностями вы сталкивались в работе аналитиком и как их решали?
    tags: [опыт]
    answer: |
      Отвечайте по **STAR**: ситуация → задача → действия → результат. Выберите историю, где видно **ваши действия**, а не везение.

      Хорошие темы:
      - противоречивые требования двух стейкхолдеров и как вы пришли к решению;
      - сбой интеграции, где вы нашли причину на стыке систем;
      - требование, которое оказалось неверным уже после реализации, — что сделали и что изменили в процессе;
      - сжатые сроки и приоритизация.

      Закончить стоит выводом: «теперь я на старте проекта сразу выясняю…». Не годятся истории, где виноваты все, кроме вас, и истории без результата.

  - id: exp-dev-silent
    level: middle
    question: Разработчик три дня не отвечает на ваши сообщения. Что будете делать?
    tags: [коммуникации]
    answer: |
      Проверяют, умеете ли вы снимать блокеры, не создавая конфликтов. По шагам:
      1. **Проверить себя:** понятно ли сформулирован вопрос, тот ли адресат, есть ли срок.
      2. **Сменить канал:** позвонить, подойти, задать вопрос на ежедневной встрече.
      3. **Выяснить причину:** перегрузка, отпуск, другой приоритет, непонятно, чей это вопрос.
      4. **Если ответ блокирует работу** — сообщить тимлиду или руководителю проекта фактами: какой вопрос, с какого числа, что блокирует, какие варианты решения. Это вопрос приоритетов, а не жалоба.
      5. **Пока ждёте** — продвигать то, что не зависит от ответа, или найти ответ в коде, логах, у другого разработчика.

  - id: exp-deadline
    level: middle
    question: Вы понимаете, что не успеваете задачу к сроку. Ваши действия?
    tags: [коммуникации]
    answer: |
      Главное — **предупредить заранее**, а не в последний день:
      1. Оценить, сколько осталось и почему не успеваете: недооценка, новые вводные, блокер.
      2. Сообщить тому, кто зависит от результата, и руководителю — с причиной и **вариантами**:
         - сдать к сроку часть, а остальное — позже;
         - сдвинуть срок на N дней;
         - снять с вас другую задачу.
      3. Согласовать решение и зафиксировать его.
      4. После — разобрать причину, чтобы в следующий раз оценивать точнее.

      Плохие ответы — «буду работать по ночам» без предупреждения и «скажу в день сдачи».

  - id: exp-team-without-sa
    level: middle
    question: Может ли команда обойтись без системного аналитика?
    tags: [роль]
    answer: |
      Может — и так бывает: в маленьких продуктовых командах анализ делят владелец продукта, разработчики и тестировщики. Но работа аналитика при этом никуда не девается, меняется только исполнитель.

      Аналитик нужен, когда:
      - много интеграций и смежных команд — нужен кто-то, кто держит контракты и картину целиком;
      - сложная предметная область и регуляторика (банк, госсектор);
      - требования приходят от многих стейкхолдеров и противоречат друг другу;
      - система живёт долго, и документация нужна для сопровождения и изменений.

      Признаки того, что аналитика не хватает: разработчики тратят время на выяснение требований, интеграции ломаются на стыках, тестировщики спорят с разработкой, «как должно быть».

  - id: exp-questions-to-ask
    level: junior
    question: Какие вопросы задать интервьюеру в конце собеседования?
    tags: [собеседование]
    answer: |
      Вопросы показывают, что вы думаете о работе, а не только о найме. Полезные:
      - Какие задачи будут в первые 3 месяца? Какой результат будет хорошим?
      - Сколько аналитиков в команде, кто ставит задачи, как устроен процесс от идеи до продуктива?
      - Какие артефакты здесь принято вести и где (Confluence, репозиторий)?
      - Какие системы и интеграции в зоне ответственности? Есть ли документация?
      - Что самое сложное в этой роли сейчас?
      - Как оценивается работа аналитика?

      Вопросы про зарплату и формат работы тоже нормальны, но лучше обсуждать их с HR.

  - id: exp-strengths-weaknesses
    level: junior
    question: Расскажите о своих сильных и слабых сторонах.
    tags: [собеседование]
    answer: |
      **Сильные стороны** — 2–3, связанные с ролью и подтверждённые примером: «умею находить причину на стыке систем — в прошлом проекте нашёл…».

      **Слабая сторона** — настоящая, но не критичная для роли, и с тем, что вы с ней делаете: «раньше слишком долго доводил документ до идеала; теперь согласую с командой нужный уровень детализации заранее».

      Не годятся «я перфекционист» без примера и слабости, которые закрывают путь в профессию («не люблю общаться с людьми»).

  - id: exp-choosing-job
    level: junior
    question: Что для вас важно при выборе нового места работы?
    tags: [собеседование]
    answer: |
      Честный ответ из 2–3 пунктов, связанных с работой: предметная область, сложность задач (интеграции, высоконагруженные системы), команда и процессы, развитие (менторы, рост до ведущего аналитика или архитектора).

      Хорошо связать ответ с компанией: «мне интересны интеграции в банке, а у вас переход на событийную архитектуру».

      Плохо — говорить только про деньги или ругать прошлого работодателя: интервьюер примеряет, будете ли вы так же говорить о них.
