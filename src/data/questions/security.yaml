title: Безопасность
page: security/overview
items:
  - id: sec-cia
    level: junior
    question: Какие три свойства информации защищает ИБ? Приведите пример требования для каждого.
    tags: [безопасность]
    answer: |
      - **Конфиденциальность** — данные видит только тот, кому можно. Требование: «руководитель видит доступы только своих подчинённых».
      - **Целостность** — данные и операции не изменены незаметно. Требование: «журнал аудита только на добавление, изменить запись нельзя».
      - **Доступность** — система работает, когда нужна. Требование: «не более 30 запросов в минуту на клиента, при превышении — 429», чтобы один клиент не перегрузил систему для всех.

      Каждое требование безопасности защищает хотя бы одно из этих свойств — это помогает не забыть, например, про доступность.

  - id: sec-analyst-role
    level: junior
    question: Что делает системный аналитик с требованиями безопасности, если их формулирует ИБ?
    tags: [безопасность, роль]
    answer: |
      ИБ задаёт **что** должно быть (минимальные привилегии, журнал, защита канала). Аналитик делает так, чтобы это **оказалось в системе**:
      - встраивает требования в ФТ, НФТ, ролевую модель, контракты API, модель данных и маппинг;
      - описывает доступ на уровне операций и объектов;
      - перечисляет ПДн и решает с ИБ, что минимизировать;
      - описывает события журнала аудита;
      - находит злоупотребления бизнес-логикой (самосогласование, перебор);
      - добавляет негативные тесты;
      - проверяет безопасность в анализе влияния каждого изменения.

  - id: sec-authn-authz
    level: junior
    frequent: true
    question: Чем идентификация, аутентификация и авторизация отличаются друг от друга? Какие HTTP-коды соответствуют ошибкам?
    tags: [безопасность, доступ]
    answer: |
      Три шага по порядку, на примере входа сотрудника на портал:
      - **Идентификация** — субъект называет себя: вводит логин `IVANOV.AP`, предъявляет `client_id` или сертификат. Пока это лишь заявление.
      - **Аутентификация** — проверка, что он действительно тот, за кого себя выдаёт: пароль, сертификат, токен, Kerberos, второй фактор. Не удалась — **401** (название кода «Unauthorized» исторически неудачное).
      - **Авторизация** — «что тебе можно?»: роли, права, правила. Личность известна, но прав нет — **403 Forbidden**.

      Многофакторная аутентификация — минимум два фактора **разных** типов: знание, владение, свойство. Два пароля — не MFA.

  - id: sec-rbac-abac
    level: middle
    question: Чем RBAC отличается от ABAC? Когда что применять?
    tags: [безопасность, доступ]
    answer: |
      - **RBAC** — права выдаются через роли по обязанностям. Просто объяснить и проверить, «кто что может». Слабое место — взрыв числа ролей, если пытаться учесть все исключения.
      - **ABAC** — правило по атрибутам пользователя (подразделение), объекта (владелец, сумма) и контекста (время, канал). Гибко, но сложнее проверить, у кого какой доступ.

      На практике их сочетают: роль разрешает операцию, атрибуты ограничивают объекты. Пример из кейса IDM-JOINER: роль руководителя позволяет смотреть доступы сотрудников, а правило «только подчинённые» (SEC-10) ограничивает, чьи именно.

  - id: sec-object-level
    level: middle
    question: У пользователя есть право вызывать GET /employees/{id}/access. Достаточно ли этого?
    tags: [безопасность, доступ, API]
    answer: |
      Нет. Это проверка на уровне **операции**. Нужна ещё проверка на уровне **объекта**: можно ли этому пользователю смотреть **именно этого** сотрудника. Иначе он перебором `id` увидит всех. Это самая частая уязвимость API — нарушение авторизации на уровне объекта.

      В требованиях для каждой операции пишут правило на объект («только подчинённые», «только назначенные мне») и источник связи (оргструктура, назначение). В тестах — негативный сценарий «чужой объект». В кейсе IDM-JOINER для чужого сотрудника возвращается 404, чтобы не раскрыть, существует ли он (THR-05).

  - id: sec-service-accounts
    level: middle
    question: Какие требования вы предъявите к сервисной учётной записи интеграции?
    tags: [безопасность, доступ, интеграции]
    answer: |
      - **Владелец** — отвечает за права и замену секрета.
      - **Минимальные права** — только то, что нужно интеграции. В кейсе IDM-JOINER коннектор AD работает только в OU пользователей и не имеет прав на административные группы (SEC-07).
      - **Отдельная учётная запись** на каждую интеграцию и среду — чтобы отзыв одной не сломал остальные.
      - **Люди под ней не входят** — иначе журнал не покажет, кто действовал.
      - **Секрет** — в хранилище секретов, со сроком и порядком замены без простоя.
      - Права пересматриваются, как и у людей.

  - id: sec-token-lifecycle
    level: middle
    question: Сотрудника уволили и заблокировали в AD. Через сколько он потеряет доступ к системе, работающей на токенах?
    tags: [безопасность, токены]
    answer: |
      Зависит от **срока жизни токена доступа**. Сервер авторизации перестанет выдавать новые токены сразу, но уже выданный токен доступа (JWT) проверяется без обращения к серверу и действует до `exp`.

      Поэтому:
      - токен доступа делают коротким — минуты;
      - продление идёт через токен обновления или сессию, и при продлении проверяется блокировка;
      - остаточный риск («до 15 минут») явно согласуют с ИБ;
      - если нужен немедленный отзыв — проверка по списку отозванных или на сервере авторизации при каждом запросе, это дороже.

      В требованиях описывают сроки, тайм-аут бездействия, поведение при выходе, блокировке и смене пароля.

  - id: sec-jwt-revoke
    level: senior
    question: Почему JWT сложно отозвать и как с этим живут?
    tags: [безопасность, токены]
    answer: |
      JWT самодостаточен: API проверяет подпись, срок, издателя и аудиторию **локально**, не спрашивая сервер авторизации. Это быстро, но означает, что выданный токен действует до `exp`, даже если пользователя заблокировали.

      Как живут:
      - **короткий токен доступа** (минуты) и **токен обновления**, который можно отозвать на сервере;
      - при обновлении проверяют блокировку и завершение сессии;
      - для критичных операций — дополнительная проверка на сервере или список отозванных токенов (`jti`), если риск того стоит;
      - **ротация токенов обновления**: при каждом использовании выдаётся новый, а повторное использование старого — признак кражи.

  - id: sec-encryption
    level: junior
    question: Что значит шифрование «in transit» и «at rest»? Почему пароли не шифруют?
    tags: [безопасность, данные]
    answer: |
      - **In transit** — при передаче: TLS на каждом соединении, mTLS между системами.
      - **At rest** — при хранении: шифрование дисков, БД, резервных копий; для самого чувствительного — отдельных полей.

      Ключи хранятся **отдельно** от данных, иначе шифрование не защищает от того, кто получил доступ к серверу.

      Пароли **хэшируют** специальной медленной функцией с солью: зашифрованное можно расшифровать, а хэш необратим. Поэтому пароль можно только сбросить, но не «напомнить».

  - id: sec-pdn
    level: middle
    question: Какие вопросы вы зададите про персональные данные при проектировании интеграции?
    tags: [безопасность, данные, ПДн]
    answer: |
      - Какие поля ПДн передаются и **зачем каждое** этой системе (минимизация)?
      - Есть ли специальные или биометрические ПДн?
      - Куда данные передаются дальше, где хранятся, сколько и как удаляются?
      - Кто их видит, где маскируются?
      - Попадают ли они в логи, ошибки, выгрузки, письма, URL?
      - Какие данные будут на тестовых средах — обезличенные или синтетические?

      Пример из кейса IDM-JOINER (SEC-09): паспорт, дата рождения и адрес в IdM не передаются вообще. Телефон нужен только для SMS с первичным паролем и в AD не передаётся.

  - id: sec-logs-pdn
    level: middle
    question: Разработчик предлагает писать в лог тело каждого запроса «для отладки». Что ответите?
    tags: [безопасность, данные, эксплуатация]
    answer: |
      Тело запроса содержит ПДн, а иногда токены и пароли. Система логирования доступна многим людям, а копии оседают в бэкапах и выгрузках, так что лог станет местом утечки.

      Предложение:
      - логировать **идентификаторы** (`traceId`, `personId`, `taskId`), метод, путь, код ответа, длительность;
      - токены, пароли и секреты — **никогда**;
      - ПДн — маскировать или не писать;
      - для отладки отдельного случая — найти данные по идентификатору в системе-источнике с её правами доступа.

      Это требование стоит записать в НФТ и в требования к логированию.

  - id: sec-audit-vs-logs
    level: junior
    question: Чем журнал аудита отличается от технических логов?
    tags: [безопасность, аудит]
    answer: |
      | | Журнал аудита | Технические логи |
      |---|---|---|
      | Вопрос | Кто и что сделал, на каком основании | Как работала система, где ошибка |
      | Читают | ИБ, аудит | Разработка, сопровождение |
      | Хранение | Годы (в кейсе IDM-JOINER — не менее 5 лет) | Дни и недели |
      | Изменение | Невозможно, только добавление | Ротация и удаление |

      Связь между ними — общий идентификатор операции (`correlationId` / `traceId`).

  - id: sec-audit-fields
    level: middle
    question: Какие поля должны быть в записи журнала аудита?
    tags: [безопасность, аудит]
    answer: |
      - **Время.**
      - **Кто** — пользователь или система, тип субъекта.
      - **Действие.**
      - **Объект** — тип и идентификатор.
      - **Основание** — роль, правило, заявка: почему это было разрешено.
      - **Результат**, включая отказы.
      - **Идентификатор** для связи с техническими логами.

      Чего быть не должно: паролей, токенов, лишних ПДн. Записываются и **отказы**: попытки доступа к чужим данным — главный сигнал для ИБ. В кейсе IDM-JOINER поля заданы в FR-21 и в модели данных (`audit_event`).

  - id: sec-stride
    level: middle
    question: Что такое STRIDE? Приведите по примеру угрозы на каждую букву.
    tags: [безопасность, угрозы]
    answer: |
      Шесть категорий угроз; примеры — из кейса IDM-JOINER:
      - **Spoofing** (подмена) — ложное кадровое событие в шине. Мера: ACL на запись в топик и сверка с HRMS.
      - **Tampering** (изменение) — правка журнала аудита. Мера: журнал только на добавление, копия в SIEM.
      - **Repudiation** (отказ от авторства) — «я не согласовывал». Мера: журнал с основанием и временем.
      - **Information disclosure** (раскрытие) — перебор табельных номеров. Мера: проверка подчинённости, 404 для чужих.
      - **Denial of service** (отказ в обслуживании) — массовые запросы к API. Мера: ограничение частоты, 429.
      - **Elevation of privilege** (повышение привилегий) — самосогласование заявки. Мера: заявитель не согласует свою заявку.

      Проходят по каждой границе доверия на схеме потоков данных. Результат — таблица «угроза → мера → статус».

  - id: sec-rate-limit
    level: middle
    question: Что нужно описать в требованиях к ограничению частоты запросов?
    tags: [безопасность, интеграции]
    answer: |
      - **Кого ограничиваем** — клиента, пользователя, IP, операцию.
      - **Лимит и окно** — например, 30 запросов в минуту на клиента.
      - **Ответ при превышении** — 429 Too Many Requests с `Retry-After`.
      - **Строже для чувствительных операций** — вход, проверка кодов, поиск: после N неудач блокировка или задержка (защита от перебора).
      - **Описание в контракте**, чтобы потребитель знал лимит заранее.
      - **Поведение потребителя** — повтор не раньше `Retry-After`, со случайной задержкой.
      - **Мониторинг** — ответы 429 по клиентам.

      Кейс IDM-JOINER показывает, что бывает без этого: в INC-01 адаптер ограничивал частоту, но лимит не был описан и вместо 429 возвращался 503.

  - id: sec-abuse
    level: senior
    question: Приведите пример угрозы, которую найдёт аналитик, но не найдёт сканер уязвимостей.
    tags: [безопасность, угрозы]
    answer: |
      **Злоупотребление бизнес-логикой** — технически всё корректно, но процесс позволяет нарушение. Примеры:
      - руководитель согласует **собственную** заявку на доступ (кейс IDM-JOINER, THR-10);
      - начальник маленького офиса просит себе роль, которая вместе с его ролью даёт SoD-конфликт (SOD-01);
      - одноразовый код используется повторно, если не описано, что он гасится после использования;
      - выгрузка «для отчёта» отдаёт все ПДн, хотя отчёту нужны три поля.

      Сканер видит протоколы и код, а такие угрозы видны только тому, кто знает процесс и роли. Поэтому моделирование угроз — работа и аналитика, а не только ИБ.

  - id: sec-symmetric-asymmetric
    level: middle
    question: Чем симметричное шифрование отличается от асимметричного? Где что используется?
    tags: [безопасность, данные]
    answer: |
      - **Симметричное** — один ключ шифрует и расшифровывает. Быстрое, подходит для больших объёмов. Проблема — как безопасно передать ключ второй стороне.
      - **Асимметричное** — пара ключей: открытый (публичный) и закрытый. Зашифрованное открытым ключом расшифровывается только закрытым; подписанное закрытым проверяется открытым. Медленнее, но решает задачу обмена ключами и даёт электронную подпись.

      На практике их сочетают. В TLS асимметричная криптография и сертификаты нужны, чтобы проверить сервер и договориться о сеансовом ключе, а сами данные шифруются симметрично. JWT подписывается закрытым ключом издателя, а API проверяет подпись его открытым ключом.

      Не путать с хэшированием: хэш необратим и используется для хранения паролей и контроля целостности.
