title: Документирование
page: documentation/tz-gost34
items:
  - id: doc-gost34-what
    level: junior
    frequent: true
    question: Что такое ГОСТ 34 и где он применяется?
    tags: [гост]
    answer: |
      Комплекс стандартов на автоматизированные системы (серия 34): стадии создания, виды документов, требования к их содержанию, в том числе к техническому заданию (ГОСТ 34.602).

      Применяется в госпроектах, крупных компаниях и банках, где документы согласуются подписями и становятся частью договора и приёмки. В продуктовой Agile-разработке встречается реже, но логика разделов ТЗ полезна как чек-лист.

  - id: doc-tz-sections
    level: middle
    question: Из каких разделов состоит ТЗ по ГОСТ 34.602?
    tags: [гост]
    answer: |
      В классической редакции 1989 года:
      1. Общие сведения.
      2. Назначение и цели создания системы.
      3. Характеристика объекта автоматизации.
      4. Требования к системе — к системе в целом, к функциям (задачам), к видам обеспечения.
      5. Состав и содержание работ по созданию системы.
      6. Порядок контроля и приёмки системы.
      7. Требования к подготовке объекта автоматизации к вводу системы в действие.
      8. Требования к документированию.
      9. Источники разработки.

      Редакция 2020 года изменила состав разделов, но логика та же. Главное на собеседовании — показать, что ТЗ — это та же цепочка «цели → требования → приёмка», только в другой упаковке.

  - id: doc-tz-vs-agile
    level: middle
    question: Чем ТЗ отличается от набора требований в Agile-проекте?
    tags: [гост, методологии]
    answer: |
      По содержанию — почти ничем: цели, характеристика объекта, функциональные и нефункциональные требования, приёмка. Различается **упаковка и жизненный цикл**:

      - ТЗ — один документ, согласованный подписями до разработки, часть договора; изменения — через дополнения.
      - В Agile — живая база знаний (Confluence) плюс бэклог; детали уточняются перед спринтом.

      Гибрид, частый в банках: фундамент (цели, архитектура, интеграции, ИБ) согласуется документами, детали — в бэклоге.

  - id: doc-docs-as-code
    level: middle
    question: Что такое docs-as-code? Плюсы и минусы.
    tags: [docs-as-code]
    answer: |
      Документацию ведут **как код**: текст в Markdown или AsciiDoc в git, рядом с кодом и контрактами; изменения — через pull request с ревью; диаграммы — текстом (Mermaid, PlantUML); сайт собирается автоматически.

      **Плюсы:** история и дифф изменений, ревью, документация меняется вместе с кодом и контрактами, проверки в CI (ссылки, орфография, валидность OpenAPI).
      **Минусы:** порог входа для бизнеса (git, Markdown), сложнее совместное редактирование и комментирование, чем в вики.

  - id: doc-confluence-structure
    level: junior
    question: Как вы организуете документацию проекта в Confluence?
    tags: [confluence]
    answer: |
      - **Дерево страниц** по логике проекта: «О проекте» → бизнес → требования → архитектура → интеграции → тестирование → эксплуатация (как слои кейса).
      - **Шаблоны** страниц для повторяющихся артефактов (ФТ, интеграция, ADR, протокол встречи).
      - **Свойства страниц** (статус, владелец, версия) и отчёт по ним — реестр документов.
      - **Связь с Jira:** истории ссылаются на страницы ФТ, страницы показывают связанные задачи.
      - **Ревью** — комментарии, статусы, явное утверждение.
      - **Архив** устаревших страниц вместо удаления.

  - id: doc-living
    level: middle
    question: Как сделать так, чтобы документация не устаревала?
    tags: [процесс]
    answer: |
      - Обновление документации — часть **DoD**: история не закрыта, пока ФТ, контракт и статусная модель не обновлены.
      - **Владелец** у каждого документа и статус актуальности.
      - Документировать **долгоживущее** (модель данных, контракты, бизнес-правила), а не пересказывать задачи.
      - Контракты и диаграммы — **как код**, рядом с реализацией; проверки в CI.
      - Регулярный обзор: что устарело — обновить или в архив.

  - id: doc-audience
    level: junior
    question: Как выбрать формат и уровень детализации документа?
    tags: [процесс]
    answer: |
      От **читателя и задачи**:
      - заказчику — цели, БТ, TO-BE, критерии приёмки; без технических деталей;
      - разработке — ФТ с правилами и ошибками, модель данных, статусы, контракты;
      - QA — критерии приёмки, статусные модели, примеры данных;
      - эксплуатации — интеграции, ошибки, мониторинг, регламенты.

      Один документ «для всех» обычно не подходит никому: лучше слои со ссылками друг на друга.

  - id: doc-template-fr
    level: junior
    question: Что должно быть в спецификации функционального требования или функции?
    tags: [шаблоны]
    answer: |
      - ID, название, статус, версия, автор, утверждающий;
      - источник (БТ, стейкхолдер) и связь с целью;
      - описание поведения: триггер, предусловия, шаги, результат;
      - бизнес-правила и проверки; обработка ошибок и исключений;
      - данные (поля, форматы, источники) и интеграции (ссылки на контракты);
      - статусы и переходы, если есть объект со статусами;
      - НФТ, относящиеся к функции;
      - критерии приёмки;
      - открытые вопросы и история изменений.

  - id: doc-integration-spec
    level: middle
    question: Что включить в описание интеграции?
    tags: [шаблоны, интеграции]
    answer: |
      - участники и владельцы с обеих сторон;
      - назначение и сценарии (ссылки на sequence-диаграммы);
      - протокол, формат, режим (синхронно / асинхронно), частота и объёмы;
      - контракт (OpenAPI / AsyncAPI) и маппинг полей;
      - аутентификация и требования ИБ;
      - обработка ошибок: коды, повторы, идемпотентность, DLQ, кто разбирает;
      - НФТ: время ответа, доступность, лимиты;
      - мониторинг и алерты;
      - окружения и тестовые данные.

  - id: doc-review
    level: middle
    question: Как организовать ревью и согласование требований?
    tags: [процесс]
    answer: |
      1. Внутреннее ревью коллегой-аналитиком: однозначность, полнота, чек-лист.
      2. Техническое ревью с разработкой и архитектором: реализуемость, вопросы.
      3. Ревью QA: проверяемость, критерии приёмки.
      4. Согласование с заказчиком и обязательными согласующими (ИБ) — по RACI.
      5. Фиксация версии (базовая линия), дальше — через управление изменениями.

      Инструменты: комментарии в Confluence или pull request, статусы документа, журнал решений.
