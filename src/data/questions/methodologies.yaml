title: Методологии
page: methodologies/comparison
items:
  - id: meth-compare
    level: junior
    question: Чем Waterfall отличается от Agile-подходов?
    tags: [сравнение]
    answer: |
      - **Waterfall** — последовательные этапы (требования → проектирование → разработка → тестирование → внедрение), каждый завершается утверждённым результатом. Требования фиксируются заранее, изменения — формально. Подходит, когда требования стабильны и важны предсказуемость, договор, приёмка.
      - **Agile** — ценности и принципы адаптивной разработки. Конкретный процесс задают отдельно: Scrum использует спринты, Kanban помогает управлять потоком и не требует спринтов. Требования уточняют по обратной связи.

      В кейсе IDM-JOINER используется **гибрид**: фундамент заранее, детали — итерациями. Выбор нужно объяснять ограничениями проекта.

  - id: meth-manifesto
    level: junior
    question: Какие ценности у Agile-манифеста?
    tags: [agile]
    answer: |
      Agile-манифест (2001) — четыре ценности:
      - люди и взаимодействие важнее процессов и инструментов;
      - работающий продукт важнее исчерпывающей документации;
      - сотрудничество с заказчиком важнее согласования условий контракта;
      - готовность к изменениям важнее следования первоначальному плану.

      Важная оговорка из самого манифеста: то, что справа, тоже ценно, но то, что слева, — ценнее. Это не «документация не нужна».

  - id: meth-scrum-roles
    level: junior
    question: Какие роли, события и артефакты есть в Scrum?
    tags: [scrum]
    answer: |
      По Scrum Guide 2020:
      - **Ответственности:** Product Owner, Scrum Master, Developers (разработчики — все, кто создаёт инкремент, включая аналитиков и тестировщиков).
      - **События:** Sprint (до месяца), Sprint Planning, Daily Scrum (15 минут), Sprint Review, Sprint Retrospective.
      - **Артефакты и обязательства:** Product Backlog — Product Goal, Sprint Backlog — Sprint Goal, Increment — Definition of Done.

      Рефайнмент бэклога в Scrum Guide — постоянная деятельность, а не отдельное событие.

  - id: meth-analyst-scrum
    level: middle
    question: Где место системного аналитика в Scrum, если такой роли в Scrum Guide нет?
    tags: [scrum, роль]
    answer: |
      Аналитик — один из **Developers**: член команды, который создаёт инкремент вместе со всеми. Типичные задачи:
      - уточняет ближайшие элементы бэклога; горизонт в 1–2 спринта может быть полезен при зависимостях, но не является требованием Scrum;
      - пишет критерии приёмки, проектирует данные, статусы, интеграции и контракты;
      - помогает PO: декомпозиция эпиков, анализ влияния, оценка последствий;
      - во время спринта отвечает на вопросы, уточняет, проверяет результат;
      - поддерживает долгоживущую документацию (ФТ, модели, контракты).

  - id: meth-refinement
    level: middle
    question: Как аналитик готовит рефайнмент?
    tags: [scrum]
    answer: |
      1. Разбирает ближайшие приоритетные элементы: цель, связь с ФТ, критерии приёмки, макеты, контракты, зависимости. Не обязательно знать все детали заранее.
      2. Помечает открытые вопросы и находит ответы у PO и стейкхолдеров до встречи.
      3. На рефайнменте объясняет контекст, собирает вопросы команды, режет крупные истории вертикально.
      4. После — обновляет истории, фиксирует решения и открытые вопросы с ответственными. Если команда использует DoR, проверяет эту договорённость. Рефайнмент — постоянная деятельность; «груминг» — другое встречающееся название.

  - id: meth-kanban
    level: junior
    frequent: true
    question: Что такое Kanban и чем он отличается от Scrum?
    tags: [kanban]
    answer: |
      Kanban — метод управления **потоком** работы: визуализация на доске, **ограничение незавершённой работы (WIP)**, управление потоком, явные правила, регулярные обзоры и улучшения.

      | | Scrum | Kanban |
      |---|---|---|
      | Ритм | Спринты фиксированной длины | Непрерывный поток |
      | Ориентир | Цель спринта и качество инкремента | Явные правила потока, WIP и вероятностный прогноз SLE |
      | Роли | PO, SM, Developers | Не предписаны |
      | Изменения в работе | Объём уточняют с PO, сохраняя цель и качество | Порядок пересматривают; новую работу берут по ёмкости |
      | Метрики | Цель спринта, инкремент | Время цикла, пропускная способность, CFD |

      Kanban применим к поддержке и разработке продукта; его практики можно сочетать со Scrum.

  - id: meth-wip
    level: middle
    question: Зачем ограничивать WIP?
    tags: [kanban]
    answer: |
      Избыток одновременно начатых задач создаёт переключения и очереди. Для устойчивого потока на одинаковых границах закон Литтла связывает среднее время цикла, средний WIP и среднюю пропускную способность. Это связь средних, а не гарантия срока каждой задачи; после изменения лимита нужно наблюдать результат.

      Для аналитика: не начинать анализ пяти задач сразу, если разработка не успевает их брать, — лучше довести одну до готовности.

  - id: meth-kanban-metrics
    level: middle
    question: Какие метрики используют в Kanban?
    tags: [kanban]
    answer: |
      - **Время выполнения** (lead time) — от поступления запроса до готовности.
      - **Время цикла** (cycle time) — от начала работы до готовности.
      - **Пропускная способность** (throughput) — сколько задач завершено за период.
      - **WIP** — сколько задач в работе сейчас.
      - **Возраст задачи** (work item age) — время от начала до текущего момента для незавершённой задачи.
      - **Накопительная диаграмма потока** (CFD) — показывает очереди и узкие места: расширяющаяся полоса этапа = там копится работа.

      Начало и завершение определяются правилами команды. Базовые метрики Kanban Guide — WIP, throughput, work item age и cycle time; lead time и CFD дополняют их. По истории времени цикла строят SLE — прогноз с вероятностью, а не безусловное обещание.

  - id: meth-waterfall-analyst
    level: junior
    question: Какова роль аналитика в водопадном проекте?
    tags: [waterfall, роль]
    answer: |
      Основная работа — **до разработки**: обследование, требования, ТЗ (часто по ГОСТ 34), проектирование данных и интеграций, согласование подписями. Затем — сопровождение: ответы на вопросы разработки, изменения через формальные запросы, участие в испытаниях по ПМИ и приёмке.

      Риск роли: требования, написанные за полгода до реализации, устаревают — поэтому важны трассировка и управление изменениями.

  - id: meth-hybrid
    level: middle
    question: Что такое гибридный подход и как в нём работает аналитик?
    tags: [гибрид]
    answer: |
      Сочетание: **фундамент заранее** (цели, границы, архитектура, интеграции, требования ИБ — согласуются документами, часто комитетами), **детали — итерациями** (ФТ и истории перед спринтом, частые релизы).

      Аналитик работает в двух режимах: «водопадно» готовит и согласует фундамент, «по-агильному» детализирует истории и сопровождает спринты. Так устроен кейс IDM-JOINER: архитектура и интеграции согласованы до разработки, разработка идёт спринтами.

  - id: meth-choose
    level: senior
    question: Как выбрать подход для проекта?
    tags: [сравнение]
    answer: |
      Факторы:
      - **неопределённость требований** — высокая → итерации;
      - **регуляторика и договор** — фиксированный объём, приёмка по ТЗ → больше «водопада» в фундаменте;
      - **характер работы** — новый продукт → Scrum; поток заявок и поддержка → Kanban;
      - **зависимости от других команд** — синхронизация на уровне вех или общего планирования;
      - **зрелость команды и заказчика** — готов ли заказчик участвовать постоянно.

      Ответ «гибрид» — нормальный, если вы объясняете, что именно делается заранее и почему.

  - id: meth-scaling
    level: senior
    question: Что вы знаете о масштабировании Agile (SAFe, LeSS)?
    tags: [масштабирование]
    answer: |
      Когда над одним продуктом работает много команд, нужна синхронизация.

      - **SAFe** (Scaled Agile Framework) — команды объединены в поезд (ART), планирование инкремента (PI Planning) раз в несколько спринтов, роли на уровне программы, приоритизация WSJF.
      - **LeSS** (Large-Scale Scrum) — минимум добавлений к Scrum: один бэклог и один PO на несколько команд.

      Для аналитика: требования и зависимости между командами планируются заранее (на PI Planning), растёт роль контрактов и интеграционного проектирования.

  - id: meth-backlog
    level: junior
    question: Что такое бэклог и кто за него отвечает?
    tags: [scrum, требования]
    answer: |
      **Бэклог продукта** — упорядоченный список всего, что может понадобиться продукту: истории, дефекты, технические задачи, исследования. Наверху — подробные и оценённые элементы, готовые к взятию в работу; внизу — крупные и сырые.

      - В Scrum за бэклог продукта отвечает **владелец продукта (Product Owner)**: он определяет порядок и принимает решения о содержании.
      - **Бэклог спринта** — цель спринта, выбранные элементы и план реализации; за него отвечают Developers.
      - **Аналитик** помогает готовить элементы: декомпозирует, пишет критерии приёмки, уточняет на рефайнменте; DoR применяется, если команда его использует.

      Бэклог — не свалка пожеланий: элементы без ценности и владельца нужно удалять.

  - id: meth-agile-process
    level: junior
    question: Почему Agile называют философией? Какие роли и артефакты он требует?
    tags: [agile, роль]
    answer: |
      Agile задаёт ценности и принципы — раннюю поставку пользы, обратную связь и адаптацию. Сам манифест не задаёт должностей, встреч, спринтов и универсального комплекта документов. Их определяет выбранный процесс и контекст команды.

      Например, для US-01 команда проверяет приём кадрового события без дублей, получает замечания HR и меняет порядок дальнейших задач. В Scrum это выполняется с ответственностями PO, Scrum Master и Developers; в Kanban работа организуется через поток и его правила.

  - id: meth-waterfall-handoff
    level: middle
    question: Что передают между этапами Waterfall и кто разрешает переход?
    tags: [waterfall, артефакты]
    answer: |
      После требований — согласованную базу требований и критерии приёмки; после проектирования — архитектуру, модель данных и контракты; после разработки — сборку и результаты проверок; после испытаний — протоколы и состояние дефектов; после внедрения — работающую систему, инструкции и документы приёмки.

      Авторы, проверяющие и согласующие определяются проектом: аналитик, архитектор, разработка, тестирование, эксплуатация, заказчик. Руководитель проекта организует переходы; полномочия фиксируют, например, в RACI. Waterfall не задаёт универсальной роли утверждающего и не требует спринтов.

  - id: meth-sprint-results
    level: middle
    question: Что должно остаться после Scrum-спринта и что делать с незавершённой историей?
    tags: [scrum, артефакты]
    answer: |
      Пригодный инкремент по DoD, актуальные Product Backlog и Sprint Backlog с их целями. Команда также сохраняет нужные результаты проверок и обновляет затронутую документацию, учитывает обратную связь Review и выбирает улучшения на ретроспективе.

      PO отвечает за Product Backlog, Developers — за план Sprint Backlog и соблюдение DoD, Scrum-команда — за полезный инкремент. Незавершённая работа не входит в инкремент и возвращается в Product Backlog для дальнейшего рассмотрения. Спринт не продлевают до завершения всех карточек. Review не является воротами для релиза.

  - id: meth-ticket
    level: junior
    question: Что написать в тикете, чтобы команда могла взять его в работу?
    tags: [scrum, kanban, требования]
    answer: |
      Понятный заголовок, потребность и ценность, границы, критерии приёмки, ссылки на требования и зависимости. Затем согласовать порядок, оценку при необходимости и ответственного за следующий шаг. Для дефекта нужны среда, шаги, ожидаемое и фактическое поведение.

      Для US-01 критерии — новая идентичность по событию, запись аудита и отсутствие дублей при повторе eventId. Общие проверки качества задаются DoD / правилами завершения. Epic, Story, Task и Bug — типы трекера, а не обязательные артефакты Scrum.

  - id: meth-kanban-output
    level: junior
    question: Какие результаты и роли есть в Kanban, если спринтов нет?
    tags: [kanban, роль, артефакты]
    answer: |
      Результат оценивают по каждой завершённой задаче: изменение соответствует правилам завершения, есть необходимые проверки и актуальные документы. На обзорах потока команда использует метрики и уточняет правила и прогноз SLE.

      Обязательных новых должностей нет. Нужно явно распределить приоритеты, уточнение запроса, выполнение, проверку и координацию потока. За доску, контроль WIP и улучшения отвечает команда. Регулярный двухнедельный обзор сам по себе не создаёт спринт.

  - id: meth-board-blocked
    level: middle
    question: Проверка заполнена, а разработка заблокирована внешней командой. Что делать на доске?
    tags: [kanban, практика]
    answer: |
      Сначала помочь завершить проверку и разобрать препятствие, а не начинать ещё больше работы. У блокировки записать причину, связанную задачу, следующий шаг, ответственного и время следующей проверки. Начатая заблокированная карточка продолжает входить в WIP и накапливать возраст.

      Не скрывать ожидание переносом в бэклог и не повышать лимит автоматически. Если исключение необходимо, сделать его явным и обсудить влияние на поток и сроки.

  - id: meth-board-status
    level: junior
    question: Чем колонка доски отличается от статуса и почему карточка может исчезнуть?
    tags: [kanban, инструменты]
    answer: |
      Статус — состояние задачи в workflow; колонка — представление одного или нескольких статусов на доске. Карточка может не попадать под фильтр, оказаться в несопоставленном статусе или отдельном бэклоге, быть скрыта быстрым фильтром, правами или настройкой завершённых задач. В Scrum стоит также проверить выбранный спринт.

      Сначала проверить настройку и права, затем исправлять причину; дубликат задачи проблему не решает.
