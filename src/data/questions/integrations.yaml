title: Интеграции
page: integrations/styles
items:
  - id: int-styles
    level: junior
    frequent: true
    question: Какие бывают стили интеграции систем?
    tags: [стили]
    answer: |
      - **Обмен файлами** — выгрузка и загрузка по расписанию (CSV, XML). Просто, но задержки и сложная обработка ошибок.
      - **Общая база данных** — системы читают и пишут одни таблицы. Быстро сделать, но сильная связность; обычно запрещено политиками.
      - **Удалённый вызов (API)** — REST, SOAP, gRPC: синхронный запрос-ответ.
      - **Обмен сообщениями** — брокер (Kafka, RabbitMQ): асинхронно, слабая связность.

      Эти четыре стиля описаны ещё в книге «Enterprise Integration Patterns» (Hohpe, Woolf). Выбор зависит от того, нужен ли ответ сразу, допустима ли задержка, сколько получателей и кто должен выдерживать недоступность другого.

  - id: int-sync-async
    level: junior
    frequent: true
    question: Синхронная или асинхронная интеграция — как выбрать?
    tags: [стили]
    answer: |
      **Синхронно** — когда вызывающему нужен результат, чтобы продолжить (проверка, данные для экрана, создание с ответом). Платит доступностью: если получатель лёг, вызывающий тоже не может работать.

      **Асинхронно** — когда источник не должен зависеть от доступности получателя, важны пики и надёжная доставка, получателей несколько. Платит сложностью: идемпотентность, порядок, дубли, мониторинг очередей.

      В кейсе: кадровые события — асинхронно (HRMS не должна ждать IdM), провижининг — синхронно с повторами (нужен результат создания).

  - id: int-push-pull
    level: junior
    question: Push или pull — в чём разница?
    tags: [стили]
    answer: |
      - **Push** — источник сам отправляет данные или событие, когда оно произошло (вызов API, сообщение в брокер, webhook). Быстро, но источник должен знать о получателе или брокере.
      - **Pull** — получатель периодически опрашивает источник (polling). Просто для источника, но задержка до интервала опроса и лишняя нагрузка.

      В кейсе: события — push через Kafka, сверка — pull полного среза раз в сутки (ADR-001: вариант C + страховка).

  - id: int-rest-principles
    level: junior
    frequent: true
    question: Что такое REST? Какие у него основные принципы?
    tags: [rest]
    answer: |
      REST — архитектурный стиль (Roy Fielding, 2000), а не протокол. Основные идеи:

      - **ресурсы** с адресами (`/users/{login}`), а не вызовы процедур;
      - **единый интерфейс** — стандартные методы HTTP с определённой семантикой;
      - **без состояния** (stateless) — каждый запрос самодостаточен;
      - **представления** ресурса (JSON, XML);
      - **кэшируемость** ответов;
      - **многоуровневая система** (прокси, шлюзы прозрачны для клиента).

      На практике «REST API» обычно означает HTTP API с ресурсами, методами и кодами ответов.

  - id: int-http-methods
    level: junior
    frequent: true
    question: Какие методы HTTP безопасные, а какие идемпотентные?
    tags: [rest]
    answer: |
      | Метод | Назначение | Безопасный | Идемпотентный |
      |---|---|---|---|
      | GET | Получить | да | да |
      | HEAD | Только заголовки | да | да |
      | OPTIONS | Возможности | да | да |
      | POST | Создать / выполнить действие | нет | **нет** |
      | PUT | Заменить / установить целиком | нет | да |
      | PATCH | Изменить часть | нет | не гарантируется |
      | DELETE | Удалить | нет | да |

      **Безопасный** — не меняет состояние сервера. **Идемпотентный** — повтор даёт тот же результат на сервере, что и один вызов. Поэтому повтор POST опасен (создаст дубль), и для него нужен ключ идемпотентности.

  - id: int-status-codes
    level: junior
    frequent: true
    question: Какие коды ответа HTTP вы используете и когда?
    tags: [rest]
    answer: |
      - **200** OK; **201** Created (+ `Location`); **202** Accepted — принято в обработку асинхронно; **204** No Content.
      - **400** — синтаксически неверный запрос; **401** — не аутентифицирован; **403** — нет прав; **404** — нет ресурса; **409** — конфликт состояния; **422** — запрос понятен, но не проходит бизнес-проверку; **429** — слишком много запросов.
      - **500** — ошибка сервера; **502 / 504** — ошибка или тайм-аут шлюза; **503** — сервис временно недоступен (+ `Retry-After`).

      Правило для повторов: 5xx, 429 и тайм-ауты — повторять с задержкой; остальные 4xx — не повторять, это ошибка запроса или бизнес-ошибка (так в FR-16 кейса).

  - id: int-401-403-400-422
    level: junior
    question: Чем 401 отличается от 403, а 400 от 422?
    tags: [rest]
    answer: |
      - **401 Unauthorized** — «не знаю, кто ты»: нет или неверные учётные данные. **403 Forbidden** — «знаю, кто ты, но нельзя».
      - **400 Bad Request** — запрос некорректен синтаксически или по формату (не тот JSON, нет обязательного поля). **422 Unprocessable Content** — запрос корректен, но не проходит бизнес-проверку (неизвестный код филиала, логин занят по правилам).

      В кейсе адаптер АБС отвечает 422 на неизвестный `branchCode`.

  - id: int-put-patch
    level: middle
    frequent: true
    question: Чем PUT отличается от PATCH и POST?
    tags: [rest]
    answer: |
      - **PUT** — заменить ресурс целиком (или создать по известному адресу). Идемпотентен: повтор с тем же телом даёт тот же результат.
      - **PATCH** — изменить часть ресурса. Идемпотентность не гарантирована (например, «увеличить счётчик»), но может быть обеспечена (установка значения поля).
      - **POST** — создать ресурс в коллекции, адрес выбирает сервер; или выполнить действие. Не идемпотентен.

      Пример из кейса: `PUT /users/{login}/roles/{roleCode}` назначает роль — повтор безопасен; `POST /users` создаёт пользователя — нужен `Idempotency-Key`.

  - id: int-versioning
    level: middle
    question: Как версионировать API?
    tags: [rest]
    answer: |
      Способы: **в пути** (`/api/v1/…`) — самый наглядный и распространённый; **в заголовке** или **в типе содержимого** (`Accept: application/vnd.bank.v2+json`); **параметром** запроса.

      Правила важнее способа:
      - обратно совместимые изменения (новые необязательные поля, новые ресурсы) — без новой версии;
      - несовместимые (удалить или переименовать поле, изменить тип, сделать поле обязательным) — новая версия;
      - старая версия поддерживается оговорённый срок, у неё объявлена дата отключения;
      - клиенты игнорируют неизвестные поля.

      Для событий то же: в кейсе версия в имени топика (`hr.employee.events.v1`), несовместимые изменения — в новый топик.

  - id: int-pagination
    level: middle
    question: Какие бывают способы пагинации и чем они отличаются?
    tags: [rest]
    answer: |
      - **Offset / limit** (`?offset=100&limit=50`) или номер страницы — просто, можно перейти на любую страницу; но медленно на больших смещениях и «плывёт», если данные меняются во время чтения.
      - **Курсор / keyset** (`?after=<курсор>&limit=50`) — продолжение «после последнего элемента»; стабильно и быстро на больших объёмах, но нельзя прыгнуть на страницу N.

      В ответе — признак следующей страницы (курсор, ссылка `next`), иногда общее количество (дорого считать на больших таблицах).

  - id: int-rfc7807
    level: middle
    question: Что такое RFC 7807 / RFC 9457 и зачем стандартный формат ошибок?
    tags: [rest]
    answer: |
      Стандарт формата ошибок HTTP API — **Problem Details**, тип содержимого `application/problem+json`. RFC 9457 (2023) заменил RFC 7807 (2016), формат совместим.

      Поля: `type` (URI типа ошибки), `title` (краткое описание типа), `status` (HTTP-код), `detail` (описание конкретного случая), `instance` (URI конкретного случая), плюс свои расширения (например, список ошибок полей).

      Зачем: клиент обрабатывает ошибки всех API одинаково, по `type` отличает виды ошибок, не разбирая текст. В кейсе ошибки IdM API и адаптера АБС — в этом формате.

  - id: int-soap
    level: junior
    frequent: true
    question: Чем SOAP отличается от REST?
    tags: [soap]
    answer: |
      | | SOAP | REST |
      |---|---|---|
      | Что это | Протокол обмена XML-сообщениями | Архитектурный стиль поверх HTTP |
      | Формат | Только XML (конверт Envelope / Header / Body) | Обычно JSON, любой |
      | Контракт | WSDL + XSD, строгий, генерация клиентов | OpenAPI (необязательно) |
      | Ошибки | SOAP Fault | Коды HTTP + тело ошибки |
      | Стандарты | WS-Security, WS-ReliableMessaging и др. | HTTPS, OAuth 2.0 |

      SOAP до сих пор широко используется в банках, госсистемах и старых интеграциях; новые API чаще делают на REST.

  - id: int-grpc
    level: middle
    question: Что такое gRPC и когда его выбирают?
    tags: [grpc]
    answer: |
      Фреймворк удалённого вызова процедур: контракт описывается в `.proto` (Protocol Buffers), из него генерируется код клиента и сервера; транспорт — HTTP/2, бинарный формат.

      Четыре типа вызовов: унарный, серверный поток, клиентский поток, двунаправленный поток.

      Выбирают для **внутренних** вызовов между сервисами, когда важны скорость, строгий контракт и потоковая передача. Минусы: бинарный формат сложнее отлаживать, из браузера напрямую не вызвать (нужен gRPC-Web или шлюз), меньше инструментов у внешних партнёров.

  - id: int-graphql
    level: middle
    question: Что такое GraphQL и чем он отличается от REST?
    tags: [graphql]
    answer: |
      Язык запросов к API: клиент сам описывает, **какие поля** ему нужны, и получает ровно их — одним запросом, через одну точку входа. Схема типов строгая, есть интроспекция.

      Операции: **query** (чтение), **mutation** (изменение), **subscription** (подписка на события).

      Плюсы: нет лишних и недостающих данных (over-/under-fetching), удобно для фронтенда с разными экранами. Минусы: сложнее кэшировать на HTTP-уровне, риск тяжёлых запросов (нужны лимиты глубины и сложности), проблема N+1 на сервере, ошибки часто возвращаются с HTTP 200 в поле `errors`.

  - id: int-kafka-rabbit
    level: middle
    frequent: true
    question: Чем Kafka отличается от RabbitMQ?
    tags: [брокеры]
    answer: |
      | | Kafka | RabbitMQ |
      |---|---|---|
      | Модель | Распределённый журнал (лог) событий | Брокер очередей сообщений |
      | Хранение | Сообщения хранятся заданное время (retention), не удаляются после чтения | Сообщение удаляется из очереди после подтверждения |
      | Чтение | Потребители сами хранят позицию (offset), можно перечитать | Брокер доставляет и ждёт подтверждения (ack) |
      | Маршрутизация | Топики и партиции | Обменники (direct, topic, fanout, headers) и очереди |
      | Порядок | Внутри партиции | Внутри очереди (с оговорками при повторах) |
      | Сильные стороны | Большие потоки событий, повторное чтение, несколько независимых потребителей | Гибкая маршрутизация, очереди задач, приоритеты, запрос-ответ |

      В кейсе — Kafka: кадровые события может читать не только IdM, и порядок по человеку гарантируется ключом `personId`.

  - id: int-kafka-order
    level: middle
    question: Как гарантировать порядок событий в Kafka?
    tags: [брокеры]
    answer: |
      Kafka гарантирует порядок **только внутри партиции**. Партицию выбирает ключ сообщения: сообщения с одинаковым ключом попадают в одну партицию.

      Значит, ключ — идентификатор объекта, для которого важен порядок. В кейсе ключ — `personId`: все события одного человека (HIRE → HIRE_CHANGED → HIRE_CANCELLED) приходят по порядку, а события разных людей обрабатываются параллельно.

  - id: int-delivery-guarantees
    level: middle
    frequent: true
    question: Что такое at-most-once, at-least-once и exactly-once?
    tags: [брокеры, надёжность]
    answer: |
      - **At-most-once** — не более одного раза: сообщение может потеряться, но не продублируется.
      - **At-least-once** — не менее одного раза: не потеряется, но может прийти повторно.
      - **Exactly-once** — ровно один раз. Между разными системами на практике достигается как **at-least-once + идемпотентная обработка** на стороне получателя.

      В кейсе: доставка at-least-once (NFR-05), идемпотентность по `eventId` (FR-03).

  - id: int-retry
    level: middle
    question: Как правильно повторять запросы при ошибках?
    tags: [надёжность]
    answer: |
      - **Повторять только временные ошибки:** тайм-ауты, 5xx, 429, недоступность. Ошибки клиента и бизнес-ошибки (4xx) повтор не исправит.
      - **Повторять только безопасные операции:** идемпотентные по семантике (GET, PUT, DELETE) или с ключом идемпотентности (POST).
      - **Экспоненциальная задержка с джиттером:** 1 с, 2 с, 4 с… плюс случайная добавка — чтобы клиенты не «били» сервер одновременно.
      - **Ограничение числа попыток** и общего времени; учитывать `Retry-After`.
      - **Что после исчерпания:** ручная задача, DLQ, алерт.

      В кейсе (FR-16): 3 попытки с задержкой 1 и 5 минут, затем задача в ServiceDesk.

  - id: int-outbox
    level: senior
    question: Что такое паттерн Transactional Outbox и какую проблему он решает?
    tags: [надёжность]
    answer: |
      Проблема **двойной записи**: сервис должен изменить данные в своей БД **и** отправить событие в брокер. Если записать в БД и упасть до отправки — событие потеряно; если отправить и откатить транзакцию — отправлено ложное событие.

      Решение: в **той же локальной транзакции**, что и изменение данных, записать событие в таблицу `outbox`. Отдельный процесс (опрос таблицы или чтение журнала изменений БД — CDC) публикует события в брокер и помечает отправленные. Доставка — at-least-once, поэтому получатель должен быть идемпотентным.

      Зеркальный паттерн на стороне получателя — **inbox**: таблица обработанных сообщений для отсева дублей (в кейсе — `hr_event_inbox`).

  - id: int-saga
    level: senior
    frequent: true
    question: Что такое сага? Чем хореография отличается от оркестрации?
    tags: [надёжность]
    answer: |
      **Сага** — длинная бизнес-операция из последовательности локальных транзакций в разных сервисах. Если шаг не удался, выполняются **компенсирующие действия** для уже сделанных шагов (не откат, а «обратная» операция).

      - **Хореография:** сервисы реагируют на события друг друга, центрального управляющего нет. Просто при 2–3 шагах, но сквозной процесс трудно увидеть.
      - **Оркестрация:** координатор (оркестратор) вызывает шаги и компенсации, хранит состояние саги. Понятнее для сложных процессов.

      В кейсе: отмена приёма после создания учётных записей — компенсация (удалить созданные учётные записи, отменить ручные задачи, SEQ-03, BRL-06); IdM выступает оркестратором провижининга.

  - id: int-circuit-breaker
    level: middle
    question: Что такое circuit breaker?
    tags: [надёжность]
    answer: |
      «Автоматический выключатель» для вызовов зависимого сервиса. Три состояния:

      - **Closed** — вызовы идут, ошибки считаются;
      - **Open** — после порога ошибок вызовы **сразу** отклоняются (не ждём тайм-аутов, не добиваем больной сервис);
      - **Half-open** — через время пропускается пробный вызов: успех → Closed, ошибка → снова Open.

      Защищает от каскадных отказов и даёт зависимому сервису восстановиться. Для аналитика это требование: что делает система, пока зависимость недоступна (очередь, отложенная задача, сообщение пользователю).

  - id: int-dlq
    level: junior
    question: Что такое DLQ и что нужно про неё описать в требованиях?
    tags: [надёжность]
    answer: |
      **Dead Letter Queue** — очередь или топик для сообщений, которые не удалось обработать: некорректный формат, исчерпаны повторы, «ядовитое» сообщение.

      В требованиях: что попадает в DLQ, кто и в какой срок разбирает, как узнают (алерт, инцидент), как вернуть сообщение в обработку после исправления, сколько хранится. В кейсе — `hr.employee.events.v1.dlq`, разбирает команда HRMS, создаётся инцидент (FR-02).

  - id: int-webhook
    level: middle
    question: Как спроектировать надёжный и безопасный webhook?
    tags: [webhooks]
    answer: |
      **Для получателя:**
      - аутентификация отправителя: подпись тела (HMAC с общим секретом), mTLS или OAuth-токен;
      - защита от повторного воспроизведения: метка времени в подписи, окно допустимости;
      - **идемпотентная** обработка по идентификатору события;
      - быстрый ответ 2xx, тяжёлая обработка — асинхронно.

      **Для отправителя:** повторы с увеличивающейся задержкой при ошибке или тайм-ауте, журнал доставок, возможность переотправить.

      **Страховка:** периодическая сверка, потому что webhook может не дойти. В кейсе webhook ServiceDesk о закрытии задачи идемпотентен: повтор для завершённой задачи — 204.

  - id: int-json-schema
    level: middle
    question: Что такое JSON Schema и как её использует аналитик?
    tags: [форматы]
    answer: |
      Язык описания структуры JSON: типы, обязательные поля (`required`), ограничения (`maxLength`, `pattern`, `enum`, `minimum`), вложенные объекты и массивы, запрет лишних полей (`additionalProperties: false`), условия (`if / then`).

      Аналитик использует её, чтобы **однозначно** описать формат сообщения или тела запроса, проверить примеры автоматически и передать разработке проверяемый контракт. Схемы в OpenAPI 3.1 и AsyncAPI основаны на JSON Schema.

  - id: int-format-pitfalls
    level: middle
    question: Какие ловушки в форматах данных чаще всего ломают интеграции?
    tags: [форматы]
    answer: |
      - **Даты и время:** формат и часовой пояс. Используйте ISO 8601 / RFC 3339 со смещением (`2027-03-15T07:00:00+05:00`) или UTC.
      - **Деньги и точные числа:** не float; строка или целое в минимальных единицах + валюта.
      - **null против отсутствия поля:** «очистить значение» и «не менять» — разные вещи, особенно в PATCH.
      - **Кодировка:** UTF-8; «ё», длинные фамилии, апострофы.
      - **Длины полей** в приёмнике короче, чем в источнике.
      - **Перечисления:** новое значение в источнике ломает строгий приёмник.
      - **Регистр и пробелы** в идентификаторах и логинах.

  - id: int-openapi
    level: junior
    frequent: true
    question: Что описывает OpenAPI-спецификация?
    tags: [контракты]
    answer: |
      Контракт HTTP API в формате YAML или JSON:
      - `info`, `servers` — что за API и где он;
      - `paths` — адреса и методы, параметры, тела запросов, **ответы с кодами и ошибками**;
      - `components/schemas` — модели данных; `components/securitySchemes` — аутентификация;
      - примеры (`example`, `examples`).

      По нему генерируют документацию, клиентов, заглушки (mock) и тесты. Хороший контракт — с ошибками, примерами и описаниями, а не только «200 OK».

  - id: int-contract-first
    level: middle
    question: Contract-first или code-first — что лучше для интеграций между командами?
    tags: [контракты]
    answer: |
      - **Contract-first:** сначала согласуют контракт (OpenAPI / AsyncAPI), потом обе стороны реализуют параллельно; клиент работает с заглушкой по контракту.
      - **Code-first:** контракт генерируется из кода сервиса.

      Для интеграций между командами обычно лучше **contract-first**: контракт — предмет договорённости, его ревьюит аналитик, изменения видны в диффе, обе команды не ждут друг друга. Code-first удобен внутри одной команды, когда сервис и клиент меняются вместе.

  - id: int-api-client-server
    level: junior
    frequent: true
    question: Что такое API и клиент-серверная архитектура?
    tags: [основы]
    answer: |
      **API (application programming interface)** — набор операций, через которые одна программа обращается к другой, и правила обращения: адреса, форматы, ошибки, права. Описывается контрактом (OpenAPI, AsyncAPI, WSDL). API бывает не только у веб-сервисов: у библиотеки, операционной системы и брокера сообщений он тоже есть.

      **Клиент-серверная архитектура** — роли разделены:
      - **клиент** инициирует запрос (браузер, мобильное приложение, другая система);
      - **сервер** обрабатывает запрос и отвечает, хранит данные и бизнес-логику.

      Одна и та же система бывает и клиентом, и сервером. В кейсе IDM-JOINER IdM — сервер для портала и ServiceDesk, но клиент для адаптера АБС. Аналитику это важно, чтобы понимать, кто инициирует обмен, чьи ошибки и чьи тайм-ауты описывать.

  - id: int-get-post
    level: junior
    frequent: true
    question: Чем GET отличается от POST?
    tags: [REST, HTTP]
    answer: |
      | | GET | POST |
      |---|---|---|
      | Назначение | Получить ресурс | Создать ресурс или выполнить действие |
      | Меняет состояние | Нет (безопасный метод) | Да |
      | Идемпотентен | Да | Нет — без ключа идемпотентности повтор создаст дубль |
      | Параметры | В URL (путь и query) | В теле запроса |
      | Кэширование | Можно | Обычно нет |
      | Повтор при сбое | Безопасен | Только с `Idempotency-Key` |

      Частая ошибка — передавать в GET чувствительные данные: URL оседает в логах прокси, серверов и в истории браузера. ПДн и секреты передают в теле запроса или заголовках. Обратная ошибка — сложный поиск через POST «потому что параметров много»: так допустимо, но кэширование и идемпотентность тогда теряются.

  - id: int-idempotency
    level: middle
    frequent: true
    question: Что такое идемпотентность? Как сделать POST идемпотентным?
    tags: [REST, надёжность]
    answer: |
      **Идемпотентность** — свойство операции, при котором повторный вызов с теми же данными даёт тот же результат, что и первый, без новых побочных эффектов. Это важно, потому что в сети любой запрос могут повторить: клиент не получил ответ из-за тайм-аута, брокер доставил сообщение дважды.

      По HTTP-семантике GET, PUT и DELETE идемпотентны, а POST и PATCH — нет.

      Как сделать POST идемпотентным:
      1. Клиент генерирует **ключ идемпотентности** (`Idempotency-Key`) на каждую бизнес-операцию.
      2. Сервер сохраняет ключ вместе с результатом.
      3. Повтор с тем же ключом получает **сохранённый ответ**, а новая запись не создаётся.
      4. Тот же ключ с другим телом — ошибка (обычно 422 или 409).
      5. В требованиях описывают срок хранения ключей и поведение при параллельных повторах.

      Альтернатива — естественный ключ: уникальность по бизнес-идентификатору. В кейсе IDM-JOINER ключ идемпотентности вызова адаптера АБС — `task_id` задачи провижининга, а кадровые события дедуплицируются по `eventId` (FR-03). Попробовать вживую можно в API Lab: задание «Повтор создал два заказа».

  - id: int-rest-restful
    level: junior
    question: Чем REST отличается от RESTful API и от «просто HTTP API»?
    tags: [REST]
    answer: |
      - **REST** — архитектурный стиль с ограничениями: клиент-сервер, отсутствие состояния на сервере между запросами, кэшируемость, единообразный интерфейс (ресурсы, методы, представления), многоуровневость.
      - **RESTful API** — API, построенное по этим ограничениям: ресурсы-существительные (`/employees/{id}`), методы HTTP по смыслу, коды ответов по смыслу, без сессионного состояния.
      - **«Просто HTTP API»** использует HTTP как транспорт, но не следует стилю: `POST /getEmployee`, всё через POST, ошибки с кодом 200 и полем `error` в теле.

      На практике полностью RESTful API встречаются редко: гипермедиа (HATEOAS) почти никто не делает. На собеседовании важно показать, что вы понимаете ограничения стиля и что даёт каждое: например, отсутствие состояния позволяет масштабировать сервер горизонтально.

  - id: int-topic-queue
    level: junior
    question: Чем топик отличается от очереди?
    tags: [брокеры]
    answer: |
      - **Очередь** — каждое сообщение получает **один** из потребителей; после обработки оно удаляется. Модель «точка-точка», распределение работы между исполнителями (RabbitMQ, очередь).
      - **Топик** — сообщение получает **каждый подписчик** (каждая группа потребителей). Модель «публикация-подписка». В Kafka сообщения ещё и **хранятся** заданное время, так что новый потребитель может прочитать историю.

      Внутри одной группы потребителей Kafka сообщения делятся между экземплярами по партициям, как в очереди.

      Пример из кейса IDM-JOINER: топик `hr.employee.events.v1`. Кадровые события HRMS читает IdM, а при необходимости и другие системы — каждая своей группой, не мешая друг другу.

  - id: int-esb-broker
    level: middle
    question: Что такое корпоративная шина (ESB) и чем она отличается от брокера сообщений?
    tags: [стили, брокеры]
    answer: |
      **ESB (enterprise service bus)** — промежуточный слой, через который системы организации обмениваются данными. Кроме доставки, шина берёт на себя логику: маршрутизацию по содержимому, преобразование форматов (XML и JSON, разные схемы), оркестрацию вызовов, адаптеры к старым системам, иногда контроль доступа и журналирование.

      **Брокер сообщений** (Kafka, RabbitMQ) только надёжно доставляет и хранит сообщения, а логика остаётся у отправителя и получателя («умные концы, глупые трубы»).

      | | ESB | Брокер |
      |---|---|---|
      | Логика | В шине | В системах |
      | Плюсы | Системам не нужно знать форматы друг друга | Простота, масштабируемость, слабая связность |
      | Минусы | Шина — узкое место и единая команда, через которую идут все изменения | Каждая система сама разбирает форматы |

      В банках ESB встречаются часто, и аналитику при интеграции через шину нужно описывать и контракт с шиной, и преобразования в ней.

  - id: int-xml-xsd-wsdl
    level: junior
    question: Что такое XML, XSD и WSDL?
    tags: [SOAP, форматы]
    answer: |
      - **XML** — текстовый формат с вложенными элементами и атрибутами, поддерживает пространства имён.
      - **XSD (XML Schema Definition)** — схема XML-документа: какие элементы обязательны, их типы, длины, шаблоны, количество повторений. По XSD документ можно проверить автоматически, как JSON — по JSON Schema.
      - **WSDL (Web Services Description Language)** — контракт SOAP-сервиса: операции, входные и выходные сообщения (типы — из XSD), адрес и протокол. По WSDL генерируют клиента и строят заглушку (например, в SoapUI).

      Для аналитика XSD и WSDL — то же, что OpenAPI для REST: источник истины контракта, по которому проверяют, кто прав в споре «ваша система шлёт неправильно».

  - id: int-api-gateway
    level: middle
    question: Что такое API-шлюз (API gateway)?
    tags: [архитектура, безопасность]
    answer: |
      **API-шлюз** — единая точка входа перед группой сервисов. Клиенты обращаются к шлюзу, он передаёт запрос нужному сервису и берёт на себя общие задачи:
      - маршрутизацию по пути и версии;
      - аутентификацию и проверку токенов;
      - ограничение частоты запросов и квоты;
      - журналирование и метрики;
      - иногда преобразование запросов и агрегацию ответов нескольких сервисов.

      Аналитику важно знать, что часть требований реализуется в шлюзе, а не в сервисе: например, лимит запросов и ответ 429 может выдавать шлюз. Кроме того, коды ошибок шлюза (502, 504) отличаются от ошибок самого сервиса, и это нужно учесть при разборе инцидентов.

  - id: int-browser-https
    level: middle
    frequent: true
    question: Что происходит, когда вы вводите адрес сайта в браузере? Как работает HTTPS?
    tags: [основы, HTTP, безопасность]
    answer: |
      1. **DNS:** браузер узнаёт IP-адрес по имени сайта (кэш, затем DNS-серверы).
      2. **TCP-соединение** с сервером, порт 443 для HTTPS.
      3. **TLS-рукопожатие:** сервер предъявляет сертификат, браузер проверяет, что сертификат выдан доверенным центром, не истёк и выдан на это имя. Стороны договариваются об общем сеансовом ключе: асимметричная криптография нужна, чтобы безопасно договориться, а дальше данные шифруются быстрым симметричным ключом.
      4. **HTTP-запрос** внутри зашифрованного канала: метод, путь, заголовки, cookie.
      5. **Ответ сервера:** статус, заголовки, тело (HTML); на пути могут стоять балансировщик, шлюз, кэш.
      6. **Браузер** разбирает HTML, догружает стили, скрипты и изображения (новые запросы) и рисует страницу.

      HTTPS — это HTTP поверх TLS. Он защищает от подслушивания и подмены в пути и подтверждает, что вы говорите с нужным сервером. При mTLS сертификат предъявляет и клиент.

  - id: int-file-exchange
    level: junior
    question: Когда интеграция через файлы (FTP, SFTP) оправдана и что про неё описать?
    tags: [стили]
    answer: |
      Обмен файлами оправдан для **пакетных** данных по расписанию: выписки, реестры, справочники, отчётность. Его выбирают, когда у партнёра нет API или объём большой, а задержка допустима.

      FTP передаёт данные и пароль открытым текстом, поэтому для чувствительных данных его не используют. **SFTP** работает поверх SSH и шифрует канал.

      Что описать:
      - формат и кодировку, схему или структуру, разделители;
      - имя файла (дата, номер пакета) и расписание;
      - как получатель понимает, что файл загружен полностью: временное имя, файл-флаг, контрольная сумма;
      - повторную загрузку того же файла — защиту от двойной обработки;
      - частичные ошибки: отклонить весь файл или только строки, файл-квитанцию с результатом;
      - хранение и удаление обработанных файлов.

  - id: int-etl
    level: middle
    question: Что такое ETL и чем он отличается от интеграции через API?
    tags: [стили, данные]
    answer: |
      **ETL (extract, transform, load)** — пакетный перенос данных: извлечь из источников, преобразовать (очистить, сопоставить, агрегировать), загрузить в приёмник, обычно в хранилище данных для отчётности. В варианте **ELT** сначала загружают сырые данные, а преобразуют уже в хранилище.

      | | ETL | Интеграция через API или события |
      |---|---|---|
      | Режим | Пакетный, по расписанию | По каждой операции, онлайн или почти онлайн |
      | Назначение | Аналитика, отчётность, миграция | Бизнес-процесс между системами |
      | Задержка | Часы | Секунды |
      | Связность | Читает данные источника, часто напрямую из БД | Через контракт |

      Аналитик описывает для ETL источники и маппинг полей, правила очистки и сопоставления, расписание, обработку ошибочных записей, сверку объёмов. Близкий пример из кейса IDM-JOINER — первичная миграция данных и ежедневная сверка с HRMS (FR-05).
