title: Эксплуатация и сопровождение
page: operations/support
items:
  - id: ops-incident-problem
    level: junior
    question: Чем инцидент отличается от проблемы и от запроса на изменение?
    tags: [эксплуатация]
    answer: |
      - **Инцидент** — незапланированное прерывание или ухудшение работы. Цель — **быстро восстановить** работу для пострадавших, в том числе обходным путём.
      - **Проблема** — причина одного или нескольких инцидентов. Цель — **найти корневую причину** и не допустить повторения.
      - **Запрос на изменение** — изменение системы, требований или процесса, в том числе по итогам разбора проблемы.

      Термины взяты из практик управления ИТ-услугами (ITIL). Смешивать их нельзя: «поднять за час» и «понять, почему упало» требуют разных решений и разных сроков.

  - id: ops-analyst-role
    level: junior
    question: Какова роль системного аналитика в сопровождении?
    tags: [эксплуатация]
    answer: |
      - Разбирает спорные инциденты: система работает **по требованиям**, но не так, как нужно, — это дефект требования, а не кода.
      - Сопоставляет наблюдаемое поведение с ФТ, контрактами, статусными моделями.
      - Оценивает, какие данные пострадали и безопасен ли повторный запуск операций.
      - Участвует в разборе проблем и ведёт запросы на изменение.
      - Формулирует требования к мониторингу, логам и runbook — и дополняет их после инцидентов.

  - id: ops-incident-chain
    level: middle
    question: После релиза 4% сотрудников перестали получать учётные записи в одной из систем. Как будете разбираться?
    tags: [эксплуатация, инцидент]
    answer: |
      По цепочке вопросов:
      1. **Где ошибка** — на каком шаге и в каком вызове: алерт → логи по `traceId` → ответ целевой системы.
      2. **Что ожидалось** — по ФТ, статусной модели и контракту.
      3. **Какая система — источник** — что изменилось перед сбоем (релизы, конфигурация, нагрузка), кто отвечает некорректно.
      4. **Дефект или контракт** — система сделала не то, что требуют требования (дефект), или требования и контракт не предусмотрели ситуацию (пробел требований или нарушение контракта).
      5. **Какие данные пострадали** — какие записи в каком состоянии, у кого, к какому сроку это критично.
      6. **Нужен ли повторный запуск (replay)** — и безопасен ли он: ключ идемпотентности, не сделано ли что-то вручную, не отменена ли операция.

      Параллельно — восстановить работу для пострадавших, а поиск корневой причины вынести в проблему.

  - id: ops-replay
    level: middle
    question: Когда повторный запуск операций (replay) после сбоя безопасен?
    tags: [эксплуатация, надёжность]
    answer: |
      - Операция **идемпотентна** или передаёт тот же **ключ идемпотентности**, что и исходная попытка — повтор не создаст дубль.
      - Причина сбоя устранена — иначе повтор снова упадёт.
      - Результат **не сделан вручную** за время сбоя — иначе повтор конфликтует с ручными данными.
      - Операция **всё ещё нужна** — например, приём сотрудника не отменён.
      - Порядок важен — повторяем в той последовательности, которой требует бизнес-логика.

      И проверяем результат после повтора, а не считаем, что «перезапустили — значит, работает».

  - id: ops-rca
    level: middle
    question: Как проводить анализ корневых причин (RCA)?
    tags: [эксплуатация, rca]
    answer: |
      - Собрать **хронологию**: что изменилось, когда началось, как обнаружили, что делали.
      - Спросить **«почему»** несколько раз (метод «5 почему»), пока не дойдём до причины в процессе, требованиях, проектировании или мониторинге, а не до «сервис ответил 503».
      - Причин обычно **несколько**: техническая, процессная, пробел требований, пробел мониторинга и тестов.
      - Для каждой — **действие** с владельцем и сроком: исправляющее (убрать причину) и предупреждающее (чтобы подобное не повторилось и обнаруживалось раньше).
      - Разбор **без поиска виноватых** (blameless): ищем слабое место системы и процесса, а не человека.

  - id: ops-bug-or-contract
    level: middle
    question: Как понять, это дефект кода или проблема требований и контракта?
    tags: [эксплуатация]
    answer: |
      Сравнить наблюдаемое поведение с источниками:
      - система поступила **не так, как написано** в требованиях и контракте → дефект реализации;
      - система поступила **ровно как написано**, но результат не нужен бизнесу → дефект требований или пробел (ситуация не предусмотрена);
      - смежная система **ведёт себя не по контракту** (новый код ответа, иной смысл поля) → нарушение контракта, вопрос к её владельцам;
      - контракт **не описывал** ситуацию (лимиты, редкие ошибки) → пробел контракта, нужен запрос на изменение.

      Это и есть ответ, который ждут от аналитика на разборе: не «кто виноват», а где расходятся ожидаемое и фактическое.

  - id: ops-observability
    level: middle
    question: Какие требования к мониторингу и логам должен заложить аналитик?
    tags: [эксплуатация, мониторинг]
    answer: |
      - **Метрики**, которые отвечают на бизнес-вопрос «успеем ли» (задержка обработки, очереди, доля ошибок по системам, готовность к сроку), а не только «сервер жив».
      - **Алерты** с порогом, приоритетом, получателем и **ссылкой на процедуру** — алерт без процедуры бесполезен.
      - **Структурированные логи** с идентификаторами бизнес-объектов и операций, **без ПДн**.
      - **Сквозной идентификатор** (traceId, correlationId), который проходит через все системы и попадает в журнал аудита.
      - **Runbook** для типовых ситуаций: признаки → проверка → действия → эскалация.

  - id: ops-priority
    level: junior
    question: Как определяется приоритет инцидента?
    tags: [эксплуатация]
    answer: |
      Обычно по сочетанию **влияния** (сколько пользователей и функций затронуто, есть ли риск безопасности или денег) и **срочности** (как быстро ущерб растёт). От приоритета зависят время реакции и восстановления по SLA.

      Хорошо учитывать бизнес-контекст системы: в кейсе IDM-JOINER сбой за день до выхода сотрудников важнее такого же сбоя за неделю — срочность определяется датой выхода.

  - id: ops-postmortem
    level: senior
    question: Что должно получиться по итогам разбора серьёзного инцидента?
    tags: [эксплуатация, rca]
    answer: |
      - Хронология и масштаб: что, когда, сколько пострадало.
      - Корневые причины — несколько, разных типов.
      - Действия с владельцами и сроками: исправляющие и предупреждающие.
      - Запросы на изменение — в требования, контракты, систему, тесты, мониторинг, runbook.
      - Что сработало хорошо (чтобы это сохранить).

      И проверка через время: выполнены ли действия и не повторился ли инцидент.

  - id: ops-what-to-log
    level: middle
    question: Как определить, какие данные логировать, а какие нет?
    tags: [эксплуатация, мониторинг, безопасность]
    answer: |
      Отталкиваться от вопросов, на которые логи должны отвечать при разборе: **что произошло с этой операцией, где, когда и почему не получилось**.

      **Логировать:**
      - время и уровень, компонент;
      - сквозной идентификатор (`traceId`) и бизнес-идентификаторы (`eventId`, `taskId`, `personId`);
      - вызовы смежных систем: метод, путь, HTTP-код, длительность, номер попытки;
      - переходы статусов, решения ветвления («правило не найдено → базовая роль»);
      - ошибки с причиной.

      **Не логировать:**
      - пароли, токены, секреты, одноразовые коды — никогда;
      - ПДн целиком (ФИО, телефон, паспорт) — вместо них идентификаторы;
      - тела запросов целиком «на всякий случай».

      Отдельно: **журнал аудита** — не логи. Действия пользователей с основанием и результатом пишутся туда, хранятся годы и не изменяются. В кейсе IDM-JOINER формат логов описан в мониторинге: структурированный JSON, `traceId`, без ПДн.
