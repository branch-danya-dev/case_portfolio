title: Тестирование для аналитика
page: testing/test-types
items:
  - id: test-levels
    level: junior
    question: Какие бывают уровни тестирования?
    tags: [виды]
    answer: |
      - **Модульное (unit)** — отдельные функции и классы; делает разработка.
      - **Интеграционное** — взаимодействие компонентов и систем: API, сообщения, БД.
      - **Системное** — система целиком против требований (ФТ и НФТ).
      - **Приёмочное** — заказчик и пользователи проверяют, что система решает их задачу (UAT, приёмочные испытания по ПМИ).

      Пирамида тестирования: много быстрых модульных тестов внизу, меньше интеграционных, ещё меньше сквозных (UI) тестов наверху.

  - id: test-types
    level: junior
    question: Какие виды тестирования вы знаете?
    tags: [виды]
    answer: |
      - **Функциональное** — что делает система (по ФТ).
      - **Нефункциональное:** нагрузочное и производительности, стресс-тестирование, безопасности, удобства использования, совместимости, отказоустойчивости и восстановления.
      - **Регрессионное** — не сломалось ли то, что работало.
      - **Дымовое (smoke)** — быстрая проверка, что ключевые функции вообще работают после сборки.
      - **Позитивное / негативное** — корректные данные и сценарии / ошибки, неверный ввод, сбои.

  - id: test-analyst-role
    level: junior
    question: Какова роль аналитика в тестировании?
    tags: [роль]
    answer: |
      - Пишет **проверяемые** требования и критерии приёмки — основа тестов.
      - Даёт модели, из которых выводятся тесты: use cases (альтернативы), статусные модели (переходы), sequence-диаграммы (ветки `alt`), таблицы правил.
      - Проверяет **полноту** тестов по трассировке: у каждого требования есть тест.
      - Готовит или проверяет тестовые данные для краевых случаев.
      - Разбирает спорные дефекты: дефект кода или требования.
      - Участвует в приёмке (UAT, испытания по ПМИ).

  - id: test-equivalence
    level: junior
    question: Что такое классы эквивалентности? Приведите пример.
    tags: [тест-дизайн]
    answer: |
      Входные данные делятся на группы, внутри которых система ведёт себя одинаково; достаточно проверить по одному значению из каждого класса — допустимых и недопустимых.

      Пример: тип кадрового события `eventType`. Допустимые классы — `HIRE`, `HIRE_CHANGED`, `HIRE_CANCELLED` (каждый со своей логикой, значит отдельные классы). Недопустимые — неизвестное значение, пустое, отсутствует. Для всех недопустимых ожидается одно поведение — DLQ и инцидент.

  - id: test-boundary
    level: junior
    question: Что такое анализ граничных значений?
    tags: [тест-дизайн]
    answer: |
      Ошибки чаще всего живут на границах диапазонов: `<` вместо `<=`. Поэтому тестируют значения на границе и рядом с ней.

      Пример из кейса: логин не длиннее 20 символов — проверяем 19, 20 и 21 символ (при 21 фамилия усекается). Создание учётных записей за 3 рабочих дня до выхода — проверяем событие за 4, 3 и 2 рабочих дня (при 2 — создание сразу, TC-07 проверяет 1 день).

  - id: test-decision-table
    level: middle
    question: Когда использовать таблицу решений? Пример.
    tags: [тест-дизайн]
    answer: |
      Когда результат зависит от **комбинации нескольких условий**. Таблица перечисляет комбинации условий и ожидаемое действие для каждой — каждая колонка (правило) даёт тест, и видно пропущенные комбинации.

      Пример: политика повторов FR-16 — условия «тип ответа» (успех, 5xx / тайм-аут, 429, 4xx) и «попытка < 3» → действия «DONE», «повторить», «MANUAL + задача в ServiceDesk».

  - id: test-state-transition
    level: middle
    question: Как тестировать по статусной модели?
    tags: [тест-дизайн]
    answer: |
      - Каждый **разрешённый переход** — позитивный тест: исходное состояние + событие → ожидаемое состояние и действие.
      - Каждый **запрещённый переход** — негативный тест: событие в неподходящем состоянии отклоняется (в кейсе: ACTIVE → CREATED_DISABLED, DELETED → любой).
      - Цепочки переходов — для сквозных сценариев.

      Таблица переходов рядом с диаграммой — готовый список тестов.

  - id: test-pairwise
    level: senior
    question: Что такое попарное тестирование (pairwise)?
    tags: [тест-дизайн]
    answer: |
      Когда параметров много, полный перебор комбинаций невозможен. Попарное тестирование покрывает **все пары значений** любых двух параметров минимальным набором тестов — большинство дефектов проявляется на взаимодействии двух параметров.

      Пример: часовой пояс (4 значения) × фамилия: обычная, длинная, двойная (3) × тип трудоустройства (2) × наличие отчества (2) — полный перебор 48 комбинаций, попарный набор — от 12 тестов (4 × 3).

  - id: test-from-models
    level: middle
    question: Как вывести тесты из требований и моделей?
    tags: [тест-дизайн]
    answer: |
      - **Use case:** основной поток — позитивный тест, каждая альтернатива и исключение — отдельный тест.
      - **Статусная модель:** каждый переход и каждый запрещённый переход.
      - **Sequence:** каждая ветка `alt` (тайм-аут, ошибка, повтор).
      - **Бизнес-правила:** таблица решений по комбинациям условий.
      - **Поля и ограничения:** классы эквивалентности и граничные значения.
      - **НФТ:** нагрузочный, отказоустойчивости, безопасности.

      Так в кейсе выведен список TC-01 … TC-21.

  - id: test-pmi
    level: middle
    question: Что такое ПМИ и что в ней описывается?
    tags: [пми]
    answer: |
      **Программа и методика испытаний** — документ, по которому заказчик принимает систему: **что проверяем, где, как, кто участвует и по какому критерию испытания успешны**.

      Типичное содержание: объект и цель испытаний, объём (виды и перечень проверок со ссылками на требования), условия (стенд, данные), участники, порядок проведения, **критерии успешности**, отчётность (протокол, акт). Пишет QA, аналитик участвует; утверждает заказчик.

  - id: test-uat
    level: junior
    question: Что такое UAT и чем он отличается от системного тестирования?
    tags: [uat]
    answer: |
      **UAT** (User Acceptance Testing) — приёмочное тестирование **пользователями или заказчиком**: решает ли система их задачи в реальном процессе.

      Системное тестирование проводит QA против требований («сделано, как написано»). UAT проверяет «сделано то, что нужно» — на реальных сценариях и данных, людьми из бизнеса. Поэтому UAT находит дефекты требований, которые системное тестирование пропускает.

  - id: test-defect-severity
    level: junior
    question: Чем серьёзность дефекта отличается от приоритета?
    tags: [дефекты]
    answer: |
      - **Серьёзность (severity)** — насколько дефект влияет на работу системы: блокирующий, критичный, значительный, незначительный.
      - **Приоритет (priority)** — как срочно исправлять с точки зрения бизнеса.

      Они не всегда совпадают: опечатка в логотипе на главной — низкая серьёзность, но высокий приоритет; сбой в редко используемом отчёте — высокая серьёзность, но может подождать.

  - id: test-data
    level: middle
    question: Как подготовить тестовые данные?
    tags: [данные]
    answer: |
      - Покрыть **классы и границы**: обычные, краевые и некорректные значения.
      - Включить **неудобные реальные случаи**: длинные и двойные фамилии, «ё», однофамильцы, повторный приём, совместительство, разные часовые пояса.
      - **Синтетические данные** вместо продуктивных (требования ИБ и ПДн); если нужны реальные — обезличенные.
      - Описать предусловия: в каком состоянии должна быть система.
      - Для времени — управляемые часы стенда.

      В ПМИ кейса — 50 синтетических сотрудников с этими случаями и сдвиг системного времени планировщика.
