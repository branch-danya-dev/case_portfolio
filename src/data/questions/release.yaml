title: Релиз и продуктив
page: release/environments
items:
  - id: rel-environments
    level: junior
    question: Какие среды обычно бывают и зачем каждая?
    tags: [релиз, среды]
    answer: |
      - **DEV** — разработчики проверяют, работает ли код; вместо смежных систем часто заглушки.
      - **TEST (QA)** — тестировщики проверяют соответствие требованиям и интеграции.
      - **UAT** — заказчик и бизнес принимают систему: решает ли она их задачу.
      - **PREPROD (staging)** — копия продуктива по конфигурации и объёму: нагрузка, репетиция выкладки, миграции и отката.
      - **PROD** — реальные пользователи и данные.

      Набор зависит от компании: TEST и UAT бывают одним стендом, PREPROD есть не везде. Аналитику важно знать, что на какой среде проверяется и чем она отличается от продуктива — смежные системы, данные, объём.

  - id: rel-config-secrets
    level: junior
    question: Чем отличаются среды и где должны храниться пароли и ключи интеграций?
    tags: [релиз, среды, безопасность]
    answer: |
      На всех средах работает **одна и та же сборка**; отличаются только **конфигурация** (адреса систем, флаги, расписания, лимиты, получатели алертов) и **секреты** (пароли, ключи API, сертификаты).

      Секреты хранятся в **хранилище секретов**, отдельно для каждой среды; в коде и конфигурации — только имя секрета. Не в репозитории, не в письме, не в задаче и не на странице документации.

      Для аналитика это значит: всё, что зависит от среды, в требованиях — параметр конфигурации с таблицей значений, а не константа. Пример: в кейсе IDM-JOINER SMS на UAT уходят только на номера участников испытаний.

  - id: rel-provider-first
    level: middle
    question: Разработчик говорит «сначала выкатываем provider, потом consumer». Почему?
    tags: [релиз, совместимость, интеграции]
    answer: |
      Две системы нельзя выложить одновременно: между выкладками есть окно, когда одна сторона новая, а другая старая. Порядок выбирают так, чтобы в этом окне всё работало.

      Если потребитель начинает **вызывать новое** — новый метод или новое поле в запросе, — поставщик должен уметь это принять **до** того, как его начнут вызывать. Иначе потребитель получит 404 или 400, а то и хуже: поставщик молча проигнорирует поле, и данные потеряются.

      Общее правило: **первым выкладывается тот, кто должен понять новое**. В кейсе IDM-JOINER адаптер АБС выкладывается раньше IdM, потому что IdM вызывает адаптер.

  - id: rel-consumer-first
    level: middle
    question: Когда правильно выкладывать сначала потребителя, а потом поставщика?
    tags: [релиз, совместимость, интеграции]
    answer: |
      Когда новое появляется в **выходных данных поставщика**: новое значение enum, новый код ответа, новый тип события, новое поле в событии. Понять его должен потребитель, значит, он выкладывается первым — или заранее умеет пропускать незнакомое (tolerant reader).

      Пример из кейса IDM-JOINER, CHG-01: адаптер АБС начинает отвечать 429 с `Retry-After` вместо 503. Первой выкладывается IdM с обработкой 429, потом адаптер. При обратном порядке старая IdM сочтёт 429 технической ошибкой, сделает повторы по старой политике, и инцидент INC-01 повторится.

      Если новое должны понять обе стороны — переименование, новое обязательное поле, удаление, — изменение делят на несколько совместимых шагов: **расширение и сужение (expand/contract)**.

  - id: rel-db-migration
    level: middle
    question: Почему в одном релизе с приложением скрипты миграции БД должны быть только аддитивными?
    tags: [релиз, данные]
    answer: |
      Во время выкладки и при откате старая и новая версии приложения работают на **одной и той же схеме БД**. Если скрипт добавляет таблицу или столбец, допускающий пустое значение, старая версия его просто не замечает — откат приложения возможен без отката БД.

      Если скрипт удаляет или переименовывает столбец, старая версия падает: откат невозможен, а во время поэтапной выкладки ломаются ещё не обновлённые экземпляры.

      Поэтому несовместимые изменения схемы делают расширением и сужением: добавить новый столбец → приложение пишет в оба → заполнить новый столбец для старых строк → перейти на чтение нового → удалить старый **отдельным, более поздним** релизом.

  - id: rel-deploy-vs-release
    level: junior
    question: Чем выкладка (deploy) отличается от выпуска (release) и зачем нужны фича-флаги?
    tags: [релиз, фича-флаги]
    answer: |
      **Выкладка** — новая версия установлена на среду. **Выпуск** — пользователи начали пользоваться изменением. Фича-флаг разделяет эти события: код выложен заранее, а функция включается настройкой — для всех или для группы.

      Что это даёт:
      - выложить заранее и включить после решения go/no-go;
      - включать поэтапно: пилот, затем регионы;
      - откатить выключением флага за минуты, без новой выкладки.

      В требованиях нужно описать поведение **в обоих положениях флага**. В кейсе IDM-JOINER при выключенном флаге подразделения события сохраняются, но провижининг не выполняется.

  - id: rel-rollback
    level: middle
    question: Как описать откат релиза? Что нельзя вернуть откатом?
    tags: [релиз, откат]
    answer: |
      Откат описывают по уровням:
      1. **Флаг** — выключить функцию; минуты.
      2. **Версия** — вернуть предыдущую версию приложения; возможно, если схема БД с ней совместима.
      3. **Исправление вперёд (roll forward)** — выпустить исправление, когда откат невозможен или дороже.

      Для каждого уровня указывают, когда он применяется, кто решает и сколько он занимает. Кроме того, называют **точку невозврата**.

      Откатом не вернуть отправленные письма и SMS, записи в смежных системах, данные, которые изменили пользователи, и опубликованные события. План отката должен сказать, что с ними делать. В кейсе IDM-JOINER созданные учётные записи остаются и сверяются вручную.

  - id: rel-go-no-go
    level: middle
    question: Что такое go/no-go и какие критерии в него входят?
    tags: [релиз]
    answer: |
      Решение перед выпуском — выпускать или нет — по **заранее согласованным** критериям; известно, кто его принимает.

      Типичные критерии:
      - приёмочные тесты пройдены, нет открытых дефектов высокой критичности;
      - выкладка и откат отрепетированы;
      - миграция данных выполнена и сверена;
      - алерты и runbook готовы, дежурные назначены;
      - поддержка и пользователи предупреждены;
      - нет инцидентов в смежных системах и моратория на изменения.

      Невыполненный критерий означает перенос, а не «выпуск с оговорками». Решение записывают.

  - id: rel-smoke-vs-verification
    level: junior
    question: Чем smoke-проверка после выкладки отличается от проверки на продуктиве?
    tags: [релиз, тестирование]
    answer: |
      - **Smoke** — сразу после выкладки, за минуты: жива ли система, подключается ли к соседям, проходит ли тестовая операция. Если не прошла — откат или исправление сразу. Smoke не должен портить реальные данные.
      - **Проверка на продуктиве** — дни и недели: решает ли изменение задачу на реальных данных, по метрикам цели. Пример из кейса IDM-JOINER: доля сотрудников с доступами к 09:00 первого дня ≥ 95%.

      Релиз, прошедший только smoke, ещё не доказал, что изменение работает.

  - id: rel-release-notes
    level: junior
    question: Что должно быть в release notes и для кого они пишутся?
    tags: [релиз, документация]
    answer: |
      Release notes пишут **для каждой аудитории** — её языком:
      - **сопровождение** — компоненты и версии, новые алерты и процедуры, изменения конфигурации и флагов, как откатываться;
      - **поддержка** — что увидят пользователи и как отвечать на вопросы;
      - **пользователи** — что изменилось для них и с какой даты;
      - **смежные команды** — изменения контрактов и совместимость.

      Обязательно указывают **известные ограничения**. Список задач из трекера release notes не заменяет.
