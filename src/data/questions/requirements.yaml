title: Требования
page: requirements/levels
items:
  - id: req-levels
    level: junior
    question: Какие уровни требований вы знаете? Чем они отличаются?
    tags: [уровни]
    answer: |
      | Уровень | Вопрос | Пример из кейса |
      |---|---|---|
      | **Бизнес-требования** | Что нужно бизнесу и зачем? | BR-04: доступы готовы к первому дню и не активны до него |
      | **Пользовательские** (требования стейкхолдеров) | Что пользователь хочет сделать с помощью системы? | UC-03, US-08: руководитель запрашивает доступ из каталога |
      | **Функциональные** | Что должна делать система? | FR-08: активировать в 07:00 по часовому поясу подразделения |
      | **Нефункциональные** | Насколько хорошо: скорость, надёжность, безопасность? | NFR-04: доступность 99,5%, RTO 4 часа |

      Отдельно выделяют **бизнес-правила** (BRL-01: создавать за 3 рабочих дня), **ограничения** (запрет прямого доступа к БД АБС) и **требования к переходу** (миграция, обучение).

      Уровни связаны трассировкой: каждое ФТ должно вести к БТ, каждое БТ — к цели.

  - id: req-fr-vs-nfr
    level: junior
    question: Чем функциональное требование отличается от нефункционального? Приведите примеры.
    tags: [уровни, нфт]
    answer: |
      - **ФТ** — **что** система делает: «IdM должна генерировать уникальный логин по правилу…».
      - **НФТ** — **насколько хорошо** она это делает: «95% событий обрабатываются за 5 минут», «доступность 99,5%».

      Проверка: если убрать требование, исчезнет функция (ФТ) или ухудшится качество работы существующих функций (НФТ)?

      Важно: НФТ должны быть **измеримыми** и часто влияют на архитектуру сильнее, чем ФТ. В кейсе at-least-once доставка (NFR-05) потребовала идемпотентной обработки (FR-03).

  - id: req-good-properties
    level: junior
    question: Какими свойствами должно обладать хорошее требование?
    tags: [качество]
    answer: |
      Основные свойства (по ISO/IEC/IEEE 29148 и практике):

      - **Необходимое** — без него не достигается цель; есть источник.
      - **Однозначное** — понимается одинаково всеми.
      - **Атомарное** (единичное) — одно требование, а не несколько через «и».
      - **Проверяемое** — можно написать тест или критерий приёмки.
      - **Выполнимое** — реализуемо в рамках ограничений.
      - **Корректное** — соответствует потребности.
      - **Трассируемое** — есть ID и связи с источником и тестами.
      - **Независимое от реализации** — описывает «что», а не «как» (для ФТ и БТ).

      Для набора требований: **полнота** и **непротиворечивость**.

  - id: req-vague-words
    level: junior
    question: Какие формулировки делают требование плохим? Как их исправить?
    tags: [качество]
    answer: |
      Размытые слова: «быстро», «удобно», «надёжно», «современный», «интуитивный», «и т. д.», «при необходимости», «по возможности», «как минимум», «должна поддерживать», «обрабатывать», «гибкий».

      Как исправить — заменить измеримым критерием:

      | Было | Стало |
      |---|---|
      | Система должна работать быстро | 95% событий обрабатываются не дольше 5 минут (NFR-01) |
      | Интерфейс должен быть удобным | Руководитель создаёт заявку не более чем за 3 минуты без обучения (NFR-12) |
      | Поддерживать уведомления и т. д. | Отправлять руководителю e-mail при … ; отправлять SMS при … |

  - id: req-user-story
    level: junior
    question: Что такое user story и как она выглядит?
    tags: [user story]
    answer: |
      Короткое описание ценности с точки зрения пользователя:

      **«Как <роль>, я хочу <действие>, чтобы <ценность>»** + критерии приёмки.

      Пример (US-02 кейса): «Как администратор AD, я хочу, чтобы логин генерировался по единому правилу, чтобы не разбирать коллизии вручную». Критерии — сценарии Gherkin: коллизия логина, длинная фамилия.

      История — не спецификация, а **приглашение к разговору** (подход 3C: Card, Conversation, Confirmation). Детали уточняются на рефайнменте и фиксируются в критериях приёмки.

  - id: req-invest
    level: junior
    question: Что означает INVEST?
    tags: [user story]
    answer: |
      Критерии хорошей пользовательской истории:

      - **I — Independent:** не зависит от других историй (насколько возможно).
      - **N — Negotiable:** детали обсуждаемы, это не контракт.
      - **V — Valuable:** приносит ценность пользователю или бизнесу.
      - **E — Estimable:** команда может оценить.
      - **S — Small:** помещается в спринт.
      - **T — Testable:** есть проверяемые критерии приёмки.

  - id: req-story-split
    level: middle
    question: История не помещается в спринт. Как её разбить?
    tags: [user story]
    answer: |
      **Вертикально** — каждая часть даёт работающий сквозной результат, а не «сначала БД, потом API, потом UI».

      Приёмы:
      - **по шагам процесса:** создание учётной записи → активация → уведомление;
      - **по вариантам и правилам:** простой приём → повторный приём → совместительство;
      - **по данным:** одна целевая система → остальные;
      - **по сценариям:** успешный путь → ошибки и повторы;
      - **по интерфейсам:** сначала API, затем экран (если API сам по себе ценен);
      - **по качеству:** сначала работает, потом быстро (НФТ отдельной историей).

  - id: req-use-case-vs-story
    level: middle
    question: Чем use case отличается от user story? Когда что использовать?
    tags: [use case, user story]
    answer: |
      | | Use case | User story |
      |---|---|---|
      | Назначение | Полное описание взаимодействия актора с системой | Единица ценности для планирования |
      | Детализация | Основной поток, альтернативы, исключения, пред- и постусловия | Одна фраза + критерии приёмки |
      | Жизнь | Долгоживущее описание системы | Закрывается после реализации |

      Один use case обычно даёт несколько историй (основной поток, каждая важная альтернатива). Use cases хороши для сложных сценариев с множеством ветвлений и интеграций, истории — для планирования работы в спринтах.

  - id: req-use-case-structure
    level: junior
    question: Из чего состоит спецификация use case?
    tags: [use case]
    answer: |
      - ID и название (глагол + объект: «Обработать кадровое событие о приёме»);
      - основной и второстепенные акторы;
      - цель актора;
      - предусловия и триггер;
      - постусловия: при успехе и при неуспехе;
      - основной поток (пронумерованные шаги «актор — система»);
      - альтернативные потоки (3a, 4a — привязаны к шагу);
      - исключения;
      - связанные требования.

      Главная ценность — в альтернативных потоках и исключениях: там прячутся требования, которые иначе забывают.

  - id: req-acceptance-criteria
    level: junior
    question: Что такое критерии приёмки и как их писать?
    tags: [критерии приёмки]
    answer: |
      Условия, при которых требование или история считаются выполненными. Пишутся **до разработки** и проверяются тестом.

      Форматы:
      - **Список правил:** «Логин не длиннее 20 символов», «При коллизии добавляется суффикс 2…9».
      - **Gherkin:** Дано / Когда / Тогда — сценарий с конкретными данными.

      Хорошие критерии: проверяемые, конкретные (с данными), покрывают не только успешный путь, но и ошибки и граничные случаи.

  - id: req-gherkin
    level: junior
    question: Что такое Gherkin? Объясните Given / When / Then.
    tags: [gherkin]
    answer: |
      Формат описания поведения системы сценариями, понятный и людям, и инструментам автотестов (Cucumber и др.).

      - **Given (Дано)** — исходное состояние, контекст.
      - **When (Когда)** — действие или событие.
      - **Then (Тогда)** — ожидаемый результат, который можно проверить.
      - **And / But (И / Но)** — продолжение предыдущего шага.

      Дополнительно: **Background** — общие шаги для всех сценариев; **Scenario Outline + Examples** — один сценарий с таблицей данных.

      Пример из кейса: «Дано событие с eventId "e-1" уже обработано / Когда IdM повторно получает событие с eventId "e-1" / Тогда новых идентичностей не создаётся».

  - id: req-moscow
    level: junior
    question: Что такое MoSCoW?
    tags: [приоритизация]
    answer: |
      Метод приоритизации по категориям:

      - **Must** — без этого решение не имеет смысла или запуск невозможен;
      - **Should** — важно, но есть обходной путь;
      - **Could** — желательно, если останется время;
      - **Won't (this time)** — договорились, что не в этот раз.

      Важно: Won't — не удаление, а явная запись «отложено». В кейсе BR-12 (Mover/Leaver) записан со статусом W — требование не потеряно. Ошибка — когда всё «Must»: тогда приоритизации нет.

  - id: req-rice-wsjf
    level: middle
    question: Как работают RICE и WSJF? Чем отличаются?
    tags: [приоритизация]
    answer: |
      **RICE** = (Reach × Impact × Confidence) / Effort:
      - Reach — сколько пользователей или событий затронет за период;
      - Impact — насколько сильно (шкала, например 3 / 2 / 1 / 0,5 / 0,25);
      - Confidence — уверенность в оценках, %;
      - Effort — трудозатраты (человеко-месяцы, недели).

      **WSJF** (Weighted Shortest Job First, SAFe) = Cost of Delay / Job Size, где Cost of Delay = ценность для бизнеса + критичность по времени + снижение риска / новые возможности. Оценки — относительные, обычно по модифицированному ряду Фибоначчи.

      RICE — для продуктовых гипотез с измеримым охватом. WSJF — для очереди работ, где важна **стоимость задержки**: что выгоднее сделать раньше.

  - id: req-kano
    level: middle
    question: Что такое модель Кано?
    tags: [приоритизация]
    answer: |
      Классификация функций по влиянию на удовлетворённость:

      - **Обязательные** (must-be): их отсутствие вызывает недовольство, наличие — воспринимается как должное. Пример: учётная запись готова к первому дню.
      - **Одномерные** (performance): чем лучше, тем довольнее. Пример: скорость согласования заявки.
      - **Привлекательные** (attractive, delighters): неожиданный плюс. Пример: руководитель видит статус подготовки доступов в реальном времени.
      - **Безразличные** и **обратные** — не влияют или раздражают.

      Определяют анкетой с парой вопросов на функцию: «Как вы отнесётесь, если функция есть?» и «…если её нет?». Со временем привлекательные функции становятся обязательными.

  - id: req-traceability
    level: junior
    question: Что такое трассировка требований и зачем она нужна?
    tags: [трассировка]
    answer: |
      Связи между целями, требованиями разных уровней, элементами решения и тестами: цель → БТ → ФТ → use case / интеграция → тест.

      Зачем:
      - **анализ влияния:** что затронет изменение требования;
      - **поиск «сирот»:** ФТ без БТ (лишняя работа или пропуск в БТ), ФТ без теста (никто не проверит);
      - **приёмка:** показать, что каждое M-требование покрыто пройденным тестом.

      Прямая трассировка — от источника к реализации и тестам, обратная — от тестов и кода к требованиям.

  - id: req-change
    level: middle
    question: Заказчик хочет изменить согласованное требование посреди разработки. Ваши действия?
    tags: [изменения]
    answer: |
      1. Зафиксировать запрос на изменение (change request): что, зачем, кто инициатор.
      2. **Анализ влияния** по трассировке: какие ФТ, интеграции, данные, тесты, документы затронуты; оценка трудозатрат с командой.
      3. Варианты: принять сейчас, отложить в следующий релиз, отклонить; последствия для сроков и бюджета.
      4. Решение принимает владелец (заказчик / спонсор / PO), а не аналитик.
      5. Обновить требования (новая версия), трассировку, тесты; сообщить всем.

      Пример из кейса: если заказчик хочет активацию в 08:30 вместо 07:00 (BR-04 → FR-08), по трассировке видно, что затронуты UC-02, статусная модель, SEQ-01, NFR-04 и TC-06.

  - id: req-baseline
    level: middle
    question: Что такое базовая линия (baseline) требований?
    tags: [изменения]
    answer: |
      Согласованная и зафиксированная версия набора требований, от которой отсчитываются изменения. После baseline любое изменение проходит через управление изменениями: запрос, анализ влияния, решение, новая версия.

      Без baseline невозможно ответить «что поменялось с прошлого согласования» и оценить влияние изменения на сроки.
