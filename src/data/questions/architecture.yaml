title: Архитектура для аналитика
page: architecture/monolith-microservices
items:
  - id: arch-mono-micro
    level: junior
    question: Чем монолит отличается от микросервисной архитектуры?
    tags: [архитектура]
    answer: |
      - **Монолит** — одно приложение, разворачивается целиком, обычно одна БД. Просто разрабатывать, тестировать и отлаживать; но команды мешают друг другу, масштабируется и выкатывается целиком.
      - **Микросервисы** — набор небольших сервисов вокруг бизнес-возможностей, каждый со своими данными, разворачивается независимо. Независимые релизы и масштабирование; цена — сеть между сервисами, распределённые данные, сложная эксплуатация и отладка.

      Промежуточный вариант — **модульный монолит**: одно приложение, но с чёткими границами модулей. Часто разумный старт.

  - id: arch-when-micro
    level: middle
    question: Когда переход на микросервисы оправдан, а когда нет?
    tags: [архитектура]
    answer: |
      **Оправдан:** много команд, которым мешает общий релиз; части системы с разной нагрузкой или требованиями к доступности; разные технологии для разных задач; зрелая эксплуатация (CI/CD, мониторинг, трассировка).

      **Не оправдан:** маленькая команда; предметная область ещё не понятна (границы сервисов будут неверными); нет автоматизации развёртывания и мониторинга; «потому что модно».

      Для аналитика последствия: интеграции между сервисами, согласованность данных без общих транзакций (саги, сверки), контракты между командами.

  - id: arch-conway
    level: senior
    question: Что такое закон Конвея и при чём тут аналитик?
    tags: [архитектура]
    answer: |
      Закон Конвея: организации проектируют системы, которые копируют их коммуникационную структуру. Если три команды — скорее всего, будет три компонента, и границы пройдут там, где проходят границы команд.

      Для аналитика: границы требований, ответственность за контракты и интеграции часто совпадают с границами команд. В кейсе адаптер АБС делает команда АБС — отсюда отдельный контейнер, отдельный контракт и риск по срокам.

  - id: arch-nfr-iso
    level: middle
    question: Что такое ISO/IEC 25010 и как его использовать для НФТ?
    tags: [нфт]
    answer: |
      Стандарт модели качества программного продукта. В редакции 2011 года — 8 характеристик: функциональная пригодность, производительность (эффективность), совместимость, удобство использования, надёжность, защищённость, сопровождаемость, переносимость; у каждой — подхарактеристики. Редакция 2023 года расширила и переименовала часть характеристик.

      Использование: как **чек-лист**, чтобы не забыть категорию НФТ, и как общий словарь с архитектором. Каждое НФТ при этом формулируется измеримо: метрика, значение, условия, способ проверки.

  - id: arch-nfr-measurable
    level: junior
    question: Как сформулировать измеримое НФТ? Приведите пример.
    tags: [нфт]
    answer: |
      Шаблон: **метрика + целевое значение + условия + способ проверки**.

      Плохо: «Система должна работать быстро».
      Хорошо: «95% кадровых событий обрабатываются (от получения до формирования задач провижининга) не дольше 5 минут при нагрузке до 300 событий в день; проверка — нагрузочный тест и метрика `event_processing_seconds`» (NFR-01 + NFR-03 кейса).

      Для доступности — процент и окно измерения, плюс RTO и RPO.

  - id: arch-availability
    level: junior
    question: Что значит доступность 99,9%? Сколько это простоя?
    tags: [нфт, доступность]
    answer: |
      Доля времени, когда система работает. Допустимый простой:

      | Доступность | В год | В месяц (30 дней) |
      |---|---|---|
      | 99% | ≈ 3,65 дня | ≈ 7,2 часа |
      | 99,5% | ≈ 43,8 часа | ≈ 3,6 часа |
      | 99,9% | ≈ 8,76 часа | ≈ 43,2 минуты |
      | 99,99% | ≈ 52,6 минуты | ≈ 4,3 минуты |

      Важно договориться: за какой период считаем, входят ли плановые работы, что считается «недоступностью» (не отвечает, отвечает ошибками, отвечает медленно). Каждая «девятка» многократно дороже предыдущей.

  - id: arch-rto-rpo
    level: junior
    question: Что такое RTO и RPO?
    tags: [нфт, доступность]
    answer: |
      - **RTO** (Recovery Time Objective) — за какое время система должна восстановиться после сбоя.
      - **RPO** (Recovery Point Objective) — сколько данных допустимо потерять, измеряется временем: «данные не старше 15 минут до сбоя».

      Пример из кейса (NFR-04): RTO — 4 часа, RPO — 15 минут. Из RPO следует частота репликации или резервного копирования, из RTO — горячий или холодный резерв.

  - id: arch-cap
    level: middle
    question: Что такое теорема CAP?
    tags: [cap]
    answer: |
      Для распределённой системы при **разделении сети** (Partition) нельзя одновременно обеспечить **согласованность** (Consistency — все узлы отдают последнюю запись) и **доступность** (Availability — каждый запрос получает ответ). Приходится выбирать: отказывать в ответе (CP) или отвечать, возможно, устаревшими данными (AP).

      Частая ошибка — «выбрать два из трёх»: разделение сети в распределённой системе не выбирают, оно случается. Выбор — что делать, когда оно случилось. Расширение PACELC добавляет: и без разделения есть компромисс между задержкой и согласованностью.

  - id: arch-eventual
    level: middle
    question: Что такое согласованность в конечном счёте (eventual consistency) и как она влияет на требования?
    tags: [cap, данные]
    answer: |
      Данные в разных узлах или системах некоторое время могут различаться, но при отсутствии новых изменений придут к одному состоянию.

      Для требований это значит: определить **допустимую задержку** («статус в портале обновляется не позже чем через минуту»), что видит пользователь в промежутке, как обрабатывать конфликты, и нужна ли **сверка**. В кейсе статус учётной записи в IdM и в АБС согласуется через задачи провижининга и ежедневную сверку.

  - id: arch-cache
    level: middle
    question: Зачем нужен кэш и какие у него риски?
    tags: [кэш]
    answer: |
      Кэш хранит копию данных ближе к потребителю, чтобы отвечать быстрее и разгрузить источник.

      Риски: **устаревшие данные** (пользователь видит старое значение), **инвалидация** (когда и как сбрасывать), «шторм» запросов к источнику при одновременном истечении, расход памяти, сложность отладки.

      Аналитик фиксирует: какие данные можно кэшировать, **насколько они могут устаревать** (TTL), какие события должны сбрасывать кэш, и что недопустимо кэшировать (права доступа, баланс).

  - id: arch-cache-patterns
    level: senior
    question: Какие стратегии кэширования вы знаете?
    tags: [кэш]
    answer: |
      - **Cache-aside** (ленивое заполнение): приложение ищет в кэше, при промахе читает из источника и кладёт в кэш. Самая распространённая.
      - **Read-through:** кэш сам загружает из источника при промахе.
      - **Write-through:** запись идёт в кэш и синхронно в источник.
      - **Write-behind (write-back):** запись в кэш, в источник — асинхронно; быстро, но риск потери.

      Вытеснение: по TTL, LRU (давно не использованные). HTTP-кэширование: `Cache-Control`, `ETag`, условные запросы.

  - id: arch-adr
    level: junior
    question: Что такое ADR и из чего он состоит?
    tags: [adr]
    answer: |
      **Architecture Decision Record** — короткая запись об одном значимом архитектурном решении. Классический шаблон (Майкл Найгард): **название, статус, контекст, решение, последствия**. Часто добавляют рассмотренные варианты с плюсами и минусами.

      Зачем: через год никто не вспомнит, почему выбрали Kafka, а не REST. ADR отвечает «почему», помогает новым людям и не даёт бесконечно пересматривать решённое. В кейсе — ADR-001 (Kafka + сверка), ADR-002 (создание учётных записей заранее), ADR-003 (адаптер АБС).

  - id: arch-adr-role
    level: middle
    question: Какова роль аналитика в архитектурных решениях?
    tags: [adr, роль]
    answer: |
      Архитектор принимает решение (A), аналитик участвует (C, часто R по части описания):

      - формулирует **контекст**: какие требования и ограничения влияют на решение (БТ, НФТ, ограничения ИБ, объёмы);
      - помогает сравнить варианты по требованиям;
      - фиксирует **последствия для требований**: какие ФТ, НФТ, статусы, интеграции появляются из решения (в кейсе ADR-002 породил статус CREATED_DISABLED и требование учитывать часовой пояс).

  - id: arch-nfr-arch
    level: middle
    question: Почему НФТ влияют на архитектуру сильнее, чем ФТ? Пример.
    tags: [нфт]
    answer: |
      ФТ определяют, **что** делает система, — это можно реализовать во многих архитектурах. НФТ определяют **качество**, и для его достижения часто нужны структурные решения: кластер, резерв, асинхронность, кэш, шифрование.

      Примеры из кейса: NFR-05 (at-least-once, потеря событий недопустима) потребовал идемпотентной обработки и Kafka; NFR-04 (99,5% круглосуточно) — кластерного развёртывания IdM. Поэтому НФТ согласует архитектор.

  - id: arch-scalability
    level: middle
    question: Чем вертикальное масштабирование отличается от горизонтального?
    tags: [архитектура]
    answer: |
      - **Вертикальное** — более мощный сервер (CPU, память). Просто, но есть потолок и единая точка отказа.
      - **Горизонтальное** — больше экземпляров за балансировщиком. Нет жёсткого потолка и есть отказоустойчивость, но приложение должно быть без состояния (stateless) или уметь его разделять.

      Для требований: указать ожидаемый рост нагрузки и пики — от них зависит, нужна ли горизонтальная масштабируемость.
