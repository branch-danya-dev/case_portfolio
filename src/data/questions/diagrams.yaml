title: UML и архитектурные диаграммы
page: diagrams/choose
items:
  - id: diag-uml-types
    level: junior
    frequent: true
    question: Какие диаграммы есть в UML? Какими пользуется аналитик?
    tags: [uml]
    answer: |
      UML 2.5 определяет 14 диаграмм в двух группах.

      - **Структурные (7):** классов, объектов, компонентов, составной структуры, пакетов, развёртывания, профилей.
      - **Поведенческие (7):** вариантов использования, деятельности, конечных автоматов (состояний), а также диаграммы взаимодействия — последовательности, коммуникации, синхронизации (timing), обзора взаимодействия.

      Аналитик чаще всего использует: **use case, activity, sequence, state, class**. Реже — component и deployment (обычно их рисует архитектор).

  - id: diag-choose
    level: junior
    question: Как выбрать диаграмму под задачу?
    tags: [выбор]
    answer: |
      От вопроса, на который нужно ответить:

      | Нужно показать | Диаграмма |
      |---|---|
      | Работу людей и передачу между ролями | BPMN |
      | Кто пользуется системой и для чего | Use case |
      | Алгоритм с ветвлениями внутри системы | Activity |
      | Кто кого вызывает в сценарии, включая ошибки | Sequence |
      | Жизненный цикл объекта со статусами | State |
      | Сущности и связи | Class / ER |
      | Границы системы и соседей | C4 Context |
      | Из каких частей состоит решение | C4 Container / Component |
      | Где всё работает | Deployment |
      | Как движутся данные (часто для ИБ) | DFD |

  - id: diag-include-extend
    level: middle
    question: Чем include отличается от extend на диаграмме use case?
    tags: [use case]
    answer: |
      - **include** — базовый прецедент **всегда** включает другой. Стрелка от базового к включаемому. Пример: «Запросить доступ» всегда включает «Проверить SoD».
      - **extend** — прецедент-расширение добавляет поведение к базовому **при условии** в точке расширения. Стрелка от расширения к базовому. Пример: «Согласовать SoD-конфликт» расширяет «Обработать кадровое событие», если найден конфликт.

      Частая ошибка — путать направление стрелок и строить из include дерево функциональной декомпозиции.

  - id: diag-actor-system
    level: junior
    question: Может ли система быть актором?
    tags: [use case]
    answer: |
      Да. Актор — **роль внешнего участника**, который взаимодействует с системой: человек, другая система или даже таймер (время). В кейсе акторы — HRMS (источник кадровых событий) и Таймер (плановые запуски активации и сверки).

      Нельзя делать актором внутренний компонент своей системы — это нарушает её границу.

  - id: diag-sequence-elements
    level: junior
    frequent: true
    question: Какие элементы есть на sequence-диаграмме?
    tags: [sequence]
    answer: |
      - **Линии жизни** (lifelines) — участники: системы, сервисы, люди, очереди.
      - **Сообщения:** синхронное (сплошная линия, закрашенная стрелка, отправитель ждёт), асинхронное (открытая стрелка, не ждёт), ответ (пунктир).
      - **Активации** — прямоугольники на линии жизни: участник занят обработкой.
      - **Комбинированные фрагменты:** `alt` (ветвление), `opt` (необязательный), `loop` (цикл), `par` (параллельно), `break`, `ref` (ссылка на другую диаграмму).
      - Нумерация шагов — для ссылок из текста.

  - id: diag-sync-async
    level: middle
    question: Когда интеграция должна быть синхронной, а когда асинхронной?
    tags: [sequence, интеграции]
    answer: |
      **Синхронно** — когда вызывающему нужен результат сразу, чтобы продолжить: проверка, получение данных для экрана, создание с немедленным ответом. Минус — зависимость от доступности и скорости другой стороны.

      **Асинхронно** — когда результат не нужен немедленно, важна устойчивость к сбоям и пикам, есть несколько получателей: события, уведомления, длительная обработка. Минус — сложнее отладка, нужна идемпотентность, порядок, обработка дублей.

      В кейсе: кадровые события — асинхронно через Kafka (ADR-001), создание пользователя АБС — синхронно через REST с ключом идемпотентности.

  - id: diag-activity-vs-bpmn
    level: middle
    question: Чем activity-диаграмма отличается от BPMN?
    tags: [activity, bpmn]
    answer: |
      Нотации похожи (действия, развилки, параллельность, дорожки), но назначение разное:

      - **BPMN** — бизнес-процесс с участниками, событиями (таймеры, сообщения) и обменом между организациями. Аудитория — бизнес.
      - **Activity** — алгоритм или поток работ **внутри системы** или сценария use case. Аудитория — разработка и аналитики.

      Пример: процесс приёма сотрудника — BPMN; алгоритм генерации логина (FR-06) — activity.

  - id: diag-state-vs-activity
    level: junior
    question: Чем state-диаграмма отличается от activity?
    tags: [state, activity]
    answer: |
      - **State** — про **объект**: в каких состояниях он бывает и какие события его переводят. Узел — состояние («Создана, заблокирована»).
      - **Activity** — про **действия**: что делать и в каком порядке. Узел — действие («Создать учётную запись»).

      Признак ошибки: состояния названы глаголами («Создать») — это activity, нарисованная как state.

  - id: diag-state-transition
    level: middle
    question: Как записывается переход на state-диаграмме? Как статусная модель помогает тестированию?
    tags: [state]
    answer: |
      Переход: **`событие [условие] / действие`**. Например: `Ответ коннектора [успех] / сохранить external_id`.

      Для тестирования статусная модель — готовый список тестов:
      - каждый разрешённый переход — позитивный тест;
      - каждый запрещённый переход — негативный тест (в кейсе: ACTIVE → CREATED_DISABLED, DELETED → любой);
      - каждое событие в каждом состоянии — «что будет, если…».

      Удобно дублировать диаграмму таблицей переходов: её проще согласовывать и превращать в тесты.

  - id: diag-class-relations
    level: middle
    question: Какие связи бывают на диаграмме классов? Чем агрегация отличается от композиции?
    tags: [class]
    answer: |
      - **Ассоциация** — линия: объекты связаны.
      - **Агрегация** — пустой ромб у «целого»: часть может существовать без целого (сотрудник и отдел).
      - **Композиция** — закрашенный ромб: часть не существует без целого, удаляется вместе с ним (позиция заявки и заявка).
      - **Обобщение (наследование)** — линия с пустым треугольником к родителю.
      - **Реализация** — пунктир с пустым треугольником: класс реализует интерфейс.
      - **Зависимость** — пунктирная стрелка: один элемент использует другой.

      Кратности: `1`, `0..1`, `0..*` (`*`), `1..*`.

  - id: diag-class-vs-er
    level: middle
    question: Чем диаграмма классов отличается от ER-диаграммы?
    tags: [class, er]
    answer: |
      - **ER** — модель **данных**: сущности, атрибуты, ключи, связи и кардинальности. Основа для БД.
      - **Class** — модель **объектов**: кроме атрибутов, операции (методы), наследование, интерфейсы, видимость.

      Для аналитика, проектирующего данные, обычно достаточно ER или диаграммы классов без операций (доменная модель). Диаграмма классов с методами — инструмент разработки.

  - id: diag-c4-levels
    level: junior
    question: Какие уровни у модели C4?
    tags: [c4]
    answer: |
      1. **Context** — система, её пользователи и внешние системы. Аудитория — все, включая бизнес.
      2. **Container** — разворачиваемые части: приложения, сервисы, БД, очереди.
      3. **Component** — модули внутри одного контейнера.
      4. **Code** — классы; обычно не рисуют.

      Плюс вспомогательные: system landscape (все системы организации), dynamic (сценарий на контейнерах), deployment (где развёрнуто).

  - id: diag-c4-container
    level: middle
    question: Что такое контейнер в C4? Это Docker-контейнер?
    tags: [c4]
    answer: |
      Нет. **Контейнер C4** — любая отдельно разворачиваемая или запускаемая часть системы, которой нужно работать, чтобы система работала: веб-приложение, мобильное приложение, сервис, база данных, очередь, файловое хранилище.

      Он может быть развёрнут в Docker, а может и нет — это вопрос диаграммы развёртывания, а не C4 Container.

  - id: diag-c4-vs-uml
    level: middle
    question: Зачем C4, если есть UML component и deployment?
    tags: [c4, uml]
    answer: |
      C4 — не нотация, а **набор уровней абстракции** («карта с масштабом») с простыми обозначениями: прямоугольники с именем, типом, технологией и описанием, подписанные стрелки. Его легко читать без знания UML и легко поддерживать.

      UML component / deployment точнее формально (интерфейсы, порты, узлы), но тяжелее для широкой аудитории. На практике C4 — для общения о архитектуре, UML — когда нужна строгость.

  - id: diag-dfd
    level: middle
    question: Что такое DFD и когда его используют?
    tags: [dfd]
    answer: |
      **Data Flow Diagram** показывает, как данные движутся между внешними сущностями, процессами и хранилищами. Четыре элемента: внешняя сущность, процесс, хранилище данных, поток данных.

      Уровни: контекстная диаграмма (вся система — один процесс), затем декомпозиция процессов (уровень 1, 2…).

      Где применяют сегодня: **моделирование угроз** (данные + границы доверия, например для STRIDE), анализ потоков персональных данных, документирование интеграций «какие данные куда уходят». DFD не показывает порядок и управление — только движение данных.

  - id: diag-deployment
    level: middle
    question: Что показывает диаграмма развёртывания и зачем она аналитику?
    tags: [deployment]
    answer: |
      **Где и на чём** работает система: узлы (серверы, кластеры, ВМ, контейнерные платформы), среды выполнения, развёрнутые артефакты, каналы связи между узлами.

      Аналитику она нужна, чтобы понимать НФТ (доступность, отказоустойчивость, зоны безопасности), сетевые ограничения интеграций (какой сервис из какой зоны куда может ходить) и окружения (тест, прод). Рисует обычно архитектор или DevOps.

  - id: diag-sequence-timeout
    level: senior
    question: Как показать на sequence таймаут, когда неизвестно, выполнилась ли операция?
    tags: [sequence, надёжность]
    answer: |
      Фрагментом `alt`: в ветке «таймаут» вызывающий не получает ответа, ждёт и **повторяет запрос с тем же ключом идемпотентности**. Вторая ветка показывает, что сервер распознаёт повтор и возвращает уже созданный результат, а не ошибку.

      Именно так устроен SEQ-02 кейса: первый вызов создания пользователя АБС завершился таймаутом; повтор с тем же `Idempotency-Key` безопасен — адаптер вернёт ранее созданного пользователя. После исчерпания повторов — задача в ServiceDesk.
