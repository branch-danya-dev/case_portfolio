title: Выявление требований
page: elicitation/sources
items:
  - id: elic-sources
    level: junior
    question: Какие бывают источники требований?
    tags: [источники]
    answer: |
      - **Люди:** заказчик, пользователи, владельцы смежных систем, ИБ, аудит, эксплуатация, поддержка.
      - **Документы:** регламенты, должностные инструкции, договоры, нормативные акты, внутренние стандарты, предыдущие ТЗ.
      - **Существующие системы:** интерфейсы, база данных, логи, API, отчёты, обращения в поддержку.
      - **Данные и статистика:** сколько, как часто, как долго — то, что превращает «долго» в «6,2 дня».
      - **Рынок и аналоги:** как задача решена у конкурентов или в коробочных продуктах.

      Ни один источник не полон: люди описывают процесс «как должно быть», документы устаревают, система показывает только то, что автоматизировано. Хороший результат — сверка нескольких источников.

  - id: elic-techniques
    level: junior
    question: Какие техники выявления требований вы знаете и когда какую применять?
    tags: [техники]
    answer: |
      | Техника | Когда |
      |---|---|
      | Интервью | Нужна глубина, мнение конкретного человека, мало участников |
      | Воркшоп | Нужно договориться группе, есть противоречия, нужен общий результат за день |
      | Наблюдение (shadowing) | Процесс выполняют «на автомате», люди не могут его описать |
      | Анкетирование | Много респондентов, нужна статистика, вопросы уже понятны |
      | Анализ документов | Есть регламенты, нормативка, старые ТЗ |
      | Анализ систем и данных | Заменяем или интегрируем существующую систему |
      | Прототипирование | Требования к интерфейсу, пользователь «увидит — поймёт» |
      | Мозговой штурм | Нужны идеи, а не факты |

      На практике техники комбинируют: анализ документов → интервью → воркшоп для согласования.

  - id: elic-interview-prepare
    level: junior
    question: Как подготовиться к интервью со стейкхолдером?
    tags: [интервью]
    answer: |
      1. Определить **цель** интервью: какие решения или артефакты из него получатся.
      2. Изучить, что уже известно: документы, предыдущие встречи, роль человека.
      3. Составить **список вопросов** от общих к частным; отметить обязательные.
      4. Договориться о времени (обычно 45–60 минут), отправить повестку заранее.
      5. Подготовить материалы для обсуждения: черновую схему процесса, макет.
      6. Решить, кто ведёт протокол; спросить разрешение на запись.

      После интервью — протокол в течение суток, отправить участнику на подтверждение.

  - id: elic-open-closed
    level: junior
    question: Чем открытые вопросы отличаются от закрытых и когда какие задавать?
    tags: [интервью]
    answer: |
      - **Открытые** («Расскажите, как вы оформляете приём?») — дают развёрнутый ответ, раскрывают контекст и неожиданные детали. Их задают **в начале** темы.
      - **Закрытые** («Приказ всегда оформляется до выхода сотрудника?») — дают «да / нет» или конкретное значение. Их задают **в конце**, чтобы подтвердить понимание и зафиксировать факты.

      Ошибка — начинать с закрытых: собеседник подтверждает ваши предположения, и вы не узнаёте того, о чём не догадались спросить.

  - id: elic-5-why
    level: middle
    question: Что такое «5 почему» и как это помогает аналитику?
    tags: [интервью, техники]
    answer: |
      Техника поиска корневой причины: на каждый ответ задают вопрос «почему?», пока не дойдут до причины, которую можно устранить.

      Пример из кейса: «Сотрудник не может работать в первый день» → почему? «Доступы не готовы» → почему? «Заявку создали поздно» → почему? «Руководитель узнаёт о выходе в последний момент» → почему? «HR сообщает дату по почте, часто в день выхода». Корневая причина — процесс запускает человек, а не кадровое событие (P-01 → BR-01).

      «5» — условность: иногда хватает трёх вопросов, иногда нужно больше. Главное — не останавливаться на симптоме.

  - id: elic-workshop
    level: middle
    question: Как провести воркшоп по требованиям?
    tags: [воркшоп]
    answer: |
      1. **Цель и ожидаемый результат** — например, «согласованная TO-BE схема и список открытых вопросов».
      2. **Участники** — 5–8 человек с правом принимать решения; без лишних наблюдателей.
      3. **Повестка** с таймингом, материалы заранее.
      4. **Правила:** телефоны отложены, решения фиксируются сразу, спорные вопросы — в «парковку».
      5. **Фасилитатор** (часто аналитик) ведёт обсуждение, следит за временем, не продвигает свою позицию.
      6. **Итог:** зачитать решения и открытые вопросы с ответственными и сроками.
      7. **Протокол** — в течение суток.

  - id: elic-stakeholder-identify
    level: junior
    question: Как найти всех стейкхолдеров проекта?
    tags: [стейкхолдеры]
    answer: |
      - Пройти по процессу (AS-IS / TO-BE): кто участвует на каждом шаге.
      - Пройти по контекстной диаграмме: у каждой смежной системы есть владелец.
      - Спросить заказчика и каждого стейкхолдера: «Кого ещё нужно привлечь? Кто может заблокировать решение?».
      - Проверить «обязательных»: ИБ, аудит, юристы, комплаенс, эксплуатация, поддержка.
      - Посмотреть, кто согласовывал похожие проекты раньше.

      Самые опасные — забытые стейкхолдеры с правом вето: они появляются в конце и останавливают запуск.

  - id: elic-mendelow
    level: middle
    question: Что такое матрица Менделоу и как ею пользоваться?
    tags: [стейкхолдеры]
    answer: |
      Матрица «влияние × интерес» для выбора стратегии работы со стейкхолдером:

      | | Низкий интерес | Высокий интерес |
      |---|---|---|
      | **Высокое влияние** | Держать удовлетворёнными | Управлять плотно |
      | **Низкое влияние** | Наблюдать | Держать в курсе |

      Пример из кейса: архитектурный комитет — высокое влияние, низкий интерес → держать удовлетворёнными (защита архитектуры и ADR); руководители подразделений — средний уровень влияния, высокий интерес → интервью, пилот, обратная связь.

  - id: elic-conflict
    level: middle
    question: Два стейкхолдера требуют противоположного. Что вы делаете?
    tags: [конфликты]
    answer: |
      1. **Разобраться в интересах, а не в позициях:** зачем каждому это нужно. Часто за противоположными решениями стоят совместимые цели.
      2. **Проверить факты и данные:** конфликт может быть следствием разного понимания термина (глоссарий!) или устаревшей информации.
      3. **Предложить варианты**, удовлетворяющие обоим интересам, с плюсами, минусами и последствиями.
      4. **Если не договорились — эскалировать владельцу требований** (заказчику, спонсору). Аналитик готовит решение, но не принимает его сам.
      5. **Зафиксировать решение** и его обоснование.

      Пример из кейса: HRD хочет, чтобы руководитель сам выбирал права, CISO — только по ролям. Интересы: HRD — скорость и гибкость, CISO — минимальные привилегии и контроль. Решение: роли по умолчанию (BR-03) плюс заявки на дополнительные права с согласованием (BR-05).

  - id: elic-hidden-requirements
    level: middle
    question: Как выявить неявные (подразумеваемые) требования?
    tags: [техники]
    answer: |
      Неявные требования — то, что стейкхолдер считает очевидным и поэтому не называет.

      - **Наблюдение** за реальной работой: обходные пути, ручные таблицы, «костыли».
      - **Вопросы про исключения:** «Что если сотрудника уволили до выхода?», «Что если система недоступна?».
      - **Анализ существующей системы:** что она уже делает «тихо» (уведомления, проверки, автоматические поля).
      - **Чек-листы НФТ:** производительность, доступность, безопасность, аудит — заказчик о них редко говорит сам.
      - **Прототипы:** пользователь увидит — и вспомнит, чего не хватает.

  - id: elic-document-analysis
    level: junior
    question: Что даёт анализ документов и какие у него ограничения?
    tags: [документы]
    answer: |
      **Даёт:** формальные правила, нормативные ограничения, термины, состав данных, роли и ответственность. Хорошая подготовка к интервью — вы задаёте вопросы по делу.

      **Ограничения:** документы устаревают и описывают процесс «как должно быть», а не как он работает на самом деле. Расхождение между регламентом и практикой — отдельная ценная находка (в кейсе AS-IS описывает реальность, а не регламент 2021 года).

  - id: elic-system-analysis
    level: middle
    question: Как анализировать существующую систему, если документации нет?
    tags: [системы, данные]
    answer: |
      - **Интерфейс:** пройти основные сценарии, сделать скриншоты, собрать поля и проверки.
      - **База данных:** схема таблиц, ключи, справочники; запросы на количество, заполненность полей, уникальные значения (профилирование данных).
      - **Логи и журналы:** какие операции и как часто выполняются, где ошибки.
      - **Интеграции и API:** кто вызывает систему и что она отдаёт; спецификации, если есть, иначе — перехват запросов на тестовом стенде.
      - **Обращения в поддержку:** что ломается и что пользователи просят.
      - **Люди:** администраторы и старожилы знают «почему так сделано».

      Результат — реконструированная модель данных, список функций и бизнес-правил, которые нельзя потерять при замене системы.

  - id: elic-confirm
    level: junior
    question: Как убедиться, что вы правильно поняли требования?
    tags: [валидация]
    answer: |
      - Пересказать своими словами и попросить подтвердить.
      - Отправить протокол встречи с решениями и открытыми вопросами.
      - Показать модель: схему процесса, макет, пример данных, сценарий Gherkin.
      - Разобрать конкретный пример «от начала до конца» на реальных данных.
      - Попросить стейкхолдера сформулировать критерий приёмки: как он поймёт, что требование выполнено.
