title: Вход в проект
page: onboarding
items:
  - id: onb-first-week
    level: junior
    question: Вы вышли на новый проект системным аналитиком. Что будете делать первую неделю?
    tags: [вход в проект]
    answer: |
      Сначала определю, **какой это сценарий**: новый проект, зрелая система на сопровождении, проект в середине реализации, legacy без документации, замена системы или одна интеграция — от этого зависит план.

      Общее для всех сценариев:
      - получить доступы (вики, трекер, репозиторий, тестовые стенды, БД на чтение, мониторинг);
      - найти владельцев системы и процесса, тимлида, архитектора, QA, ИБ — и договориться о коротких встречах;
      - выяснить, где источник истины (source of truth): какие документы актуальны, а какие нет;
      - разобрать одну существующую функцию end-to-end — от экрана до БД и интеграций;
      - вести список вопросов и глоссарий с первого дня.

      Первый результат — не новый документ «с нуля», а **карта: что есть, кто за что отвечает, где расхождения и открытые вопросы**.

  - id: onb-scenario
    level: middle
    question: Чем отличается работа аналитика на новом проекте и на зрелой системе?
    tags: [вход в проект]
    answer: |
      - **Новый проект (greenfield):** вопрос «что построить и зачем». Работа идёт от цели и границ к AS-IS, требованиям и TO-BE; ограничений из существующей системы мало.
      - **Зрелая система (brownfield):** вопрос «что уже работает и почему именно так». Сначала изучение: архитектура, API, модель данных, интеграции, инциденты, бэклог. Изменение проектируется так, чтобы не сломать существующее поведение, на которое могут опираться пользователи и смежные системы.

      Главный риск на зрелой системе — менять то, чего не понимаешь: «странное» поведение часто закрывает требование, которое нигде не записано.

  - id: onb-mature-rule
    level: middle
    question: Почему не стоит сразу переписывать документацию и «улучшать архитектуру», придя на зрелую систему?
    tags: [вход в проект, сопровождение]
    answer: |
      Потому что вы ещё не знаете, **почему** система устроена именно так. За неочевидными решениями обычно стоят ограничения — требования ИБ, договорённости со смежными командами, особенности данных, прошлые инциденты, регуляторика.

      Правильный порядок: понять → проверить на реальной системе → обсудить с владельцами → зафиксировать решения (например, ADR задним числом) → и только потом предлагать изменения. Новая документация, написанная без понимания, расходится с системой и вводит в заблуждение следующих людей.

  - id: onb-e2e
    level: junior
    question: Как разобрать существующую функцию системы end-to-end?
    tags: [вход в проект, сопровождение]
    answer: |
      Взять один пользовательский сценарий и пройти его по всем слоям:
      1. **Интерфейс** — что видит и делает пользователь (тестовая учётная запись).
      2. **API** — какие запросы уходят (DevTools, контракт OpenAPI).
      3. **Логика** — какие правила и статусы срабатывают (документация, разговор с разработчиком).
      4. **Данные** — какие таблицы и поля меняются (клиент БД на тестовом стенде).
      5. **Интеграции** — какие события и вызовы уходят в смежные системы.
      6. **Логи и мониторинг** — как это выглядит в эксплуатации, какие бывают ошибки.

      Результат — sequence-диаграмма и описание функции, сверенные с реальностью.

  - id: onb-mid-project
    level: middle
    question: Вы пришли на проект в середине реализации — спринт 12, половина функций готова. С чего начнёте?
    tags: [вход в проект]
    answer: |
      Со **сверки состояния**, а не с новых требований: требования ↔ документация ↔ реализация ↔ тесты ↔ бэклог. Почти наверняка часть требований устарела, часть решений принята устно, часть реализовано не так, как написано.

      Первый результат — **оценка состояния проекта (Project State Assessment)**: что реализовано, что в разработке, что согласовано, но не реализовано, что изменилось, какие решения открыты, какие зависимости, где документация расходится с системой. Его согласуют с владельцем продукта и командой — это общая точка отсчёта.

  - id: onb-psa
    level: middle
    question: Что входит в оценку состояния проекта (Project State Assessment)?
    tags: [вход в проект]
    answer: |
      - Реализовано и работает (с проверкой на стенде, а не по статусу задачи).
      - В разработке — кто, когда ожидается.
      - Согласовано, но не реализовано.
      - Изменилось по сравнению с исходными требованиями — и кем решено.
      - Открытые решения и вопросы — с владельцами и сроками.
      - Зависимости от других команд и систем.
      - Расхождения: документация ↔ система, требования ↔ тесты.
      - Риски для сроков и качества.

      Формат — одна страница или таблица, по которой можно принять решения, а не отчёт ради отчёта.

  - id: onb-legacy
    level: middle
    question: Как восстановить требования к системе, у которой нет документации, а авторы ушли?
    tags: [вход в проект, legacy]
    answer: |
      Обратным проектированием (reverse engineering) по слоям: **интерфейс → API → БД → логи → интеграции → код и конфигурация → пользователи**.

      - Интерфейс и пользователи дают сценарии и «как работают на самом деле».
      - БД — сущности, статусы, справочники и качество данных.
      - Логи и интеграции — реальные потоки и частоту ошибок.
      - Код и конфигурация (с разработчиком) — правила, которые нигде не записаны.

      Каждую находку помечаю источником и степенью уверенности; противоречия выношу на обсуждение. Результат — перечень функций и правил, которые нельзя потерять, модель данных, карта интеграций и список открытых вопросов.

  - id: onb-replacement
    level: senior
    question: Что важно при замене существующей системы новой?
    tags: [вход в проект, миграция]
    answer: |
      - **Функциональная инвентаризация** старой системы — включая неочевидное поведение, на которое опираются пользователи и смежные системы.
      - **Gap-анализ** старое ↔ новое: что переносим, что меняем, что сознательно не переносим (и кто это решил).
      - **Маппинг и миграция данных**, качество данных, сверка после загрузки.
      - **Интеграции**: кто вызывает старую систему и как переключить потребителей.
      - **Стратегия перехода:** параллельная эксплуатация, поэтапное включение, переключение (cutover), откат (rollback).
      - **Сверка** результатов старой и новой системы на переходный период.

      Самая частая ошибка — перенести «как написано в документации» и потерять поведение, которое нигде не записано.

  - id: onb-cutover
    level: senior
    question: Что такое cutover и rollback и что должен продумать аналитик?
    tags: [миграция]
    answer: |
      **Cutover** — момент переключения работы со старой системы на новую. **Rollback** — возврат на старую систему, если что-то пошло не так.

      Аналитику нужно продумать: критерии готовности к переключению; что происходит с данными, созданными в новой системе, если откатываемся; как переключаются интеграции; можно ли включать поэтапно (по подразделениям, по типам операций); кто принимает решение об откате и по каким признакам; как сверяются данные после переключения.

      В кейсе IDM-JOINER автоматизация включается флагом на уровне подразделения, а откат — выключение флага с возвратом к заявкам в ServiceDesk; созданные учётные записи сверяются вручную.

  - id: onb-integration-only
    level: middle
    question: Вас позвали только на одну интеграцию — CRM должна начать работать с АБС. Что выясните?
    tags: [вход в проект, интеграции]
    answer: |
      Не нужно анализировать всю CRM. Нужно определить:
      - кто **provider**, кто **consumer**, кто **владелец данных** (мастер-система);
      - бизнес-сценарии и объёмы, требования к времени (SLA);
      - **контракт** (OpenAPI / AsyncAPI / WSDL) и **маппинг** полей;
      - **ошибки**, повторы, **идемпотентность**, поведение при недоступности;
      - **безопасность** — аутентификация, ПДн, сетевой доступ;
      - **мониторинг** и кто разбирает инциденты;
      - **тестовый контур** — есть ли стенды обеих систем и заглушки;
      - **процесс релиза** — кто и в каком порядке выкатывает изменения.

  - id: onb-source-of-truth
    level: junior
    question: Что такое source of truth документации и как его найти на новом проекте?
    tags: [вход в проект]
    answer: |
      **Источник истины** — место, которому команда договорилась верить: например, пространство Confluence с требованиями, репозиторий с контрактами, трекер с решениями. На проектах часто есть несколько копий одного документа — нужно понять, какая актуальна.

      Как найти: спросить владельца продукта и тимлида, посмотреть, куда ссылаются свежие задачи, сравнить даты и авторов изменений, проверить по реальной системе. Если источника истины нет — это первая находка и первый вопрос к команде.

  - id: onb-mistakes
    level: junior
    question: Какие ошибки чаще всего делают аналитики на новом проекте?
    tags: [вход в проект]
    answer: |
      - Сразу пишут новые документы вместо того, чтобы понять существующие.
      - Верят документации без проверки на системе.
      - Говорят только с заказчиком и не находят эксплуатацию, ИБ, владельцев смежных систем.
      - Не фиксируют вопросы и договорённости — через месяц никто не помнит, что решили.
      - Берут большое изменение до того, как разобрали хотя бы одну функцию end-to-end.
      - Не уточняют свою зону ответственности (RACI) и делают чужую работу или не делают свою.
