title: AS-IS, TO-BE и gap-анализ
page: processes/as-is-to-be
items:
  - id: proc-why-as-is
    level: junior
    question: Зачем описывать AS-IS, если всё равно будем делать по-новому?
    tags: [as-is]
    answer: |
      - **Понять проблемы и их причины.** Без AS-IS TO-BE легко превращается в «то же самое, только в новой системе».
      - **Измерить исходную точку.** Цели проекта формулируются как изменение метрик AS-IS: «6,2 дня → к первому дню».
      - **Не потерять то, что работает.** В AS-IS есть полезные практики и неочевидные функции, которые нужно сохранить.
      - **Увидеть объём изменений** — для gap-анализа, миграции и обучения.

      AS-IS можно пропустить или сделать минимальным, если процесса раньше не было вообще.

  - id: proc-as-is-reality
    level: junior
    question: Регламент описывает процесс одним образом, а люди работают иначе. Что вы описываете в AS-IS?
    tags: [as-is]
    answer: |
      **Реальность**, а не регламент. AS-IS нужен, чтобы увидеть настоящие потери и обходные пути — а они как раз в отклонениях от регламента.

      Расхождение «регламент vs практика» фиксируется отдельно как находка: возможно, регламент устарел, возможно, его нарушают по уважительной причине — и это тоже требование к TO-BE.

  - id: proc-as-is-metrics
    level: middle
    question: Какие метрики собрать при описании AS-IS?
    tags: [as-is, метрики]
    answer: |
      - **Время:** длительность процесса целиком и по этапам, время ожидания в очередях.
      - **Объём и частота:** сколько экземпляров процесса в день / месяц, пики.
      - **Качество:** доля возвратов, ошибок, повторных обращений.
      - **Трудозатраты:** человеко-часы на экземпляр или в месяц.
      - **Своевременность:** доля выполненных в срок.

      Источники — системы (ServiceDesk, журналы, выгрузки), а не оценки «на глаз». В кейсе: 6,2 рабочих дня в среднем, 40% заявок после выхода, 23% возвратов, ~180 ч/мес администраторов.

  - id: proc-to-be-content
    level: junior
    question: Что должно быть в описании TO-BE, кроме схемы процесса?
    tags: [to-be]
    answer: |
      - **Принципы** целевого процесса (например, «триггер — кадровое событие», «человек — только для исключений»).
      - **Шаги** с исполнителями и системами.
      - **Бизнес-правила** с ID — отдельно, чтобы не потерялись в тексте.
      - **Исключения:** что происходит при ошибках, отменах, нестандартных случаях.
      - **Ожидаемый эффект** — те же метрики, что в AS-IS, с целевыми значениями.

  - id: proc-to-be-pitfall
    level: middle
    question: Какая самая частая ошибка при проектировании TO-BE?
    tags: [to-be]
    answer: |
      **Автоматизировать существующий процесс без изменений:** в TO-BE те же шаги, только вместо «администратор» написано «система». Потери остаются — просто быстрее.

      Правильно — исходить из проблем AS-IS и их причин: убрать ненужные шаги и согласования, изменить триггер, перенести работу ближе к источнику данных, оставить людей только там, где нужно решение.

      Вторая частая ошибка — описать только счастливый путь, без отмен, ошибок и исключений.

  - id: proc-gap-what
    level: junior
    question: Что такое gap-анализ и что он даёт?
    tags: [gap]
    answer: |
      Перечень **разрывов** между AS-IS и TO-BE: что конкретно нужно изменить, чтобы перейти от текущего состояния к целевому.

      Каждый разрыв получает **тип изменения** (система, данные, регламент, организация) и превращается в бизнес-требование, изменение регламента или организационную меру.

      Даёт: полный объём изменений, основу для БТ и плана внедрения, видимость организационных изменений, которые иначе теряются.

  - id: proc-gap-types
    level: middle
    question: Какие типы изменений выявляет gap-анализ? Почему не только системные?
    tags: [gap]
    answer: |
      | Тип | Пример из кейса |
      |---|---|
      | Система | Приём кадровых событий в IdM (GAP-01) |
      | Данные | Ролевая модель и правила назначения (GAP-02) |
      | Регламент | Приказ не позднее чем за 2 рабочих дня (GAP-09) |
      | Организация | Владелец ролевой модели в ИБ (GAP-10) |

      Организационные разрывы часто важнее системных: без своевременных приказов цель «доступы к первому дню» недостижима при любой автоматизации. Аналитик обязан их зафиксировать, даже если они не превращаются в ФТ.

  - id: proc-waste
    level: middle
    question: Как искать потери в процессе?
    tags: [as-is, улучшение]
    answer: |
      Типовые потери (идеи бережливого производства, применительно к офисным процессам):

      - **ожидание** — очереди между исполнителями;
      - **лишние передачи** работы между людьми и системами;
      - **переделки** — возвраты на доработку;
      - **лишняя обработка** — согласования, которые ничего не меняют;
      - **ручной ввод** одних и тех же данных в разные системы;
      - **поиск информации** — «как у коллеги», запросы по почте.

      На BPMN-схеме их видно по длинным цепочкам ручных задач, циклам возврата и передачам между дорожками. В кейсе: 4 последовательные очереди администраторов (P-04) и цикл возврата заявки (P-03).

  - id: proc-to-be-validate
    level: middle
    question: Как проверить, что TO-BE реально решит проблемы?
    tags: [to-be]
    answer: |
      - Сопоставить каждую проблему AS-IS с изменением в TO-BE: нет ли проблем без решения.
      - Прогнать по TO-BE реальные случаи из AS-IS, включая исключения (повторный приём, отмена, поздний приказ).
      - Оценить ожидаемые метрики и их реалистичность.
      - Согласовать с исполнителями: смогут ли они работать по новому процессу.
      - Проверить на пилоте с измеримыми критериями успеха.
