# Глоссарий. Поля: id (латиницей), term, en, definition, topic, seeAlso (id других терминов), notToConfuse,
# match — как термин пишется в текстах (для подсказок на страницах, см. src/plugins/remark-terms.mjs).
# topic — раздел сайта (processes, requirements, integrations…). Список будет расти с каждым разделом.

- id: bpmn
  term: BPMN
  en: Business Process Model and Notation
  definition: Стандарт OMG для графического описания бизнес-процессов. Показывает участников, шаги, развилки, события и обмен сообщениями.
  topic: processes
  seeAlso: [as-is, to-be, token]
  notToConfuse: UML Activity — алгоритм внутри системы, а не бизнес-процесс с участниками.

- id: token
  term: Токен
  en: Token
  definition: Воображаемая метка, которая движется по потокам операций BPMN-схемы и показывает, какой шаг выполняется. AND-шлюз размножает токены и на слиянии ждёт их все.
  topic: processes
  seeAlso: [bpmn]

- id: pool
  term: Пул
  en: Pool
  definition: Графическое представление участника (participant) BPMN — организации или системы со своим процессом. Работа между пулами передаётся только сообщениями.
  topic: processes
  seeAlso: [lane, message-flow]
  notToConfuse: Дорожка — подразделение внутри одного пула.

- id: lane
  term: Дорожка
  en: Lane
  definition: Полоса внутри пула BPMN — роль, подразделение или система, выполняющие часть одного процесса.
  topic: processes
  seeAlso: [pool]

- id: message-flow
  term: Поток сообщений
  en: Message flow
  definition: Пунктирная стрелка BPMN с кружком в начале. Обмен между разными пулами; внутри одного пула не используется.
  topic: processes
  seeAlso: [pool]
  notToConfuse: Поток операций (sequence flow) — порядок шагов внутри пула.
  match: [поток* сообщений]

- id: as-is
  term: AS-IS
  en: As-is
  definition: Описание того, как процесс или система работают сейчас, на самом деле, с проблемами и цифрами.
  topic: processes
  seeAlso: [to-be, gap-analysis]

- id: to-be
  term: TO-BE
  en: To-be
  definition: Целевое состояние процесса или системы после проекта, вместе с бизнес-правилами.
  topic: processes
  seeAlso: [as-is, gap-analysis]

- id: gap-analysis
  term: Gap-анализ
  en: Gap analysis
  definition: Перечень изменений, нужных для перехода от AS-IS к TO-BE, — в системах, данных, регламентах и организации.
  topic: processes
  seeAlso: [as-is, to-be]

- id: system-analyst
  term: Системный аналитик (СА)
  en: System analyst
  definition: Специалист, который определяет, что должна делать система и как она обменивается данными, — так, чтобы разработка и тестирование поняли это однозначно. Артефакты — ФТ, НФТ, use cases, модель данных, статусы, интеграции, контракты.
  topic: role
  seeAlso: [business-analyst, product-owner]
  notToConfuse: Бизнес-аналитик описывает работу бизнеса, а не поведение системы.

- id: business-analyst
  term: Бизнес-аналитик (БА)
  en: Business analyst
  definition: Специалист, который выясняет, что и зачем нужно бизнесу — процессы, цели, проблемы, бизнес-требования (AS-IS, TO-BE, gap-анализ, БТ).
  topic: role
  seeAlso: [system-analyst, as-is, to-be]

- id: product-owner
  term: Владелец продукта
  en: Product Owner (PO)
  definition: Ответственность Scrum за максимизацию ценности продукта и эффективное управление Product Backlog, включая цель продукта и порядок элементов. Не заменяет соблюдение DoD командой.
  topic: role
  seeAlso: [system-analyst]
  notToConfuse: Системный аналитик детализирует требования, но не определяет приоритеты.
  match: [PO]

- id: stakeholder
  term: Стейкхолдер
  en: Stakeholder
  definition: Любой, кто влияет на проект или кого он затрагивает — заказчик, пользователи, владельцы смежных систем, ИБ, аудит.
  topic: role
  seeAlso: [raci]
  match: [стейкхолдер*]

- id: raci
  term: RACI
  en: Responsible, Accountable, Consulted, Informed
  definition: Матрица ответственности «роли × работы» — кто делает (R), кто отвечает и утверждает (A, ровно один в строке), кто консультирует (C), кого информируют (I).
  topic: role
  seeAlso: [stakeholder]
  notToConfuse: RASCI добавляет S (Supportive), DACI предназначена для принятия решений.

- id: artifact
  term: Артефакт
  en: Artifact
  definition: Результат работы на проекте, который можно передать и утвердить — документ, диаграмма, модель, контракт, бэклог.
  topic: role
  seeAlso: [raci]
  match: [артефакт*]

- id: dor
  term: DoR
  en: Definition of Ready
  definition: Договорённость команды о готовности задачи к началу работы — понятная цель, критерии, зависимости и достаточная детализация. Полезная практика, но не обязательный элемент Scrum.
  topic: role
  seeAlso: [dod]

- id: dod
  term: DoD
  en: Definition of Done
  definition: Общее описание качества, которому должен соответствовать инкремент Scrum. Команда конкретизирует проверки, например тесты, ревью и актуализацию документации; статус Done сам по себе соответствие не доказывает.
  topic: role
  seeAlso: [dor]

- id: babok
  term: BABOK
  en: A Guide to the Business Analysis Body of Knowledge
  definition: Свод знаний по бизнес-анализу от IIBA (версия 3). Шесть областей знаний — от планирования бизнес-анализа до оценки решения.
  topic: role
  seeAlso: [business-analyst]

- id: elicitation
  term: Выявление требований
  en: Requirements elicitation
  definition: Активная работа по получению требований от стейкхолдеров, из документов, систем и данных — интервью, воркшопы, наблюдение, анкеты, анализ документов и систем, прототипирование.
  topic: elicitation
  seeAlso: [stakeholder, workshop]
  notToConfuse: «Сбор требований» — пассивная запись того, что сказали; выявление предполагает уточнение и проверку.
  match: [выявлени* требований]

- id: workshop
  term: Воркшоп
  en: Requirements workshop
  definition: Структурированная групповая встреча с фасилитатором и заранее определённым результатом — согласованной схемой, списком требований, приоритетами.
  topic: elicitation
  seeAlso: [elicitation]
  notToConfuse: Совещание — обсуждение без обязательного артефакта на выходе.
  match: [воркшоп*]

- id: mendelow-matrix
  term: Матрица Менделоу
  en: Mendelow's matrix (power/interest grid)
  definition: Матрица «влияние × интерес» для выбора стратегии работы со стейкхолдером — управлять плотно, держать удовлетворёнными, держать в курсе, наблюдать.
  topic: elicitation
  seeAlso: [stakeholder]
  match: [Менделоу]

- id: five-whys
  term: «5 почему»
  en: 5 Whys
  definition: Техника поиска корневой причины — на каждый ответ задаётся вопрос «почему?», пока не найдена причина, которую можно устранить.
  topic: elicitation
  seeAlso: [elicitation]
  match: [~5 почему]

- id: data-profiling
  term: Профилирование данных
  en: Data profiling
  definition: Анализ фактического содержимого данных — объёмы, заполненность полей, уникальность, распределения, аномалии. Выполняется перед миграцией и интеграцией.
  topic: elicitation
  seeAlso: [reconciliation]
  match: [профилировани* данных]

- id: shadowing
  term: Наблюдение
  en: Observation, job shadowing
  definition: Техника выявления, при которой аналитик наблюдает за реальной работой пользователя, — помогает увидеть шаги, которые люди выполняют «на автомате» и не называют на интервью.
  topic: elicitation
  seeAlso: [elicitation]

- id: business-requirement
  term: Бизнес-требование (БТ)
  en: Business requirement
  definition: Что нужно бизнесу и зачем — без описания реализации и упоминания технологий.
  topic: requirements
  seeAlso: [functional-requirement, traceability]

- id: functional-requirement
  term: Функциональное требование (ФТ)
  en: Functional requirement
  definition: Что должна делать система — поведение, атомарное и проверяемое, со ссылкой на БТ.
  topic: requirements
  seeAlso: [non-functional-requirement, business-requirement]

- id: non-functional-requirement
  term: Нефункциональное требование (НФТ)
  en: Non-functional requirement, quality attribute
  definition: Насколько хорошо работает система — производительность, надёжность, безопасность, сопровождаемость. Должно быть измеримым.
  topic: requirements
  seeAlso: [functional-requirement]

- id: business-rule
  term: Бизнес-правило
  en: Business rule
  definition: Правило бизнеса, которое система должна соблюдать («если…, то…»); ведётся отдельно от ФТ, потому что меняется чаще и используется в нескольких местах.
  topic: requirements
  seeAlso: [business-requirement]
  match: [бизнес-правил*]

- id: user-story
  term: Пользовательская история
  en: User story
  definition: Короткое описание ценности с точки зрения пользователя — «Как <роль>, я хочу <действие>, чтобы <ценность>» плюс критерии приёмки.
  topic: requirements
  seeAlso: [invest, acceptance-criteria, epic]
  notToConfuse: Use case — полное описание взаимодействия с альтернативами.
  match: [user stor*, пользовательск* истори*]

- id: invest
  term: INVEST
  en: Independent, Negotiable, Valuable, Estimable, Small, Testable
  definition: Критерии хорошей пользовательской истории — независимая, обсуждаемая, ценная, оцениваемая, небольшая, проверяемая.
  topic: requirements
  seeAlso: [user-story]

- id: epic
  term: Эпик
  en: Epic
  definition: Крупная цель или функциональность, которая режется на несколько историй и занимает несколько спринтов.
  topic: requirements
  seeAlso: [user-story]
  match: [эпик*]

- id: use-case
  term: Вариант использования
  en: Use case
  definition: Описание взаимодействия актора с системой ради значимого для актора результата — основной поток, альтернативы, исключения, пред- и постусловия.
  topic: requirements
  seeAlso: [user-story]
  match: [use case*]

- id: acceptance-criteria
  term: Критерии приёмки
  en: Acceptance criteria
  definition: Условия, при которых требование или история считаются выполненными; пишутся до разработки и проверяются тестом.
  topic: requirements
  seeAlso: [gherkin, user-story]
  match: [критери* приёмки]

- id: gherkin
  term: Gherkin
  en: Gherkin
  definition: Формат описания поведения сценариями «Дано / Когда / Тогда» (Given / When / Then), понятный людям и инструментам автотестов.
  topic: requirements
  seeAlso: [acceptance-criteria]

- id: moscow
  term: MoSCoW
  en: Must, Should, Could, Won't
  definition: Приоритизация по категориям — обязательно, важно, желательно, не в этот раз.
  topic: requirements
  seeAlso: [wsjf, rice]

- id: rice
  term: RICE
  en: Reach, Impact, Confidence, Effort
  definition: Скоринг для приоритизации — (охват × влияние × уверенность) / затраты.
  topic: requirements
  seeAlso: [moscow, wsjf]

- id: wsjf
  term: WSJF
  en: Weighted Shortest Job First
  definition: Приоритизация по стоимости задержки — Cost of Delay / Job Size; применяется в SAFe.
  topic: requirements
  seeAlso: [moscow, rice]

- id: kano
  term: Модель Кано
  en: Kano model
  definition: Классификация функций по влиянию на удовлетворённость — обязательные, одномерные, привлекательные, безразличные, обратные.
  topic: requirements
  seeAlso: [moscow]
  match: [Кано]

- id: traceability
  term: Трассировка требований
  en: Requirements traceability
  definition: Связи между целями, требованиями разных уровней, элементами решения и тестами — для анализа влияния, поиска «сирот» и приёмки.
  topic: requirements
  seeAlso: [impact-analysis, change-request]
  match: [трассировк*]

- id: impact-analysis
  term: Анализ влияния
  en: Impact analysis
  definition: Оценка того, что затронет изменение требования — другие требования, данные, интеграции, тесты, документы, сроки.
  topic: requirements
  seeAlso: [traceability, change-request]
  match: [анализ* влияния, ~impact analysis]

- id: change-request
  term: Запрос на изменение
  en: Change request (CR)
  definition: Формальный запрос на изменение согласованного требования или скоупа с анализом влияния и решением владельца.
  topic: requirements
  seeAlso: [baseline, impact-analysis]
  match: [CR]

- id: baseline
  term: Базовая линия требований
  en: Requirements baseline
  definition: Согласованная и зафиксированная версия набора требований, от которой отсчитываются изменения.
  topic: requirements
  seeAlso: [change-request]
  match: [базов* лини*]

- id: business-process
  term: Бизнес-процесс
  en: Business process
  definition: Последовательность действий участников, которая по событию-триггеру приводит к результату, ценному для клиента или организации.
  topic: processes
  seeAlso: [bpmn, as-is, to-be]
  match: [бизнес-процесс*]

- id: fit-gap
  term: Fit-gap анализ
  en: Fit-gap analysis
  definition: Сравнение требований с возможностями готового продукта; разрывы закрываются настройкой, доработкой, изменением процесса или отказом от требования.
  topic: processes
  seeAlso: [gap-analysis]
  notToConfuse: Gap-анализ сравнивает AS-IS и TO-BE, а не требования и продукт.
  match: [~fit-gap]

- id: process-waste
  term: Потери в процессе
  en: Waste (muda)
  definition: Действия, не добавляющие ценности — ожидание, лишние передачи, переделки, лишние согласования, ручной ввод, поиск информации. Понятие из бережливого производства.
  topic: processes
  seeAlso: [as-is]

- id: uml
  term: UML
  en: Unified Modeling Language
  definition: Унифицированный язык моделирования OMG; версия 2.5 определяет 14 диаграмм — 7 структурных и 7 поведенческих.
  topic: diagrams
  seeAlso: [c4, bpmn]

- id: sequence-diagram
  term: Диаграмма последовательности
  en: Sequence diagram
  definition: UML-диаграмма порядка сообщений между участниками во времени в одном сценарии, включая ответы и ошибки. Главный инструмент проектирования интеграций.
  topic: diagrams
  seeAlso: [uml]
  match: [sequence-диаграмм*, диаграмм* последовательности]

- id: state-machine
  term: Статусная модель
  en: State machine diagram
  definition: Описание жизненного цикла одного объекта — состояния и переходы «событие [условие] / действие». Каждый переход — тест, каждый запрещённый переход — негативный тест.
  topic: diagrams
  seeAlso: [uml]
  match: [статусн* модел*]

- id: activity-diagram
  term: Диаграмма деятельности
  en: Activity diagram
  definition: UML-диаграмма алгоритма или потока работ — действия, развилки, параллельность, дорожки.
  topic: diagrams
  seeAlso: [bpmn, uml]
  notToConfuse: BPMN описывает бизнес-процесс с участниками и обменом между организациями.
  match: [activity-диаграмм*, диаграмм* деятельности]

- id: c4
  term: C4
  en: C4 model (Context, Container, Component, Code)
  definition: Модель архитектурных диаграмм на четырёх уровнях приближения — контекст, контейнеры, компоненты, код. Автор — Simon Brown.
  topic: diagrams
  seeAlso: [uml]
  notToConfuse: Контейнер C4 — любая разворачиваемая часть системы, а не Docker-контейнер.

- id: dfd
  term: DFD
  en: Data Flow Diagram
  definition: Диаграмма потоков данных — внешние сущности, процессы, хранилища и потоки. Применяется для анализа потоков данных и моделирования угроз.
  topic: diagrams
  seeAlso: [c4]

- id: actor
  term: Актор
  en: Actor
  definition: Роль внешнего участника, взаимодействующего с системой, — человек, другая система или время (таймер).
  topic: diagrams
  seeAlso: [use-case]
  match: [актор*]

- id: trust-boundary
  term: Граница доверия
  en: Trust boundary
  definition: Граница между зонами с разным уровнем доверия (сеть, организация, контур безопасности); потоки данных через неё требуют защиты и анализа угроз.
  topic: diagrams
  seeAlso: [dfd, threat-modeling]
  match: [границ* доверия]

- id: primary-key
  term: Первичный ключ
  en: Primary key (PK)
  definition: Столбец или набор столбцов, однозначно идентифицирующий строку таблицы; не NULL, один на таблицу.
  topic: data
  seeAlso: [foreign-key, surrogate-key]
  match: [PK]

- id: foreign-key
  term: Внешний ключ
  en: Foreign key (FK)
  definition: Столбец, ссылающийся на первичный ключ другой таблицы; обеспечивает ссылочную целостность.
  topic: data
  seeAlso: [primary-key]
  match: [FK]

- id: surrogate-key
  term: Суррогатный ключ
  en: Surrogate key
  definition: Технический ключ без бизнес-смысла (uuid, последовательность); не меняется. Обычно сочетается с уникальным натуральным ключом.
  topic: data
  seeAlso: [natural-key, primary-key]
  match: [суррогатн* ключ*]

- id: natural-key
  term: Натуральный ключ
  en: Natural key, business key
  definition: Ключ из предметной области — табельный номер, ИНН, идентификатор из системы-источника. По нему объект узнают в других системах.
  topic: data
  seeAlso: [surrogate-key]
  match: [натуральн* ключ*]

- id: normalization
  term: Нормализация
  en: Normalization
  definition: Приведение модели данных к нормальным формам (1НФ, 2НФ, 3НФ…) для устранения дублирования и аномалий изменения.
  topic: data
  seeAlso: [primary-key]
  match: [нормализаци*]

- id: cardinality
  term: Кардинальность
  en: Cardinality
  definition: Сколько экземпляров одной сущности может быть связано с экземпляром другой — ноль, один, много; записывается с обеих сторон связи.
  topic: data
  seeAlso: [normalization]
  match: [кардинальност*]

- id: join
  term: Соединение таблиц
  en: JOIN
  definition: Операция SQL, объединяющая строки таблиц по условию — INNER (только пары), LEFT, RIGHT, FULL, CROSS.
  topic: data
  seeAlso: [window-function]
  match: [JOIN]

- id: window-function
  term: Оконная функция
  en: Window function
  definition: Функция SQL, вычисляющая значение по группе связанных строк (окну) без их схлопывания — ROW_NUMBER, RANK, LAG, агрегаты с OVER.
  topic: data
  seeAlso: [join]
  match: [оконн* функци*]

- id: acid
  term: ACID
  en: Atomicity, Consistency, Isolation, Durability
  definition: Свойства транзакции — атомарность, согласованность, изоляция, долговечность.
  topic: data
  seeAlso: [isolation-level]

- id: isolation-level
  term: Уровень изоляции
  en: Isolation level
  definition: Насколько транзакция видит изменения параллельных транзакций — Read Uncommitted, Read Committed, Repeatable Read, Serializable.
  topic: data
  seeAlso: [acid]
  match: [уров* изоляции]

- id: index
  term: Индекс
  en: Index
  definition: Структура данных (чаще B-дерево) для быстрого поиска строк по значению столбцов; ускоряет чтение, замедляет запись.
  topic: data
  seeAlso: [primary-key]
  match: [индекс*]

- id: reference-data
  term: НСИ
  en: Reference data, master data
  definition: Нормативно-справочная информация — справочники и классификаторы, общие для многих систем; требует мастер-системы, владельца и правил доставки изменений.
  topic: data
  seeAlso: [mdm]

- id: mdm
  term: MDM
  en: Master Data Management
  definition: Управление основными данными так, чтобы во всех системах была согласованная версия; включает правила формирования золотой записи.
  topic: data
  seeAlso: [reference-data]

- id: reconciliation
  term: Сверка
  en: Reconciliation
  definition: Сравнение данных двух систем для поиска и исправления расхождений; в кейсе — ежедневная сверка IdM с HRMS (UC-10).
  topic: data
  seeAlso: [reference-data]
  match: [сверк*]

- id: idempotency
  term: Идемпотентность
  en: Idempotency
  definition: Свойство операции давать тот же результат при повторном вызове, что и при первом. Делает повторы безопасными; для POST обеспечивается ключом идемпотентности.
  topic: integrations
  seeAlso: [at-least-once, dlq]
  match: [идемпотентн*]

- id: at-least-once
  term: At-least-once
  en: At-least-once delivery
  definition: Гарантия доставки «не менее одного раза» — сообщение не потеряется, но может прийти повторно; требует идемпотентной обработки.
  topic: integrations
  seeAlso: [idempotency, exactly-once]

- id: exactly-once
  term: Exactly-once
  en: Exactly-once
  definition: Доставка и обработка ровно один раз; между разными системами на практике достигается как at-least-once плюс идемпотентная обработка.
  topic: integrations
  seeAlso: [at-least-once]

- id: dlq
  term: DLQ
  en: Dead Letter Queue
  definition: Очередь или топик для сообщений, которые не удалось обработать; нужен владелец, алерт и процедура разбора.
  topic: integrations
  seeAlso: [at-least-once]

- id: outbox
  term: Transactional outbox
  en: Transactional outbox
  definition: Паттерн — событие записывается в таблицу outbox в той же транзакции, что и изменение данных, а затем публикуется в брокер; решает проблему двойной записи.
  topic: integrations
  seeAlso: [saga, idempotency]
  match: [~outbox]

- id: saga
  term: Сага
  en: Saga
  definition: Длинная бизнес-операция из локальных транзакций в разных сервисах с компенсирующими действиями при ошибке; хореография или оркестрация.
  topic: integrations
  seeAlso: [outbox]
  match: [сага, саги, сагу, сагой]

- id: circuit-breaker
  term: Circuit breaker
  en: Circuit breaker
  definition: «Автоматический выключатель» вызовов зависимого сервиса — после серии ошибок вызовы сразу отклоняются, через время пропускается пробный вызов.
  topic: integrations
  seeAlso: [saga]
  match: [~circuit breaker]

- id: webhook
  term: Webhook
  en: Webhook
  definition: Обратный HTTP-вызов — внешняя система сама сообщает о событии, вызывая заранее зарегистрированный адрес.
  topic: integrations
  seeAlso: [idempotency]

- id: rest
  term: REST
  en: Representational State Transfer
  definition: Архитектурный стиль HTTP API — ресурсы с адресами, стандартные методы и коды ответов, отсутствие состояния на сервере между запросами.
  topic: integrations
  seeAlso: [openapi]

- id: openapi
  term: OpenAPI
  en: OpenAPI Specification
  definition: Формат описания HTTP API в YAML или JSON — пути, методы, параметры, тела, ответы, схемы данных, безопасность.
  topic: integrations
  seeAlso: [asyncapi, rest]

- id: asyncapi
  term: AsyncAPI
  en: AsyncAPI Specification
  definition: Формат описания асинхронного обмена — серверы (брокеры), каналы, операции отправки и получения, сообщения и их схемы.
  topic: integrations
  seeAlso: [openapi]

- id: json-schema
  term: JSON Schema
  en: JSON Schema
  definition: Язык описания структуры JSON — типы, обязательность, ограничения, условия; используется в OpenAPI 3.1 и AsyncAPI.
  topic: integrations
  seeAlso: [openapi]
  match: [JSON Schema]

- id: problem-details
  term: Problem Details
  en: Problem Details for HTTP APIs (RFC 9457)
  definition: Стандартный формат ошибок HTTP API (application/problem+json) с полями type, title, status, detail, instance; RFC 9457 заменил RFC 7807.
  topic: integrations
  seeAlso: [rest]
  match: [Problem Details]

- id: kafka
  term: Kafka
  en: Apache Kafka
  definition: Распределённый журнал событий — топики с партициями, хранение по сроку, чтение по смещению, группы потребителей; порядок гарантирован внутри партиции.
  topic: integrations
  seeAlso: [at-least-once, dlq]

- id: oauth2
  term: OAuth 2.0
  en: OAuth 2.0 (RFC 6749)
  definition: Протокол делегированной авторизации — клиент получает токен доступа к API у сервера авторизации, не зная пароля пользователя.
  topic: security
  seeAlso: [oidc, jwt]
  notToConfuse: OpenID Connect — аутентификация пользователя поверх OAuth 2.0.
  match: [OAuth]

- id: oidc
  term: OpenID Connect
  en: OpenID Connect (OIDC)
  definition: Слой аутентификации поверх OAuth 2.0 — добавляет ID-токен с данными о пользователе, userinfo и discovery.
  topic: security
  seeAlso: [oauth2, jwt]
  match: [OIDC]

- id: jwt
  term: JWT
  en: JSON Web Token (RFC 7519)
  definition: Компактный токен из заголовка, полезной нагрузки (claims) и подписи; обычно подписан, но не зашифрован.
  topic: security
  seeAlso: [oauth2]

- id: mtls
  term: mTLS
  en: Mutual TLS
  definition: Взаимный TLS — сертификат предъявляет не только сервер, но и клиент; используется для аутентификации систем в интеграциях.
  topic: security
  seeAlso: [oauth2]

- id: sso
  term: SSO
  en: Single Sign-On
  definition: Единый вход — пользователь аутентифицируется один раз и работает с несколькими системами; технологии — Kerberos, SAML 2.0, OpenID Connect.
  topic: security
  seeAlso: [kerberos, oidc]

- id: kerberos
  term: Kerberos
  en: Kerberos
  definition: Протокол аутентификации по билетам (TGT и сервисные билеты от KDC); основа единого входа в домене Active Directory.
  topic: security
  seeAlso: [sso]

- id: microservices
  term: Микросервисы
  en: Microservices
  definition: Архитектура из независимо разворачиваемых сервисов вокруг бизнес-возможностей, каждый со своими данными.
  topic: architecture
  seeAlso: [modular-monolith, saga]
  match: [микросервис*]

- id: modular-monolith
  term: Модульный монолит
  en: Modular monolith
  definition: Одно разворачиваемое приложение с чёткими границами модулей, каждый из которых владеет своими данными; частый разумный старт вместо микросервисов.
  topic: architecture
  seeAlso: [microservices]
  match: [модульн* монолит*]

- id: iso-25010
  term: ISO/IEC 25010
  en: Systems and software quality model
  definition: Стандарт модели качества продукта; характеристики (производительность, надёжность, защищённость, сопровождаемость и др.) используют как чек-лист НФТ.
  topic: architecture
  seeAlso: [non-functional-requirement]
  match: [ISO/IEC 25010]

- id: availability
  term: Доступность
  en: Availability
  definition: Доля времени, когда система работает; задаётся в процентах («девятках») с указанием периода и того, что считается недоступностью.
  topic: architecture
  seeAlso: [rto, rpo]
  match: [доступност*]

- id: rto
  term: RTO
  en: Recovery Time Objective
  definition: Допустимое время восстановления системы после сбоя.
  topic: architecture
  seeAlso: [rpo, availability]

- id: rpo
  term: RPO
  en: Recovery Point Objective
  definition: Допустимая потеря данных при сбое, измеряемая временем — данные не старше N минут до сбоя.
  topic: architecture
  seeAlso: [rto]

- id: sla
  term: SLA, SLO, SLI
  en: Service Level Agreement / Objective / Indicator
  definition: Соглашение об уровне сервиса / целевое значение показателя / сам измеряемый показатель (например, доля успешных запросов).
  topic: architecture
  seeAlso: [availability]

- id: cache
  term: Кэш
  en: Cache
  definition: Копия данных ближе к потребителю для ускорения ответа и разгрузки источника; ключевое требование — допустимое устаревание данных.
  topic: architecture
  seeAlso: [ttl]
  match: [кэш*]

- id: ttl
  term: TTL
  en: Time to live
  definition: Время жизни записи в кэше или сообщения, после которого оно считается устаревшим.
  topic: architecture
  seeAlso: [cache]

- id: cap
  term: Теорема CAP
  en: CAP theorem
  definition: При разделении сети распределённая система не может быть одновременно согласованной и доступной — приходится выбирать поведение.
  topic: architecture
  seeAlso: [eventual-consistency]
  match: [CAP]

- id: eventual-consistency
  term: Согласованность в конечном счёте
  en: Eventual consistency
  definition: Данные в разных узлах или системах могут временно различаться, но при отсутствии новых изменений придут к одному состоянию.
  topic: architecture
  seeAlso: [cap, reconciliation]
  match: [~eventual consistency, согласованност* в конечном счёте]

- id: adr
  term: ADR
  en: Architecture Decision Record
  definition: Запись об одном архитектурном решении — статус, контекст, варианты, решение, последствия.
  topic: architecture
  seeAlso: [non-functional-requirement]

- id: tz
  term: Техническое задание (ТЗ)
  en: Technical specification, statement of work
  definition: Документ с целями, требованиями к системе, составом работ и порядком приёмки; для автоматизированных систем — по ГОСТ 34.602, часто часть договора.
  topic: documentation
  seeAlso: [gost-34]

- id: gost-34
  term: ГОСТ 34
  en: GOST 34 series
  definition: Комплекс стандартов на автоматизированные системы — стадии создания, виды документов и требования к их содержанию, в том числе к ТЗ (ГОСТ 34.602).
  topic: documentation
  seeAlso: [tz]
  match: [ГОСТ 34]

- id: docs-as-code
  term: Docs-as-code
  en: Docs as code
  definition: Подход, при котором документацию ведут как код — текст в Markdown в git, ревью через pull request, диаграммы текстом, автоматические проверки и сборка.
  topic: documentation
  seeAlso: [tz]

- id: confluence-page-properties
  term: Свойства страницы
  en: Page Properties (Confluence)
  definition: Макрос Confluence для структурированной шапки документа (статус, владелец, версия); отчёт по свойствам собирает реестр документов.
  topic: documentation
  seeAlso: [docs-as-code]

- id: waterfall
  term: Каскадная модель
  en: Waterfall
  definition: Подход с последовательными этапами (требования, проектирование, разработка, тестирование, внедрение), каждый завершается утверждённым результатом.
  topic: methodologies
  seeAlso: [scrum, v-model]
  match: [~waterfall, каскадн* модел*]

- id: v-model
  term: V-модель
  en: V-model
  definition: Вариант каскадной модели, где каждому уровню требований и проектирования соответствует свой уровень тестирования.
  topic: methodologies
  seeAlso: [waterfall]

- id: agile
  term: Agile
  en: Agile
  definition: Ценности и принципы адаптивной разработки из Agile-манифеста — ранняя поставка пользы, обратная связь и изменение решений по фактам. Не задаёт конкретных ролей, встреч и артефактов.
  topic: methodologies
  seeAlso: [scrum, kanban]

- id: scrum
  term: Scrum
  en: Scrum
  definition: Фреймворк разработки спринтами до месяца с ответственностями Product Owner, Scrum Master, Developers, пятью событиями и тремя артефактами.
  topic: methodologies
  seeAlso: [agile, sprint, dod]

- id: sprint
  term: Спринт
  en: Sprint
  definition: Итерация Scrum фиксированной длины (до месяца), в течение которой команда создаёт инкремент для достижения цели спринта.
  topic: methodologies
  seeAlso: [scrum]
  match: [спринт*]

- id: refinement
  term: Рефайнмент
  en: Backlog refinement
  definition: Постоянная работа по уточнению, декомпозиции и оценке элементов бэклога, чтобы они были готовы к взятию в спринт.
  topic: methodologies
  seeAlso: [dor, scrum]
  match: [рефайнмент*, груминг*, ~refinement, ~grooming]

- id: product-backlog
  term: Бэклог продукта
  en: Product Backlog
  definition: Развивающийся упорядоченный список необходимой работы над продуктом. В Scrum за эффективное управление им отвечает Product Owner; обязательство артефакта — Product Goal.
  topic: methodologies
  seeAlso: [product-owner, sprint-backlog, refinement]
  match: ['бэклог* продукт*', '~Product Backlog']

- id: sprint-backlog
  term: Бэклог спринта
  en: Sprint Backlog
  definition: Цель спринта, выбранные элементы Product Backlog и план их реализации. Developers создают и адаптируют этот план в течение спринта.
  topic: methodologies
  seeAlso: [sprint, product-backlog]
  match: ['бэклог* спринт*', '~Sprint Backlog']

- id: increment
  term: Инкремент
  en: Increment
  definition: Проверенное, пригодное к использованию дополнение продукта, соответствующее Definition of Done и совместимое с предыдущими инкрементами. В одном спринте их может быть несколько.
  topic: methodologies
  seeAlso: [scrum, dod]
  match: [инкремент*]

- id: scrum-master
  term: Скрам-мастер
  en: Scrum Master
  definition: Ответственность за установление Scrum и эффективность Scrum-команды; помогает самоорганизации, улучшению работы и устранению препятствий.
  topic: methodologies
  seeAlso: [scrum, product-owner]
  match: ['~Scrum Master', скрам-мастер*]

- id: ticket
  term: Тикет
  en: Ticket
  definition: Запись о единице работы в трекере — цель, описание, критерии, состояние, ответственный и связи. Типы и поля определяет настройка инструмента и договорённости команды.
  topic: methodologies
  seeAlso: [product-backlog, kanban]
  match: [тикет*]

- id: definition-of-workflow
  term: Определение рабочего процесса
  en: Definition of Workflow (DoW)
  definition: Явная договорённость Kanban о единицах работы, начале и завершении, состояниях, контроле WIP, правилах движения и SLE.
  topic: methodologies
  seeAlso: [kanban, wip, sle]
  match: [DoW]

- id: sle
  term: Ожидаемый уровень обслуживания
  en: Service Level Expectation (SLE)
  definition: Прогноз времени прохождения работы с указанной вероятностью, основанный на истории времени цикла или явно отмеченной предварительной оценке. Не является безусловной гарантией срока.
  topic: methodologies
  seeAlso: [kanban, definition-of-workflow]
  match: [SLE]

- id: kanban
  term: Kanban
  en: Kanban method
  definition: Метод управления потоком работы — визуализация, ограничение незавершённой работы (WIP), явные правила и постоянное улучшение.
  topic: methodologies
  seeAlso: [wip, agile]

- id: wip
  term: WIP
  en: Work in progress
  definition: Незавершённая работа — число задач, находящихся в работе; в Kanban ограничивается лимитами, чтобы ускорить поток.
  topic: methodologies
  seeAlso: [kanban]

- id: safe
  term: SAFe
  en: Scaled Agile Framework
  definition: Фреймворк масштабирования Agile на много команд — поезд команд (ART), планирование инкремента программы (PI Planning), приоритизация WSJF.
  topic: methodologies
  seeAlso: [scrum, wsjf]

- id: test-levels
  term: Уровни тестирования
  en: Test levels
  definition: Модульное, интеграционное, системное и приёмочное тестирование — от отдельных функций до проверки, что система решает задачу заказчика.
  topic: testing
  seeAlso: [uat, regression]
  match: [уровн* тестирования]

- id: regression
  term: Регрессионное тестирование
  en: Regression testing
  definition: Проверка, что изменения не сломали работавшую функциональность.
  topic: testing
  seeAlso: [smoke-test]
  match: [регрессионн*]

- id: smoke-test
  term: Дымовое тестирование
  en: Smoke testing
  definition: Быстрая проверка ключевых функций после сборки, чтобы решить, имеет ли смысл тестировать дальше.
  topic: testing
  seeAlso: [regression]
  match: [~smoke, дымов* тест*]

- id: equivalence-partitioning
  term: Классы эквивалентности
  en: Equivalence partitioning
  definition: Техника тест-дизайна — входные значения делятся на группы с одинаковым поведением системы; из каждой группы проверяется одно значение.
  topic: testing
  seeAlso: [boundary-value-analysis]
  match: [класс* эквивалентности]

- id: boundary-value-analysis
  term: Анализ граничных значений
  en: Boundary value analysis
  definition: Техника тест-дизайна — проверка значений на границах диапазонов и рядом с ними, где чаще всего ошибки.
  topic: testing
  seeAlso: [equivalence-partitioning]
  match: [граничн* значени*]

- id: decision-table
  term: Таблица решений
  en: Decision table
  definition: Таблица комбинаций условий и соответствующих действий; каждая комбинация (правило) даёт тест и выявляет пропуски в требованиях.
  topic: testing
  seeAlso: [equivalence-partitioning]
  match: [таблиц* решений]

- id: pairwise
  term: Попарное тестирование
  en: Pairwise testing
  definition: Подбор минимального набора тестов, покрывающего все пары значений любых двух параметров, вместо полного перебора комбинаций.
  topic: testing
  match: [~pairwise, попарн* тестировани*]

- id: severity-priority
  term: Серьёзность и приоритет дефекта
  en: Severity, priority
  definition: Серьёзность — насколько дефект влияет на работу системы; приоритет — насколько срочно его исправлять с точки зрения бизнеса.
  topic: testing
  match: [серьёзност* дефект*]

- id: pmi
  term: ПМИ
  en: Test program and methodology
  definition: Программа и методика испытаний — документ, по которому заказчик принимает систему; объём, условия, участники, порядок и критерии успешности испытаний.
  topic: testing
  seeAlso: [uat]

- id: uat
  term: UAT
  en: User acceptance testing
  definition: Приёмочное тестирование пользователями и заказчиком — проверка, что система решает их задачи в реальном процессе.
  topic: testing
  seeAlso: [pmi]

- id: jql
  term: JQL
  en: Jira Query Language
  definition: Язык запросов Jira для поиска задач по полям, статусам и связям; на нём строят фильтры и доски.
  topic: software

- id: diagrams-as-code
  term: Диаграммы как код
  en: Diagrams as code
  definition: Описание диаграмм текстом (PlantUML, Mermaid, Structurizr DSL), который хранится в Git, проходит ревью и рендерится в картинку.
  topic: software
  seeAlso: [docs-as-code]
  match: [диаграмм* как код]

- id: mock-server
  term: Заглушка (mock-сервер)
  en: Mock server, stub
  definition: Программа, которая отвечает вместо настоящей системы по заданным правилам или по контракту; позволяет тестировать интеграцию и сценарии ошибок без провайдера.
  topic: software
  seeAlso: [openapi]
  match: [заглушк*, ~mock]

- id: consumer-lag
  term: Отставание потребителя
  en: Consumer lag
  definition: Разница между последним записанным в партицию сообщением и последним прочитанным группой потребителей; растущий lag означает, что потребитель не успевает.
  topic: software
  seeAlso: [dlq]
  match: [~lag, отставани* потребител*]

- id: star
  term: STAR
  en: Situation, Task, Action, Result
  definition: Схема ответа на поведенческие вопросы собеседования — ситуация, задача, ваши действия, результат.
  topic: interview

# ── Предметная область кейса: управление доступом (IdM) ────────────

- id: idm
  term: IdM
  en: Identity Management
  definition: Система управления идентичностями и доступом — создаёт учётные записи в целевых системах, выдаёт и отзывает полномочия по ролям и заявкам, ведёт журнал аудита и ресертификацию прав.
  topic: idm
  seeAlso: [identity, provisioning, jml]

- id: jml
  term: Joiner / Mover / Leaver
  en: Joiner, Mover, Leaver
  definition: Три базовых кадровых процесса управления доступом — приём, перевод и увольнение сотрудника. В кейсе волна 1 автоматизирует Joiner, Mover и Leaver — волна 2.
  topic: idm
  seeAlso: [idm]
  match: [Joiner, Mover, Leaver]

- id: identity
  term: Идентичность
  en: Identity
  definition: Запись о физическом лице в IdM, объединяющая все его учётные записи; одна на человека, в кейсе ключ — personId из HRMS.
  topic: idm
  seeAlso: [employment, account]
  notToConfuse: Учётная запись — запись пользователя в конкретной системе; у одной идентичности их несколько.
  match: [идентичност*]

- id: employment
  term: Трудоустройство
  en: Employment
  definition: Конкретный трудовой договор сотрудника. У совместителя несколько трудоустройств одновременно, у повторно принятого — несколько во времени.
  topic: idm
  seeAlso: [identity]
  match: [трудоустройств*]

- id: account
  term: Учётная запись
  en: Account
  definition: Запись пользователя в конкретной целевой системе — логин в AD, пользователь АБС.
  topic: idm
  seeAlso: [identity, target-system]
  match: [учётн* запис*]

- id: target-system
  term: Целевая система
  en: Target system, resource
  definition: Система, в которой IdM создаёт учётные записи и выдаёт права; в кейсе — AD, Exchange, АБС, СЭД.
  topic: idm
  notToConfuse: Источник данных (HRMS) — откуда IdM получает сведения о сотрудниках.
  match: [целев* систем*]

- id: entitlement
  term: Полномочие
  en: Entitlement
  definition: Минимальная единица права в целевой системе — группа AD, роль АБС, роль СЭД.
  topic: idm
  seeAlso: [business-role]
  notToConfuse: Бизнес-роль — набор полномочий в разных системах.
  match: [полномочи*]

- id: business-role
  term: Бизнес-роль
  en: Business role
  definition: Набор полномочий в разных системах, нужный для работы на должности; назначается по правилу «тип подразделения + должность» или по заявке.
  topic: idm
  seeAlso: [entitlement, birthright, rbac]
  match: [бизнес-рол*]

- id: birthright
  term: Базовая роль
  en: Birthright role
  definition: Бизнес-роль, которую каждый сотрудник получает без запроса — например, учётная запись AD, почта, доступ к СЭД.
  topic: idm
  seeAlso: [business-role]
  match: [базов* рол*]

- id: rbac
  term: Ролевая модель доступа
  en: Role-based access control, RBAC
  definition: Подход, при котором права выдаются через роли, соответствующие обязанностям, а не каждому пользователю по отдельности.
  topic: idm
  seeAlso: [business-role, sod]
  match: [RBAC]

- id: sod
  term: SoD-конфликт
  en: Segregation of duties
  definition: Сочетание полномочий, которое нельзя выдавать одному сотруднику, например ввод и подтверждение операции. Принцип разделения обязанностей снижает риск мошенничества и ошибок.
  topic: idm
  seeAlso: [rbac]
  match: [SoD, SOD]

- id: provisioning
  term: Провижининг
  en: Provisioning
  definition: Создание учётной записи и выдача полномочий в целевой системе; обратная операция — депровижининг (блокировка, удаление, отзыв прав).
  topic: idm
  seeAlso: [connector, account]
  match: [провижининг*]

- id: connector
  term: Коннектор
  en: Connector
  definition: Компонент IdM, который выполняет провижининг в конкретной целевой системе по её протоколу (LDAP, PowerShell, REST).
  topic: idm
  notToConfuse: Адаптер АБС в кейсе — отдельный сервис на стороне АБС, который вызывает коннектор IdM.
  match: [коннектор*]

- id: recertification
  term: Ресертификация прав
  en: Access recertification, access review
  definition: Периодический пересмотр выданных прав руководителями и владельцами ресурсов — подтвердить нужные, отозвать лишние.
  topic: idm
  seeAlso: [idm]
  match: [ресертификаци*]

- id: orphan-account
  term: Учётная запись-сирота
  en: Orphan account
  definition: Учётная запись в целевой системе, которой не соответствует ни один сотрудник в кадровой системе; кандидат на блокировку или на обоснование (сервисная, тестовая).
  topic: idm
  seeAlso: [reconciliation]
  match: [сирот*]

- id: resource-owner
  term: Владелец ресурса
  en: Resource owner
  definition: Сотрудник, отвечающий за доступ к целевой системе и согласующий выдачу прав в ней.
  topic: idm
  notToConfuse: Администратор ресурса технически исполняет выдачу прав, но не решает, выдавать ли их.
  match: [владел* ресурс*]

- id: hrms
  term: HRMS
  en: Human Resource Management System
  definition: Кадровая система — источник данных о сотрудниках, должностях, подразделениях и приказах; для IdM — авторитетный источник.
  topic: idm
  seeAlso: [identity]

# ── Общие сокращения и понятия ──────────────────────────────────────

- id: ib
  term: Информационная безопасность (ИБ)
  en: Information security
  definition: Защита информации от несанкционированного доступа, изменения и уничтожения. В тексте «ИБ» чаще всего — подразделение информационной безопасности банка, которое согласует доступы и требования к защите.
  topic: general
  seeAlso: [ciso, sod]

- id: ciso
  term: CISO
  en: Chief Information Security Officer
  definition: Директор по информационной безопасности — руководитель, отвечающий за защиту информации в компании; в банке обычно согласует решения, затрагивающие доступы и данные.
  topic: general
  seeAlso: [ib, cio]

- id: cio
  term: CIO
  en: Chief Information Officer
  definition: Директор по информационным технологиям; в кейсе — спонсор проекта.
  topic: general
  seeAlso: [ciso]

- id: it
  term: ИТ
  en: Information technology
  definition: Информационные технологии; в тексте также — ИТ-подразделение компании.
  topic: general

- id: abs
  term: АБС
  en: Core banking system
  definition: "Автоматизированная банковская система — основная учётная система банка: клиенты, счета, операции. В кейсе — целевая система, пользователей которой IdM создаёт через REST-адаптер."
  topic: general
  seeAlso: [target-system]

- id: sed
  term: СЭД
  en: Electronic document management system
  definition: Система электронного документооборота — приказы, договоры, согласования. В кейсе у СЭД нет автоматического подключения, доступ выдаётся через задачу в ServiceDesk.
  topic: general

- id: hr
  term: HR
  en: Human resources
  definition: Управление персоналом и кадровая служба компании; в кейсе — HR-специалисты, которые проводят приказы о приёме в кадровой системе.
  topic: general
  seeAlso: [hrd, hrms]

- id: hrd
  term: HRD
  en: HR director
  definition: Директор по персоналу; в кейсе — бизнес-заказчик проекта.
  topic: general
  seeAlso: [hr]

- id: rp
  term: РП
  en: Project manager
  definition: Руководитель проекта — отвечает за сроки, бюджет, ресурсы и управление рисками проекта.
  topic: general
  seeAlso: [raci]

- id: dit
  term: ДИТ
  en: IT department
  definition: Департамент информационных технологий; в кейсе — подразделение головного офиса, одно из двух подразделений пилота.
  topic: idm

- id: qa
  term: QA
  en: Quality assurance
  definition: Обеспечение качества; в командах так называют специалистов по тестированию.
  topic: testing
  seeAlso: [test-levels]

- id: devops
  term: DevOps
  en: Development and operations
  definition: Практики и роль, объединяющие разработку и эксплуатацию — автоматическая сборка, развёртывание, мониторинг, инфраструктура как код.
  topic: general
  seeAlso: [ci-cd]

- id: ci-cd
  term: CI/CD
  en: Continuous integration / continuous delivery
  definition: Непрерывная интеграция и доставка — каждое изменение кода автоматически собирается, проверяется тестами и готовится к выпуску (или выпускается).
  topic: general
  match: [CI/CD, CI]
  seeAlso: [devops]

- id: api
  term: API
  en: Application programming interface
  definition: Программный интерфейс — набор операций, через которые одна система обращается к другой. Описывается контрактом (OpenAPI, AsyncAPI, WSDL).
  topic: integrations
  seeAlso: [rest, openapi]

- id: ui
  term: UI
  en: User interface
  definition: Пользовательский интерфейс — экраны и элементы, с которыми работает человек.
  topic: general

- id: crud
  term: CRUD
  en: Create, read, update, delete
  definition: Четыре базовые операции над данными — создать, прочитать, изменить, удалить.
  topic: data

- id: db
  term: БД
  en: Database
  definition: База данных — организованное хранилище данных, с которым работает система через СУБД.
  topic: data
  seeAlso: [dbms]

- id: dbms
  term: СУБД
  en: Database management system
  definition: Система управления базами данных — программа, которая хранит данные и выполняет запросы к ним (PostgreSQL, Oracle, MS SQL Server).
  topic: data
  seeAlso: [db, sql]

- id: dba
  term: DBA
  en: Database administrator
  definition: Администратор баз данных — отвечает за работу, производительность и резервное копирование СУБД.
  topic: data

- id: sql
  term: SQL
  en: Structured Query Language
  definition: Язык запросов к реляционным базам данных — выборка, изменение данных, описание таблиц.
  topic: data
  seeAlso: [join]

- id: cte
  term: CTE
  en: Common table expression
  definition: Именованный подзапрос в начале SQL-запроса (конструкция WITH); упрощает чтение сложных запросов.
  topic: data
  seeAlso: [sql]

- id: er
  term: ER-диаграмма
  en: Entity-relationship diagram
  definition: Диаграмма «сущность — связь» — показывает сущности данных, их атрибуты и связи с кардинальностью.
  topic: data
  match: [ER]
  seeAlso: [cardinality]

- id: cdc
  term: CDC
  en: Change data capture
  definition: Захват изменений — изменения в базе данных читаются из её журнала и публикуются как события для других систем.
  topic: integrations
  seeAlso: [outbox]

- id: http
  term: HTTP
  en: Hypertext Transfer Protocol
  definition: "Протокол запросов и ответов, на котором работают веб и REST API: методы (GET, POST…), коды ответов, заголовки. HTTPS — HTTP поверх шифрованного соединения TLS."
  topic: integrations
  match: [HTTP, HTTPS]
  seeAlso: [rest, tls]

- id: tls
  term: TLS
  en: Transport Layer Security
  definition: Протокол шифрования соединения между клиентом и сервером; HTTPS — это HTTP поверх TLS. mTLS — вариант, где сертификат предъявляют обе стороны.
  topic: security
  seeAlso: [mtls, http]

- id: rfc
  term: RFC
  en: Request for Comments
  definition: Серия документов, в которой IETF публикует стандарты интернета — например, HTTP описан в RFC 9110, OAuth 2.0 — в RFC 6749.
  topic: integrations
  seeAlso: [ietf]

- id: ietf
  term: IETF
  en: Internet Engineering Task Force
  definition: Международное сообщество, которое разрабатывает стандарты интернета и публикует их как RFC.
  topic: integrations
  seeAlso: [rfc]

- id: xml
  term: XML
  en: Extensible Markup Language
  definition: Язык разметки для структурированных данных в виде вложенных тегов; основа SOAP, WSDL и XSD.
  topic: integrations
  seeAlso: [soap, xsd]

- id: json
  term: JSON
  en: JavaScript Object Notation
  definition: Текстовый формат данных из объектов, массивов, строк, чисел и логических значений; основной формат REST API и сообщений в брокерах.
  topic: integrations
  seeAlso: [json-schema, yaml]

- id: yaml
  term: YAML
  en: YAML Ain't Markup Language
  definition: Человекочитаемый формат данных, где вложенность задаётся отступами; на нём часто пишут OpenAPI, AsyncAPI и конфигурации.
  topic: integrations
  seeAlso: [json]

- id: soap
  term: SOAP
  en: Simple Object Access Protocol
  definition: Протокол обмена XML-сообщениями (конверт Envelope с заголовком и телом); операции и типы сервиса описываются в WSDL.
  topic: integrations
  seeAlso: [wsdl, xsd, rest]

- id: wsdl
  term: WSDL
  en: Web Services Description Language
  definition: XML-описание SOAP-сервиса — операции, сообщения, адрес; по нему генерируют клиентов и пример запроса.
  topic: integrations
  seeAlso: [soap, xsd]

- id: xsd
  term: XSD
  en: XML Schema Definition
  definition: Язык описания структуры XML-документа — элементы, типы, обязательность; используется для проверки сообщений SOAP.
  topic: integrations
  seeAlso: [soap, wsdl]

- id: grpc
  term: gRPC
  en: gRPC Remote Procedure Calls
  definition: Фреймворк удалённого вызова процедур поверх HTTP/2 с контрактом в Protocol Buffers; быстрый двоичный обмен между сервисами, поддерживает потоковую передачу.
  topic: integrations
  seeAlso: [rest, graphql]

- id: graphql
  term: GraphQL
  en: GraphQL
  definition: Язык запросов к API, в котором клиент сам указывает, какие поля ему нужны; одна точка входа вместо множества REST-ресурсов.
  topic: integrations
  seeAlso: [rest, grpc]

- id: rabbitmq
  term: RabbitMQ
  en: RabbitMQ
  definition: Брокер сообщений с обменниками (exchange), очередями и правилами маршрутизации; сообщение удаляется из очереди после подтверждения получения.
  topic: integrations
  seeAlso: [kafka, dlx]

- id: dlx
  term: DLX
  en: Dead letter exchange
  definition: Обменник RabbitMQ, куда перенаправляются сообщения, которые не удалось обработать или у которых истёк срок; аналог DLQ.
  topic: integrations
  seeAlso: [dlq, rabbitmq]

- id: hmac
  term: HMAC
  en: Hash-based message authentication code
  definition: Код проверки подлинности сообщения на основе хеш-функции и общего секретного ключа; так подписывают webhook, чтобы получатель убедился, кто его отправил.
  topic: integrations
  seeAlso: [webhook]

- id: pkce
  term: PKCE
  en: Proof Key for Code Exchange
  definition: Расширение OAuth 2.0 (RFC 7636), защищающее код авторизации от перехвата; рекомендуется для всех клиентов, особенно мобильных и браузерных.
  topic: integrations
  seeAlso: [oauth2]

- id: saml
  term: SAML
  en: Security Assertion Markup Language
  definition: XML-стандарт обмена данными об аутентификации между поставщиком удостоверений и приложением; распространённый способ SSO в корпоративных системах.
  topic: security
  seeAlso: [sso, oidc]

- id: ldap
  term: LDAP
  en: Lightweight Directory Access Protocol
  definition: Протокол доступа к службам каталогов, например к Active Directory; LDAPS — LDAP поверх TLS.
  topic: integrations
  match: [LDAP, LDAPS]
  seeAlso: [ad]

- id: sasl
  term: SASL
  en: Simple Authentication and Security Layer
  definition: Каркас аутентификации, встраиваемый в сетевые протоколы; например, им проверяют клиентов Kafka.
  topic: integrations
  seeAlso: [kafka]

- id: kdc
  term: KDC
  en: Key Distribution Center
  definition: Центр распределения ключей Kerberos — выдаёт билеты, по которым пользователь входит в сервисы без повторного ввода пароля; в домене Windows эту роль выполняет контроллер домена.
  topic: integrations
  seeAlso: [kerberos, tgt]

- id: tgt
  term: TGT
  en: Ticket-granting ticket
  definition: Билет Kerberos, который пользователь получает при входе; по нему KDC выдаёт билеты к конкретным сервисам.
  topic: integrations
  seeAlso: [kerberos, kdc]

- id: spnego
  term: SPNEGO
  en: Simple and Protected GSSAPI Negotiation Mechanism
  definition: Механизм согласования аутентификации, через который браузер прозрачно передаёт билет Kerberos веб-приложению (заголовок Negotiate).
  topic: integrations
  seeAlso: [kerberos, sso]

- id: ad
  term: Active Directory (AD)
  en: Active Directory
  definition: Служба каталогов Microsoft — учётные записи, группы и политики домена Windows; через неё сотрудники входят в компьютеры и многие корпоративные системы.
  topic: idm
  seeAlso: [ou, ldap]

- id: ou
  term: OU
  en: Organizational unit
  definition: Контейнер в Active Directory для группировки учётных записей и применения политик, например по подразделениям.
  topic: idm
  seeAlso: [ad]

- id: pam
  term: PAM
  en: Privileged access management
  definition: Управление привилегированным доступом — контроль, выдача по запросу и запись сеансов администраторов и сервисных учётных записей.
  topic: idm
  seeAlso: [idm]

- id: siem
  term: SIEM
  en: Security information and event management
  definition: Система сбора и анализа событий безопасности из разных источников; помогает ИБ обнаруживать инциденты. В кейсе получает события журнала аудита IdM.
  topic: general
  seeAlso: [ib]

- id: pdn
  term: ПДн
  en: Personal data
  definition: Персональные данные — любая информация, относящаяся к прямо или косвенно определённому физическому лицу; их обработку в России регулирует 152-ФЗ «О персональных данных».
  topic: general
  seeAlso: [ib]

- id: dr
  term: DR
  en: Disaster recovery
  definition: Восстановление после аварии — план и средства для возобновления работы системы после серьёзного сбоя; «учения DR» проверяют, что RTO и RPO достижимы.
  topic: architecture
  seeAlso: [rto, rpo]

- id: mtbf-mttr
  term: MTBF и MTTR
  en: Mean time between failures, mean time to repair
  definition: Среднее время между отказами и среднее время восстановления; доступность = MTBF / (MTBF + MTTR).
  topic: architecture
  match: [MTBF, MTTR]
  seeAlso: [availability]

- id: lru
  term: LRU
  en: Least recently used
  definition: Политика вытеснения из кэша — при нехватке места удаляется элемент, к которому дольше всего не обращались.
  topic: architecture
  seeAlso: [cache, ttl]

- id: pacelc
  term: PACELC
  en: PACELC
  definition: Расширение теоремы CAP — при разделении сети (P) выбирают между доступностью и согласованностью (A или C), а в обычной работе (E) — между задержкой и согласованностью (L или C).
  topic: architecture
  seeAlso: [cap]

- id: utc
  term: UTC
  en: Coordinated Universal Time
  definition: Всемирное координированное время — точка отсчёта часовых поясов; московское время (МСК) — UTC+3.
  topic: general
  match: [UTC, МСК]

- id: saas
  term: SaaS
  en: Software as a service
  definition: Программное обеспечение как услуга — приложение работает в облаке поставщика, клиент пользуется им через браузер по подписке.
  topic: software

- id: ide
  term: IDE
  en: Integrated development environment
  definition: Интегрированная среда разработки — редактор кода с отладкой, подсказками и сборкой (IntelliJ IDEA, VS Code).
  topic: software

- id: vm
  term: ВМ
  en: Virtual machine
  definition: Виртуальная машина — программно эмулируемый компьютер со своей операционной системой на общем физическом сервере.
  topic: architecture

- id: crm
  term: CRM
  en: Customer relationship management
  definition: Система управления взаимоотношениями с клиентами — карточки клиентов, сделки, обращения.
  topic: general

- id: kpi
  term: KPI
  en: Key performance indicator
  definition: Ключевой показатель эффективности — измеримая метрика, по которой оценивают результат работы или процесса.
  topic: general

- id: mvp
  term: MVP
  en: Minimum viable product
  definition: Минимально жизнеспособный продукт — первая версия с минимумом функций, достаточным, чтобы проверить ценность на реальных пользователях.
  topic: methodologies

- id: rpa
  term: RPA
  en: Robotic process automation
  definition: Роботизированная автоматизация процессов — программа-робот выполняет действия пользователя в интерфейсе другой системы; хрупка при изменениях интерфейса.
  topic: integrations

- id: as
  term: АС
  en: Automated system
  definition: Автоматизированная система — термин стандартов ГОСТ 34 для системы, состоящей из персонала и комплекса средств автоматизации его деятельности.
  topic: documentation
  seeAlso: [gost-34, tz]

- id: cod
  term: CoD
  en: Cost of Delay
  definition: Стоимость задержки — сколько ценности теряется, пока работа не сделана; в WSJF складывается из ценности для бизнеса, критичности по времени и снижения риска.
  topic: requirements
  seeAlso: [wsjf]

- id: cfd
  term: CFD
  en: Cumulative flow diagram
  definition: Накопительная диаграмма потока в Kanban — сколько задач находится в каждом статусе по дням; показывает узкие места и рост незавершённой работы.
  topic: methodologies
  seeAlso: [kanban, wip]

- id: pi
  term: PI
  en: Program increment
  definition: Инкремент программы в SAFe — период из нескольких спринтов, который планируют совместно все команды поезда на сессии PI Planning.
  topic: methodologies
  seeAlso: [safe]

- id: rasci-daci
  term: RASCI и DACI
  en: RASCI, DACI
  definition: Варианты RACI. RASCI добавляет S (Support) — тех, кто помогает исполнителю. DACI применяют для решений — Driver (ведёт), Approver (утверждает), Contributors (дают вклад), Informed (информируются).
  topic: role
  match: [RASCI, DACI]
  seeAlso: [raci]

- id: dmn
  term: DMN
  en: Decision Model and Notation
  definition: Нотация OMG для описания бизнес-решений, прежде всего таблиц решений; дополняет BPMN.
  topic: processes
  seeAlso: [bpmn, decision-table]

- id: bpmn-gateway
  term: Шлюз BPMN
  en: Gateway
  definition: Ромб на BPMN-схеме, где поток ветвится или сходится. Исключающий (XOR) — ровно одна ветка; параллельный (AND) — все ветки; включающий (OR) — одна или несколько.
  topic: processes
  match: [XOR]
  seeAlso: [bpmn, token]

- id: plantuml
  term: PlantUML
  en: PlantUML
  definition: Инструмент «диаграммы как код» — UML, C4 и другие диаграммы описываются текстом и отрисовываются в картинку; работает на Java.
  topic: software
  seeAlso: [mermaid, diagrams-as-code]

- id: mermaid
  term: Mermaid
  en: Mermaid
  definition: Библиотека «диаграммы как код» на JavaScript — flowchart, sequence, state, ER и другие диаграммы из текста; отображается в GitLab, GitHub и многих вики.
  topic: software
  seeAlso: [plantuml, diagrams-as-code]

- id: case-ids
  term: Идентификаторы артефактов кейса
  en: Artifact IDs
  definition: "Префиксы ID в кейсе IDM-JOINER: BR — бизнес-требование, BRL — бизнес-правило, FR — функциональное требование, NFR — нефункциональное требование, UC — вариант использования, US — пользовательская история, EPIC — эпик, TC — тест-кейс, INT — интеграция, SEQ — sequence-диаграмма, SEC — требование ИБ, ADR — архитектурное решение, ALR — алерт, RB — процедура runbook, INC — инцидент, PRB — проблема, CHG — запрос на изменение. По ID артефакты связываются в матрице трассировки."
  topic: idm
  match: ['/(?:BRL|BR|FR|NFR|UC|US|EPIC|TC|INT|SEQ|SEC|ALR|RB|INC|PRB|CHG)-\d+/']
  seeAlso: [traceability]

# ── Вход в проект ───────────────────────────────────────────────────

- id: greenfield
  term: Greenfield и brownfield
  en: Greenfield, brownfield
  definition: Greenfield — проект «с чистого листа», где решения ещё нет. Brownfield — развитие или замена уже работающей системы, где новое строится с учётом существующих данных, интеграций и ограничений.
  topic: onboarding
  match: ['~greenfield', '~brownfield']
  seeAlso: [legacy]

- id: legacy
  term: Legacy-система
  en: Legacy system
  definition: Давно работающая и важная для бизнеса система, которую трудно менять — устаревшие технологии, неполная документация, ушедшие авторы.
  topic: onboarding
  match: ['~legacy']
  seeAlso: [reverse-engineering, greenfield]

- id: reverse-engineering
  term: Обратное проектирование
  en: Reverse engineering
  definition: Восстановление того, как система работает на самом деле, по её интерфейсу, API, данным, логам, интеграциям, коду и рассказам пользователей — когда документации нет или ей нельзя верить.
  topic: onboarding
  match: ['обратн* проектировани*', '~reverse engineering']
  seeAlso: [legacy]

- id: source-of-truth
  term: Источник истины
  en: Source of truth
  definition: Место, которому команда договорилась верить, — например, конкретное пространство вики с требованиями или репозиторий с контрактами; остальные копии считаются вторичными.
  topic: onboarding
  match: ['источник* истины', '~source of truth']

- id: project-state-assessment
  term: Оценка состояния проекта
  en: Project State Assessment
  definition: Сводка для входа в идущий проект — что реализовано, что в работе, что согласовано, но не начато, что изменилось, какие решения открыты, зависимости и расхождения документации с системой.
  topic: onboarding
  match: ['~Project State Assessment', 'оценк* состояния проекта']
  seeAlso: [traceability]

- id: cutover
  term: Переключение и откат
  en: Cutover, rollback
  definition: Переключение (cutover) — момент перевода работы со старой системы на новую. Откат (rollback) — возврат на старую систему по заранее оговорённым критериям, если после переключения что-то пошло не так.
  topic: onboarding
  match: ['~cutover', '~rollback']
  seeAlso: [parallel-run]

- id: parallel-run
  term: Параллельная эксплуатация
  en: Parallel run
  definition: Период, когда старая и новая системы работают одновременно, а их результаты сверяются; снижает риск замены ценой двойной работы.
  topic: onboarding
  match: ['параллельн* эксплуатаци*']
  seeAlso: [cutover, reconciliation]

- id: strangler-fig
  term: Постепенное вытеснение
  en: Strangler fig
  definition: Стратегия замены большой системы по частям — функции одна за другой переносятся в новую систему, запросы к ним перенаправляются, пока старая не станет ненужной.
  topic: onboarding
  match: ['~strangler fig', 'постепенн* вытеснени*']
  seeAlso: [cutover]

# ── Доработка существующей системы ──────────────────────────────────

- id: backward-compatibility
  term: Обратная совместимость
  en: Backward compatibility
  definition: Свойство изменения, при котором существующие клиенты API, потребители событий и пользователи продолжают работать без доработок. Новое необязательное поле обычно совместимо, удаление поля или новое значение enum в ответе — часто нет.
  topic: integrations
  match: ['обратн* совместимост*', '~backward compatibility']
  seeAlso: [tolerant-reader, impact-analysis]

- id: tolerant-reader
  term: Tolerant reader
  en: Tolerant reader
  definition: Принцип для потребителя API или событий — читать только нужные поля и спокойно пропускать незнакомые поля и значения, чтобы изменения провайдера не ломали клиента.
  topic: integrations
  match: ['~tolerant reader']
  seeAlso: [backward-compatibility]

- id: prod-verification
  term: Проверка на продуктиве
  en: Production verification
  definition: Подтверждение после релиза, что доработка решает задачу на реальных данных — новая функция используется, метрики и ошибки в норме, смежные системы получают ожидаемое. В отличие от smoke-проверки может длиться дни.
  topic: role
  match: ['проверк* на продуктиве', '~production verification']
  seeAlso: [smoke-test, regression]

# ── Эксплуатация ────────────────────────────────────────────────────

- id: incident
  term: Инцидент
  en: Incident
  definition: Незапланированное прерывание или ухудшение работы системы. Цель работы с инцидентом — как можно быстрее восстановить работу для пострадавших, в том числе обходным путём.
  topic: operations
  match: ['инцидент*']
  seeAlso: [problem, support-lines]
  notToConfuse: Проблема — причина инцидентов; её ищут и устраняют отдельно.

- id: problem
  term: Проблема (в эксплуатации)
  en: Problem
  definition: Причина одного или нескольких инцидентов. Работа с проблемой — найти корневую причину и устранить её, чтобы инцидент не повторился.
  topic: operations
  seeAlso: [incident, rca]

- id: rca
  term: Анализ корневых причин (RCA)
  en: Root cause analysis
  definition: Разбор проблемы — хронология, «5 почему», несколько причин разных типов (процесс, требования, проектирование, мониторинг, тесты), исправляющие и предупреждающие действия с владельцами.
  topic: operations
  match: ['корнев* причин*']
  seeAlso: [problem, five-whys, postmortem]

- id: postmortem
  term: Разбор без поиска виноватых
  en: Blameless postmortem
  definition: Формат разбора серьёзного сбоя, в котором ищут слабые места системы и процесса, а не виноватого человека, — так участники честно рассказывают, что произошло.
  topic: operations
  match: ['~postmortem', '~blameless']
  seeAlso: [rca]

- id: support-lines
  term: Линии поддержки (L1, L2, L3)
  en: Support tiers
  definition: Уровни сопровождения — L1 принимает обращения и решает типовое, L2 диагностирует по процедурам и восстанавливает работу, L3 исправляет код, конфигурацию и контракты.
  topic: operations
  match: ['лини* поддержки']
  seeAlso: [incident, runbook]

- id: runbook
  term: Runbook
  en: Runbook
  definition: Инструкция сопровождения для типовой ситуации — признаки, что проверить, какие действия выполнить и когда эскалировать.
  topic: operations
  seeAlso: [alert, support-lines]

- id: alert
  term: Алерт
  en: Alert
  definition: Автоматическое уведомление мониторинга о превышении порога (задержка, доля ошибок, рост очереди) с приоритетом, получателем и ссылкой на процедуру runbook.
  topic: operations
  match: ['алерт*', '~alert']
  seeAlso: [runbook]

- id: trace-id
  term: Сквозной идентификатор (traceId)
  en: Trace ID, correlation ID
  definition: Идентификатор, который передаётся во все вызовы одной операции между системами и пишется в логи и журнал аудита — по нему собирают путь операции. Стандартный способ передачи — заголовок traceparent (W3C Trace Context).
  topic: operations
  match: [traceId, correlationId, traceparent]
  seeAlso: [alert]

- id: replay
  term: Повторный запуск (replay)
  en: Replay
  definition: Повторное выполнение операций или повторная отправка сообщений после устранения причины сбоя. Безопасен, если операции идемпотентны, результат не сделан вручную и операция всё ещё нужна.
  topic: operations
  match: ['~replay', 'повторн* запуск*']
  seeAlso: [idempotency, dlq]

- id: rate-limit
  term: Ограничение частоты запросов
  en: Rate limiting
  definition: Защита сервиса от перегрузки — не более заданного числа запросов от клиента за период. При превышении принято отвечать 429 Too Many Requests и указывать в Retry-After, когда повторить.
  topic: integrations
  match: ['rate limit*', 'ограничени* частоты']
  seeAlso: [backward-compatibility]

# ── Релиз и прод ────────────────────────────────────────────────────

- id: environment
  term: Среда (стенд)
  en: Environment
  definition: Отдельная установка системы со своей конфигурацией, данными и смежными системами — DEV, TEST, UAT, PREPROD, PROD. На всех средах должна работать одна и та же сборка; отличаются только конфигурация и секреты.
  topic: release
  match: ['стенд*', '~environment']
  seeAlso: [preprod, prod]

- id: preprod
  term: PREPROD
  en: Pre-production, staging
  definition: Среда, максимально похожая на продуктив по конфигурации, объёму данных и смежным системам. На ней проводят нагрузочные тесты и репетируют выкладку, миграцию и откат.
  topic: release
  match: [PREPROD, '~staging', 'препрод*']
  seeAlso: [environment, prod]

- id: prod
  term: Продуктив (PROD)
  en: Production
  definition: Среда, где система работает с реальными пользователями и данными. Изменения сюда попадают только через выкладку релиза или запрос на изменение.
  topic: release
  match: [PROD, 'продуктив*']
  seeAlso: [environment, preprod]

- id: secrets-store
  term: Хранилище секретов
  en: Secrets management, vault
  definition: Защищённое хранилище паролей, ключей API, сертификатов и других секретов с контролем доступа и журналом обращений. В репозитории и конфигурации хранится только имя секрета, а значение приложение получает при запуске.
  topic: release
  match: ['хранилищ* секретов', '~vault']
  seeAlso: [environment]

- id: db-migration
  term: Скрипт миграции БД
  en: Database migration script
  definition: Версионированный скрипт изменения схемы БД, который применяется один раз при выкладке; номер применённой версии хранится в самой БД. Не путать с миграцией данных — переносом данных из старой системы.
  topic: release
  match: ['скрипт* миграции', 'migration script*']
  seeAlso: [expand-contract]
  notToConfuse: Миграция данных — загрузка существующих данных из старых систем, отдельный шаг внедрения.

- id: expand-contract
  term: Расширение и сужение
  en: Expand and contract, parallel change
  definition: Способ несовместимого изменения в несколько совместимых шагов — сначала добавить новое рядом со старым, перевести на него всех потребителей и только потом удалить старое.
  topic: release
  match: ['~expand/contract', '~expand and contract', '~parallel change', 'расширени* и сужени*']
  seeAlso: [backward-compatibility, db-migration]

- id: provider-consumer
  term: Поставщик и потребитель
  en: Provider, consumer
  definition: Поставщик (provider) — сторона, которая предоставляет API или публикует события; потребитель (consumer) — сторона, которая вызывает API или читает события. От того, кто должен понять изменение первым, зависит порядок выкладки.
  topic: release
  match: ['~provider', 'поставщик* API']
  seeAlso: [backward-compatibility, tolerant-reader]

- id: deployment
  term: Выкладка
  en: Deployment
  definition: Установка новой версии на среду. Может не совпадать с выпуском (release) — моментом, когда изменения становятся доступны пользователям, например при включении фича-флага.
  topic: release
  match: ['выкладк*', 'выкатк*']
  seeAlso: [feature-flag]

- id: feature-flag
  term: Фича-флаг
  en: Feature flag, feature toggle
  definition: Настройка, которая включает или выключает функцию без новой выкладки — для всех, для части пользователей или подразделений. Позволяет выложить код заранее, включать постепенно и откатывать выключением.
  topic: release
  match: ['фича-флаг*', 'feature flag*', 'feature toggle*']
  seeAlso: [deployment, canary]

- id: release-notes
  term: Release notes
  en: Release notes
  definition: Описание релиза для тех, кого он касается — что изменилось, что нового нужно знать сопровождению и пользователям, известные ограничения.
  topic: release
  match: ['~release notes', 'заметк* к релиз*']

- id: go-no-go
  term: Go/no-go
  en: Go/no-go decision
  definition: Решение перед выкладкой или включением — выпускать или нет — по заранее согласованным критериям. Если критерий не выполнен, выпуск переносится.
  topic: release
  match: ['~go/no-go']
  seeAlso: [release-notes]

- id: roll-forward
  term: Исправление вперёд
  en: Roll forward, fix forward
  definition: Устранение проблемы после релиза выпуском исправленной версии вместо отката на предыдущую. Выбирают, когда откат невозможен или дороже исправления.
  topic: release
  match: ['~roll forward', '~fix forward', 'исправлени* вперёд']
  seeAlso: [cutover]

- id: canary
  term: Канареечный релиз
  en: Canary release
  definition: Выпуск новой версии сначала на малую долю трафика или пользователей с наблюдением за метриками; доля растёт, только если метрики в норме.
  topic: release
  match: ['~canary', 'канареечн*']
  seeAlso: [blue-green, feature-flag]

- id: blue-green
  term: Сине-зелёное развёртывание
  en: Blue-green deployment
  definition: Две одинаковые копии продуктива — работающая и новая. Новая версия выкладывается на свободную копию, проверяется и получает трафик переключением; откат — переключение обратно.
  topic: release
  match: ['~blue-green', 'сине-зелён*']
  seeAlso: [canary]

- id: hypercare
  term: Усиленное сопровождение
  en: Hypercare
  definition: Период сразу после запуска, когда команда проекта вместе с сопровождением ежедневно смотрит метрики и разбирает каждое отклонение. Заканчивается по критерию, после чего действует обычная модель сопровождения.
  topic: release
  match: ['~hypercare', 'усиленн* сопровождени*']
  seeAlso: [prod-verification]

- id: semver
  term: Семантическое версионирование
  en: Semantic versioning, SemVer
  definition: Схема номера версии MAJOR.MINOR.PATCH — MAJOR растёт при несовместимых изменениях, MINOR — при совместимых новых возможностях, PATCH — при исправлениях.
  topic: release
  match: ['~SemVer', 'семантическ* версионировани*']
  seeAlso: [backward-compatibility]

- id: change-freeze
  term: Мораторий на изменения
  en: Change freeze
  definition: Период, когда выкладки в продуктив запрещены или разрешены только аварийные — например, перед закрытием года или массовым событием.
  topic: release
  match: ['~change freeze', 'мораторий* на изменения']

# ── Безопасность ────────────────────────────────────────────────────

- id: authentication
  term: Аутентификация
  en: Authentication
  definition: Проверка, что субъект — тот, за кого себя выдаёт, по паролю, сертификату, токену, Kerberos-билету, второму фактору. При неудаче API отвечает 401.
  topic: security
  match: ['аутентификаци*', '~authentication']
  seeAlso: [authorization, mfa]
  notToConfuse: Авторизация — проверка, что уже известному субъекту можно сделать.

- id: authorization
  term: Авторизация
  en: Authorization
  definition: Проверка, что известному субъекту разрешено выполнить операцию над конкретным объектом. При отказе API отвечает 403 (или 404, если нельзя раскрывать существование объекта).
  topic: security
  match: ['авторизаци*', '~authorization']
  seeAlso: [authentication, rbac, abac, object-level-authorization]

- id: abac
  term: ABAC
  en: Attribute-based access control
  definition: Модель доступа, в которой решение принимается по атрибутам пользователя (подразделение, должность), объекта (владелец, сумма) и контекста (время, канал). Часто дополняет RBAC — роль даёт операцию, атрибуты ограничивают объекты.
  topic: security
  match: [ABAC]
  seeAlso: [rbac]

- id: object-level-authorization
  term: Авторизация на уровне объекта
  en: Object-level authorization
  definition: Проверка, что пользователю можно работать именно с этим объектом (сотрудником, заявкой, счётом), а не только вызывать операцию. Её отсутствие позволяет перебором идентификаторов получать чужие данные — самая частая уязвимость API (BOLA).
  topic: security
  match: ['на уровне объекта', '~BOLA']
  seeAlso: [authorization]

- id: least-privilege
  term: Минимальные привилегии
  en: Least privilege
  definition: Принцип ИБ — у пользователя или системы только те права, которые нужны для работы, и только на время работы.
  topic: security
  match: ['минимальн* привилеги*', '~least privilege']
  seeAlso: [sod, need-to-know]

- id: need-to-know
  term: Необходимость знать
  en: Need-to-know
  definition: Принцип ИБ — данные видит только тот, кому они нужны для выполнения задачи, даже если формально уровень доступа позволяет больше.
  topic: security
  match: ['необходимост* знать', '~need-to-know']
  seeAlso: [least-privilege]

- id: mfa
  term: Многофакторная аутентификация
  en: Multi-factor authentication, MFA
  definition: Аутентификация минимум двумя факторами разных типов — знание (пароль), владение (телефон, токен), свойство (биометрия). Два пароля — не MFA.
  topic: security
  match: [MFA, 2FA, 'многофакторн* аутентификаци*', 'двухфакторн* аутентификаци*']
  seeAlso: [authentication]

- id: service-account
  term: Сервисная учётная запись
  en: Service account
  definition: Учётная запись, под которой работает система или интеграция, а не человек. Нужны владелец, минимальные права, отдельная запись на интеграцию и среду, секрет в хранилище со сроком замены.
  topic: security
  match: ['сервисн* учётн* запис*', '~service account']
  seeAlso: [least-privilege, secrets-store, pam]

- id: access-token
  term: Токен доступа
  en: Access token
  definition: Короткоживущий токен, который клиент предъявляет API (обычно в заголовке Authorization Bearer). Если это JWT, API проверяет его локально, поэтому до истечения срока его нельзя отозвать — срок делают коротким.
  topic: security
  match: ['токен* доступа', '~access token']
  seeAlso: [refresh-token, jwt, oauth2]

- id: refresh-token
  term: Токен обновления
  en: Refresh token
  definition: Долгоживущий токен для получения нового токена доступа без повторного входа. Хранится и проверяется сервером авторизации, поэтому его можно отозвать — через это выход и блокировка прекращают доступ.
  topic: security
  match: ['токен* обновления', '~refresh token']
  seeAlso: [access-token]

- id: session-timeout
  term: Тайм-аут бездействия
  en: Idle timeout
  definition: Время без действий пользователя, после которого сессия завершается и нужен повторный вход. Задаётся вместе с абсолютным сроком сессии по требованиям ИБ.
  topic: security
  match: ['тайм-аут* бездействия', '~idle timeout']
  seeAlso: [access-token]

- id: encryption-transit-rest
  term: Шифрование при передаче и при хранении
  en: Encryption in transit, at rest
  definition: При передаче — защищённый канал (TLS, mTLS) на каждом соединении. При хранении — шифрование дисков, БД, резервных копий и при необходимости отдельных полей; ключи хранятся отдельно от данных.
  topic: security
  match: ['~in transit', '~at rest']
  seeAlso: [tls, mtls, secrets-store]

- id: hashing
  term: Хэширование паролей
  en: Password hashing
  definition: Хранение пароля в виде необратимого хэша, вычисленного специальной медленной функцией с солью. В отличие от шифрования, исходный пароль восстановить нельзя — только сбросить.
  topic: security
  match: ['хэширован*', 'хэш паро*', '~hashing']

- id: data-minimization
  term: Минимизация данных
  en: Data minimization
  definition: Принцип защиты ПДн — собирать, передавать и хранить только те данные, которые нужны для заявленной цели, и не дольше, чем нужно.
  topic: security
  match: ['минимизаци* ПДн', 'минимизаци* данных']
  seeAlso: [pdn, masking]

- id: masking
  term: Маскирование данных
  en: Data masking
  definition: Отображение чувствительных данных частично (последние цифры номера карты, телефона) или подмена их в копиях для тестов и аналитики (обезличивание).
  topic: security
  match: ['маскировани*', 'обезличивани*', 'обезличенн*']
  seeAlso: [data-minimization, pdn]

- id: audit-log
  term: Журнал аудита
  en: Audit log, audit trail
  definition: Неизменяемый журнал действий — кто, что, над чем, на каком основании, с каким результатом и когда. Хранится годы, читают ИБ и аудит; в отличие от технических логов служит доказательством, а не средством отладки.
  topic: security
  match: ['журнал* аудита', '~audit log', '~audit trail']
  seeAlso: [siem, trace-id]

- id: threat-modeling
  term: Моделирование угроз
  en: Threat modeling
  definition: Систематический поиск угроз системе по схеме потоков данных и границам доверия, например по STRIDE, с мерой и статусом для каждой угрозы.
  topic: security
  match: ['моделировани* угроз', 'модел* угроз', 'threat model*']
  seeAlso: [stride, trust-boundary]

- id: stride
  term: STRIDE
  en: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege
  definition: Шесть категорий угроз для моделирования — подмена, изменение, отказ от авторства, раскрытие информации, отказ в обслуживании, повышение привилегий.
  topic: security
  match: [STRIDE]
  seeAlso: [threat-modeling]

- id: privileged-account
  term: Привилегированная учётная запись
  en: Privileged account
  definition: Учётная запись с правами изменять систему, права других пользователей, настройки безопасности или журнал — администраторы, сервисные учётные записи, доступ к БД продуктива. Выдаётся отдельно от рабочей, на время и через PAM.
  topic: security
  match: ['привилегированн* учётн* запис*', 'привилегированн* доступ*', '~privileged account']
  seeAlso: [pam, jit-access, break-glass]

- id: jit-access
  term: Доступ на время
  en: Just-in-time access, JIT
  definition: Выдача прав по запросу на ограниченный срок (обычно часы) с согласованием и автоматическим отзывом вместо постоянных прав.
  topic: security
  match: ['~just-in-time', 'доступ* на время']
  seeAlso: [privileged-account, pam]

- id: break-glass
  term: Аварийный доступ
  en: Break-glass access
  definition: Заранее подготовленная процедура получения привилегированного доступа без обычного согласования при аварии — с немедленным уведомлением ИБ, записью действий и обязательным разбором после.
  topic: security
  match: ['~break-glass', 'аварийн* доступ*']
  seeAlso: [privileged-account]

- id: privilege-creep
  term: Накопление прав
  en: Privilege creep, access creep
  definition: Постепенный рост прав сотрудника сверх нужных, когда при переводах и разовых задачах новые права выдаются, а старые не отзываются. Его ловят процессом Mover и ресертификацией.
  topic: security
  match: ['накоплени* прав', '~privilege creep']
  seeAlso: [recertification, jml]

# ── Инфраструктура и эксплуатация ───────────────────────────────

- id: container
  term: Контейнер (Docker)
  en: Container
  definition: Приложение, упакованное в образ вместе со всеми зависимостями и запущенное изолированно. Один образ запускается одинаково на любой среде; конфигурация и секреты передаются снаружи.
  topic: software
  match: ['~Docker', 'Docker-контейнер*']
  seeAlso: [kubernetes, environment]
  notToConfuse: Контейнер C4 — любая отдельно разворачиваемая часть системы, а не обязательно Docker-контейнер.

- id: kubernetes
  term: Kubernetes
  en: Kubernetes, K8s
  definition: Оркестратор контейнеров — запускает несколько экземпляров (подов) сервиса, перезапускает упавшие, распределяет нагрузку и выкладывает новые версии постепенно. Для требований важно, что экземпляров несколько и любой может перезапуститься.
  topic: software
  match: ['~Kubernetes', K8s, '~OpenShift']
  seeAlso: [container, deployment]

- id: merge-request
  term: Merge request
  en: Merge request, pull request
  definition: Запрос на слияние изменений в основную ветку репозитория с ревью и обсуждением. В docs-as-code через него проходят изменения требований и контрактов.
  topic: software
  match: ['~merge request', '~pull request', 'MR']
  seeAlso: [docs-as-code, ci-cd]

- id: log-aggregation
  term: Система логов
  en: Log aggregation, ELK
  definition: Централизованный сбор, хранение и поиск логов всех сервисов — Elasticsearch или OpenSearch с Kibana (стек ELK), Loki, Graylog. Позволяет найти все записи одной операции по traceId.
  topic: software
  match: ['~ELK', '~Kibana', '~OpenSearch']
  seeAlso: [trace-id, metrics]

- id: metrics
  term: Метрика
  en: Metric
  definition: Числовой показатель во времени — число запросов, доля ошибок, задержка, длина очереди. Собирается системой метрик (например, Prometheus) и показывается на дашборде (например, Grafana); по метрикам срабатывают алерты.
  topic: software
  match: ['~Prometheus', '~Grafana']
  seeAlso: [alert, log-aggregation]

- id: distributed-tracing
  term: Распределённая трассировка
  en: Distributed tracing
  definition: Запись пути одного запроса через все сервисы со временем каждого участка (Jaeger, OpenTelemetry). Показывает, где в цепочке ошибка или задержка.
  topic: software
  match: ['распределённ* трассировк*', '~Jaeger', '~OpenTelemetry']
  seeAlso: [trace-id]

- id: api-gateway
  term: API-шлюз
  en: API gateway
  definition: Единая точка входа перед группой сервисов — маршрутизация, проверка токенов, ограничение частоты, журналирование. Ошибки 502 и 504 обычно приходят от шлюза, когда сервис не ответил.
  topic: software
  match: ['API-шлюз*', '~API gateway']
  seeAlso: [rate-limit]
