openapi: 3.1.0
info:
  title: Own Account Transfer API
  version: 1.0.0
  description: >
    Concept API for transferring funds between accounts owned by the same
    authenticated retail banking customer.
servers:
  - url: https://api.example-bank.test/api/v1
    description: Example environment

tags:
  - name: Accounts
  - name: Transfers

security:
  - bearerAuth: []

paths:
  /accounts:
    get:
      tags: [Accounts]
      summary: Get customer accounts available for own-account transfer
      parameters:
        - in: query
          name: operation
          required: true
          schema:
            type: string
            const: own-transfer
      responses:
        '200':
          description: Accounts available to the authenticated customer
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transfers/validate:
    post:
      tags: [Transfers]
      summary: Validate transfer parameters before creation
      operationId: validateOwnAccountTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transfers:
    post:
      tags: [Transfers]
      summary: Create a transfer between customer's own accounts
      operationId: createOwnAccountTransfer
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Unique key for one customer command.
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '202':
          description: Transfer accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key has already been used with different request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IDEMPOTENCY_KEY_REUSED
                message: Idempotency key already used for another request
                traceId: 01J9ABCDEF0123456789
        '422':
          description: Business validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transfers/{transferId}:
    get:
      tags: [Transfers]
      summary: Get transfer status
      operationId: getOwnAccountTransfer
      parameters:
        - in: path
          name: transferId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Transfer was not found or is not available to the authenticated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Account:
      type: object
      required:
        - accountId
        - displayName
        - maskedNumber
        - currency
        - availableBalance
        - status
        - canDebit
        - canCredit
      properties:
        accountId:
          type: string
          example: acc-10001
        displayName:
          type: string
          example: Дебетовый счёт
        maskedNumber:
          type: string
          example: "•••• 1234"
        currency:
          type: string
          enum: [RUB]
        availableBalance:
          type: number
          multipleOf: 0.01
          example: 125000.45
        status:
          type: string
          example: ACTIVE
        canDebit:
          type: boolean
        canCredit:
          type: boolean

    TransferRequest:
      type: object
      additionalProperties: false
      required:
        - sourceAccountId
        - destinationAccountId
        - amount
        - currency
      properties:
        sourceAccountId:
          type: string
          example: acc-10001
        destinationAccountId:
          type: string
          example: acc-20002
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 10000.00
        currency:
          type: string
          enum: [RUB]

    ValidationResult:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reasonCode:
          type: [string, 'null']
          example: INSUFFICIENT_FUNDS
        message:
          type: [string, 'null']
          example: Недостаточно средств для выполнения перевода

    Transfer:
      type: object
      required:
        - transferId
        - status
        - sourceAccountId
        - destinationAccountId
        - amount
        - currency
        - createdAt
      properties:
        transferId:
          type: string
          example: tr-987654
        status:
          $ref: '#/components/schemas/TransferStatus'
        sourceAccountId:
          type: string
          example: acc-10001
        destinationAccountId:
          type: string
          example: acc-20002
        amount:
          type: number
          multipleOf: 0.01
          example: 10000.00
        currency:
          type: string
          enum: [RUB]
        createdAt:
          type: string
          format: date-time
          example: '2026-10-01T18:41:12Z'
        completedAt:
          type: [string, 'null']
          format: date-time
          example: '2026-10-01T18:41:13Z'
        failureCode:
          type: [string, 'null']

    TransferStatus:
      type: string
      enum:
        - CREATED
        - PROCESSING
        - COMPLETED
        - FAILED

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INSUFFICIENT_FUNDS
        message:
          type: string
          example: Недостаточно средств для выполнения перевода
        traceId:
          type: string
          example: 01J9ABCDEF0123456789

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Access to the requested account or operation is denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: Dependent service is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
